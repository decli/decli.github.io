<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>页面不存在</title>
    <link rel="icon" href="/ftms/favicon.svg" type="image/svg+xml" />

    <script>
      /* ── /ftms/ 深链接的兜底 ──
         /ftms/ 下是个单页应用，刷新 /ftms/follow-ups 这种地址时 GitHub Pages
         正常会回落到 ftms/404.html（构建时由 index.html 拷来），路由读 pathname
         就能渲染对，压根走不到这一页。

         但「Pages 会不会替子目录去找最近的那个 404.html」，官方文档说得并不硬，
         而它一旦不这么做，后果是**所有深链接刷新后全 404**。所以这里补一道：
         把原始路径记进 sessionStorage 再跳回 /ftms/，应用启动时取回来用
         replaceState 还原（见 src/main.tsx 的 RESCUE_KEY）。用户看到的地址
         和刷新前一模一样。

         这段要写在 <head> 最前面：跳转越早，越不会先闪一下 404 的内容。 */
      (function () {
        var p = location.pathname;
        if (p.indexOf("/ftms/") === 0) {
          try {
            sessionStorage.setItem("ftms:deeplink", p + location.search + location.hash);
          } catch (e) {}
          location.replace("/ftms/");
        }
      })();
    </script>

    <style>
      :root { --bg:#f7f8fb; --text:#1a2233; --dim:#6b7688; --accent:#3b5bd6; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0b1220; --text:#e8eefb; --dim:#8b98ae; --accent:#7f9bff; }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        padding: 40px 20px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.7 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      b { font-size: 42px; letter-spacing: 0.04em; }
      p { margin: 0; color: var(--dim); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <b>404</b>
    <p>这个地址上没有东西。</p>
    <p><a href="/">回首页</a> · <a href="/ftms/">信风 Tradewind</a></p>
  </body>
</html>
