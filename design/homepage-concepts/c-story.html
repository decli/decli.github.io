<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex,nofollow" />
    <title>方案 C · 问题墙 — 首页交互草案</title>
    <style>
      /* ═══════════════════════════════════════════════════════════════
         方案 C 「问题墙」 —— 每个工具都是一句抱怨的答案
         ─────────────────────────────────────────────────────────────
         范式：克制剂量的叙事滚动。站点口号「嫌它麻烦，就自己写一个」
         被当成字面结构：一条故事线，先给「麻烦」（口语的抱怨），
         再给「答案」（项目卡）。滚动只驱动入场，不劫持；
         任务型访客随时可跳——首屏就有「直接挑工具」，
         右侧进度轨可点跳，结尾是全量紧凑索引。
         文案是这个方案的主角：写得不好，形式就塌。
         ═══════════════════════════════════════════════════════════════ */
      :root {
        --bg: #f7f6f3;
        --text: #191a1c;
        --text-2: #565c68;
        --text-3: #8f96a3;
        --line: rgba(25, 26, 28, 0.1);
        --line-2: rgba(25, 26, 28, 0.22);
        --brand: #2f54d1;
        --live: #0f9d58;
        --hl: rgba(47, 84, 209, 0.08);
        --card: #fff;
        --shadow: 0 1px 2px rgba(25, 26, 28, 0.04), 0 14px 36px -22px rgba(25, 26, 28, 0.2);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c0d10;
          --text: #ecedf0;
          --text-2: #9aa1af;
          --text-3: #646b79;
          --line: rgba(236, 237, 240, 0.1);
          --line-2: rgba(236, 237, 240, 0.24);
          --brand: #8ea4ff;
          --live: #34d399;
          --hl: rgba(142, 164, 255, 0.1);
          --card: #14161b;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 18px 44px -24px rgba(0, 0, 0, 0.7);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c0d10;
        --text: #ecedf0;
        --text-2: #9aa1af;
        --text-3: #646b79;
        --line: rgba(236, 237, 240, 0.1);
        --line-2: rgba(236, 237, 240, 0.24);
        --brand: #8ea4ff;
        --live: #34d399;
        --hl: rgba(142, 164, 255, 0.1);
        --card: #14161b;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 18px 44px -24px rgba(0, 0, 0, 0.7);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.8 "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei",
          system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      .serif { font-family: "Songti SC", "Noto Serif SC", "Noto Serif CJK SC", STSong, SimSun, Georgia, serif; }

      .col { width: min(780px, 100%); margin: 0 auto; padding: 0 clamp(20px, 4.5vw, 30px); }

      /* ── 顶栏 ── */
      .top { display: flex; align-items: center; gap: 16px; padding-top: 26px; font-size: 14px; }
      .top .name { font-weight: 700; }
      .top .spacer { flex: 1; }
      .top a, .top button {
        border: 0; background: none; padding: 0;
        color: var(--text-3); font: inherit; cursor: pointer; text-decoration: none;
        transition: color 0.14s;
      }
      .top a:hover, .top button:hover { color: var(--text); }
      .top a:focus-visible, .top button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 2px; }

      /* ── 首屏 ── */
      .hero { min-height: 78dvh; display: grid; align-content: center; gap: 22px; padding: 40px 0 60px; }
      .hero h1 {
        margin: 0;
        font-size: clamp(38px, 7.2vw, 68px);
        font-weight: 700;
        line-height: 1.28;
        letter-spacing: 0.01em;
      }
      .hero h1 em { font-style: normal; color: var(--brand); }
      .hero p { margin: 0; max-width: 40ch; color: var(--text-2); font-size: clamp(15px, 2vw, 17px); }
      .hero .go { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
      .cta {
        display: inline-flex; align-items: center; gap: 7px;
        height: 42px; padding: 0 19px; border-radius: 12px;
        font-size: 14.5px; font-weight: 650; text-decoration: none;
        transition: scale 0.12s, filter 0.15s, border-color 0.15s, color 0.15s;
      }
      .cta:active { scale: 0.96; }
      .cta:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .cta.solid { background: var(--brand); color: #fff; }
      .cta.solid:hover { filter: brightness(1.08); }
      .cta.line { border: 1px solid var(--line-2); color: var(--text-2); }
      .cta.line:hover { color: var(--text); border-color: var(--text-3); }

      /* ── 故事线 ── */
      .story { position: relative; padding: 10px 0 30px; }
      /* 脊线：一条从头到尾的细线，把 11 次「麻烦→答案」串在一根线上 */
      .story::before {
        content: "";
        position: absolute; top: 0; bottom: 0; left: 7px;
        width: 1px; background: var(--line-2);
      }
      .chapter {
        position: relative;
        margin: 54px 0 6px; padding-left: 34px;
        color: var(--text-3); font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
      }
      .step { position: relative; padding: 26px 0 26px 34px; }
      /* 线上的节点：走到哪，亮到哪 */
      .step::before {
        content: "";
        position: absolute; left: 3px; top: 40px;
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--bg);
        border: 1.5px solid var(--line-2);
        transition: border-color 0.4s, background-color 0.4s;
      }
      .step.on::before { border-color: var(--brand); background: var(--brand); }

      .gripe {
        margin: 0 0 18px;
        max-width: 34ch;
        font-size: clamp(19px, 3vw, 23px);
        line-height: 1.6;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .gripe::before { content: "「"; color: var(--text-3); }
      .gripe::after { content: "」"; color: var(--text-3); }
      .so { display: block; margin: 0 0 14px; color: var(--text-3); font-size: 13px; }

      /* 答案卡：紧凑横排 */
      .ans {
        display: flex; align-items: flex-start; gap: 14px;
        max-width: 560px;
        padding: 16px 18px;
        border: 1px solid var(--line); border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow);
        color: inherit; text-decoration: none;
        transition: border-color 0.16s, translate 0.16s;
      }
      .ans:hover { border-color: var(--line-2); translate: 0 -2px; }
      .ans:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .mark {
        width: 40px; height: 40px; border-radius: 11px; flex: none;
        display: grid; place-content: center; overflow: hidden; color: #fff;
        margin-top: 2px;
      }
      .mark img { width: 40px; height: 40px; display: block; }
      .ans .bd { flex: 1; min-width: 0; }
      .ans h3 { margin: 0 0 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15.5px; font-weight: 680; }
      .badge {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 0 8px; border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--live) 42%, transparent);
        color: var(--live); font-size: 10.5px; font-weight: 650; line-height: 1.7;
      }
      .badge::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
      .ans p { margin: 0; color: var(--text-2); font-size: 13px; line-height: 1.65; }
      .ans .goto { flex: none; align-self: center; color: var(--text-3); font-size: 15px; transition: color 0.14s, transform 0.16s; }
      .ans:hover .goto { color: var(--brand); transform: translate(2px, -2px); }
      .ps { margin: 10px 0 0; padding-left: 2px; color: var(--text-3); font-size: 12.5px; max-width: 56ch; }
      .ps a { color: inherit; }

      /* 入场：只在启用 JS 时先藏后放，JS 挂了内容照样全在 */
      .js .step .gripe, .js .step .so, .js .step .ans, .js .step .ps { opacity: 0; translate: 0 14px; transition: opacity 0.55s ease-out, translate 0.55s ease-out; }
      .js .step.on .gripe, .js .step.on .so, .js .step.on .ans, .js .step.on .ps { opacity: 1; translate: 0 0; }
      .js .step.on .so { transition-delay: 0.1s; }
      .js .step.on .ans { transition-delay: 0.16s; }
      .js .step.on .ps { transition-delay: 0.24s; }

      /* ── 结尾：全量紧凑索引 ── */
      .all { padding: 70px 0 40px; }
      .all h2 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 32px); font-weight: 700; }
      .all .sub { margin: 0 0 24px; color: var(--text-3); font-size: 14px; }
      .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
      .tile {
        display: flex; align-items: center; gap: 10px;
        padding: 11px 13px;
        border: 1px solid var(--line); border-radius: 13px;
        background: var(--card);
        color: inherit; text-decoration: none; font-size: 13.5px; font-weight: 620;
        transition: border-color 0.16s, translate 0.16s;
      }
      .tile:hover { border-color: var(--line-2); translate: 0 -2px; }
      .tile:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .tile .mark { width: 28px; height: 28px; border-radius: 8px; margin: 0; }
      .tile .mark img { width: 28px; height: 28px; }
      .tile .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tile .li { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }

      footer { padding: 26px 0 46px; color: var(--text-3); font-size: 12.5px; border-top: 1px solid var(--line); }

      /* ── 进度轨：右缘一列点，走到哪亮到哪，点了就跳 ── */
      .rail {
        position: fixed; right: 18px; top: 50%; translate: 0 -50%;
        display: flex; flex-direction: column; gap: 10px; z-index: 5;
      }
      .rail a {
        position: relative;
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--line-2);
        transition: background-color 0.2s, scale 0.15s;
      }
      .rail a:hover { scale: 1.5; }
      .rail a.on { background: var(--brand); }
      .rail a:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
      .rail a .tip {
        position: absolute; right: 16px; top: 50%; translate: 0 -50%;
        padding: 3px 10px; border-radius: 8px;
        background: var(--card); border: 1px solid var(--line);
        box-shadow: var(--shadow);
        color: var(--text-2); font-size: 12px; white-space: nowrap;
        opacity: 0; pointer-events: none; transition: opacity 0.15s;
      }
      .rail a:hover .tip, .rail a:focus-visible .tip { opacity: 1; }

      /* ── 常驻直达：滚过首屏后浮出 ── */
      .skip {
        position: fixed; top: 16px; right: 18px; z-index: 6;
        display: inline-flex; align-items: center; gap: 6px;
        height: 34px; padding: 0 14px; border-radius: 999px;
        border: 1px solid var(--line-2);
        background: var(--card);
        box-shadow: var(--shadow);
        color: var(--text-2); font-size: 13px; font-weight: 620; text-decoration: none;
        opacity: 0; translate: 0 -6px; pointer-events: none;
        transition: opacity 0.25s, translate 0.25s, color 0.14s;
      }
      .skip.show { opacity: 1; translate: 0 0; pointer-events: auto; }
      .skip:hover { color: var(--text); }
      .skip:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

      .sketchtag {
        position: fixed; left: 14px; bottom: 14px; z-index: 5;
        padding: 4px 11px; border-radius: 999px;
        border: 1px solid var(--line-2); background: var(--card);
        color: var(--text-3); font-size: 11px; font-weight: 650; letter-spacing: 0.06em;
      }

      @media (max-width: 900px) {
        .rail { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .js .step .gripe, .js .step .so, .js .step .ans, .js .step .ps { opacity: 1; translate: none; transition: none; }
        .ans, .tile, .cta, .skip, .rail a { transition: none; }
        .ans:hover, .tile:hover { translate: none; }
        .cta:active { scale: 1; }
        .rail a:hover { scale: 1; }
      }
    </style>
  </head>
  <body>
    <div class="col">
      <header class="top">
        <span class="name">decli</span>
        <span class="spacer"></span>
        <a href="https://github.com/decli" target="_blank" rel="noopener noreferrer">GitHub</a>
        <button id="theme" aria-label="切换明暗">明暗</button>
      </header>

      <section class="hero">
        <h1 class="serif">嫌它麻烦，<br /><em>就自己写一个。</em></h1>
        <p>十二个项目，都是这么来的。有的替自己省事，有的给家里人做的。往下翻，是每一个的来历。</p>
        <div class="go">
          <a class="cta solid" href="#story">看它们怎么来的 ↓</a>
          <a class="cta line" href="#all">直接挑工具</a>
        </div>
      </section>

      <div class="story" id="story"><!-- JS 生成 --></div>

      <section class="all" id="all">
        <h2>十二个，全在这。</h2>
        <p class="sub">绿点 = 在线可用，免注册。其余点进去是源码仓库。</p>
        <div class="tiles" id="tiles"></div>
      </section>

      <footer>© decli · 版权所有 2026 · Powered by GitHub Pages</footer>
    </div>

    <nav class="rail" id="rail" aria-label="故事进度"></nav>
    <a class="skip" id="skip" href="#all">全部工具 ⊞</a>
    <span class="sketchtag">草案 C · 问题墙</span>

    <script>
      document.documentElement.classList.add("js");

      const P = [
        { slug: "ftms", name: "信风 Tradewind", gripe: "订单一多，Excel 就开始打架：报价一版、跟单一版、退税又一版 —— 哪版是真的？", brief: "外贸全流程管理：询盘到退税，一个 PI 号串到底。", icon: "/ftms/favicon.svg", glyph: "wind", tint: ["#3b5bd6", "#06b6d4"], href: "/ftms/", repo: "ftms", ch: "替自己省事 · 在线应用" },
        { slug: "ems", name: "EMS 外贸营销系统", gripe: "找买家一个工具、发开发信一个工具、跟线索又一个工具 —— 三份数据互相对不上。", brief: "AI Agent 驱动的外贸增长系统，从找到买家到收到货款跑在同一套数据上。", icon: "/ems/favicon.svg", glyph: "spark", tint: ["#7c5cff", "#d946ef"], href: "/ems/", repo: "ems" },
        { slug: "wxformat3", name: "WxMark", gripe: "公众号后台排一篇文章，格式调了四十分钟，预览一看 —— 还是歪的。", brief: "Markdown 写作，一键复制成带样式的 HTML 粘进后台。", icon: "/wxformat3/favicon.svg", glyph: "format", tint: ["#07c160", "#059669"], href: "/wxformat3/", repo: "wxformat3" },
        { slug: "ip-geo", name: "IP 归属地监控", gripe: "代理到底生效没？又开一个测 IP 的网站…… 今天第八次。", brief: "出口国家代码直接写在工具栏徽标上，一眼可见。", glyph: "globe", tint: ["#0ea5e9", "#2563eb"], repo: "IP_Geolocation_Extension_Chrome", ch: "顺手写的 · 浏览器扩展", ps: "最早写过一个简单版 IP Display，后来整个重写成了这个 —— 旧的留在仓库里做个记录。" },
        { slug: "jobornot", name: "职得投 JobOrNot", gripe: "这个岗位到底值不值得投？对着 JD 犹豫了十分钟，还是没底。", brief: "简历和 JD 摆在一起比，诚实回答「值不值得投、怎么投更好」。", glyph: "target", tint: ["#f59e0b", "#ef4444"], repo: "JobOrNot" },

        { slug: "pagescroll", name: "PageScroll", gripe: "三万字的长页读到一半想回顶部，滚轮摇到手酸。", brief: "任意网页上的悬浮胶囊，一点回顶或到底。", glyph: "scroll", tint: ["#06b6d4", "#0891b2"], repo: "pagescroll", ch: "顺手写的 · 用户脚本" },
        { slug: "bing-wallpaper", name: "Bing 壁纸批量下载", gripe: "Bing 的壁纸真好看。右键另存为……另存为……另存为。", brief: "列表页勾选多张，4K 原图一次批量下载。", glyph: "download", tint: ["#ec4899", "#db2777"], repo: "BingWDByte4KBatchDownloader" },

        { slug: "chinesechess", name: "老爸下象棋", gripe: "老爸想在平板上下象棋，市面上的棋盘小得他看不清。", brief: "按 14 寸横屏放大的中国象棋，三档 AI，落子有语音。", glyph: "chess", tint: ["#a16207", "#854d0e"], repo: "chinesechess03" },
      ];
      const EXTRA_TILE = { slug: "ip-display", name: "IP Display", glyph: "globe", tint: ["#64748b", "#475569"], repo: "IPDisplayExtension" };
      const GLYPHS = {

      };
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const url = (p) => p.href || `https://github.com/decli/${p.repo}`;
      const mark = (p, size) =>
        `<span class="mark" style="background:linear-gradient(140deg,${p.tint[0]},${p.tint[1]})">` +

        <section class="step" id="s-${p.slug}" aria-label="${esc(p.name)}">
          <p class="gripe serif">${esc(p.gripe)}</p>
          <span class="so">—— 于是有了</span>
          <a class="ans" href="${url(p)}" target="_blank" rel="noopener noreferrer">
            ${mark(p, 22)}
            <span class="bd">
              <h3>${esc(p.name)}${p.href ? '<span class="badge">在线</span>' : ""}</h3>
              <p>${esc(p.brief)}</p>
            </span>
            <span class="goto" aria-hidden="true">↗</span>
          </a>
          ${p.ps ? `<p class="ps">${esc(p.ps)}</p>` : ""}
        </section>`).join("");

      /* ── 结尾索引 ── */
      const ALL = [...P, EXTRA_TILE];
      document.getElementById("tiles").innerHTML = ALL.map((p) => `
        <a class="tile" href="${url(p)}" target="_blank" rel="noopener noreferrer">
          ${mark(p, 16)}<span class="nm">${esc(p.name)}</span>${p.href ? '<span class="li" title="在线"></span>' : ""}
        </a>`).join("");

      /* ── 进度轨 ── */
      const rail = document.getElementById("rail");
      rail.innerHTML =
        P.map((p) => `<a href="#s-${p.slug}" data-s="${p.slug}" aria-label="${esc(p.name)}"><span class="tip">${esc(p.name)}</span></a>`).join("") +
        `<a href="#all" data-s="all" aria-label="全部工具" style="border-radius:3px"><span class="tip">全部工具</span></a>`;

      /* ── 滚动观察：入场 + 进度 ──
         IntersectionObserver 只切 class，动画全交给 CSS。 */
      const steps = [...document.querySelectorAll(".step")];
      const io = new IntersectionObserver((es) => {
        es.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add("on");
            const s = e.target.id.slice(2);
            rail.querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.dataset.s === s));
          }
        });
      }, { rootMargin: "0px 0px -34% 0px", threshold: 0.1 });
      steps.forEach((s) => io.observe(s));

      const allIo = new IntersectionObserver((es) => {
        es.forEach((e) => {
          if (e.isIntersecting) rail.querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.dataset.s === "all"));
        });
      }, { threshold: 0.3 });
      allIo.observe(document.getElementById("all"));

      /* 常驻直达：滚过首屏才出现，别在首屏就叠两个入口 */
      const skip = document.getElementById("skip");
      const heroIo = new IntersectionObserver((es) => {
        es.forEach((e) => skip.classList.toggle("show", !e.isIntersecting));
      }, { threshold: 0.2 });
      heroIo.observe(document.querySelector(".hero"));

      /* 减动效：不玩入场，全部直接可见 */
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
        steps.forEach((s) => s.classList.add("on"));
      }

      document.getElementById("theme").addEventListener("click", () => {
        const root = document.documentElement;
        const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
        root.dataset.theme = (root.dataset.theme || (sysDark ? "dark" : "light")) === "dark" ? "light" : "dark";
      });
    </script>
  </body>
</html>
