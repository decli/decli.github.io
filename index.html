    <style>
      /* ═══════════════════════════════════════════════════════════════
         decli · 作品集「透视」

         ── 一句话 ──
         你看到的每一个表面底下，都是 AI 写的代码。光标是一枚透镜，
         移到哪里，哪里就露出画出它的那段源码；截图底下是画出那一屏的
         那个源文件，这一页底下是这一页自己。

         ── 两种颜色，各管一件事 ──
         灰：AI 的产出。代码、截图（一律去色）、所有的界面。
         荧光黄：我的判断。只出现在我提的问题、我做的选择上 ——
         像审稿的人拿荧光笔划过的那几句。透镜底下的代码里，
         只有出自我口的那几串字符串是黄的，其余全是灰。

         ── 材质 ──
         表面是看片灯的白；透镜里是 X 光片的蓝黑。
         截图四角的套准线、透镜外圈的刻度、图注的编号，都是看片灯上的东西。
         ═══════════════════════════════════════════════════════════════ */

      @font-face {

        font-weight: 300 700;
        font-display: swap;
      }

      /* Layout: 12 栏网格，一条看片灯的白底；透镜层整页覆盖在上面，只在圆里露出来 */
      :root {
        --paper: #f1f2ee;
        --paper-2: #e7e9e4;
        --ink: #14171a;
        --ink-2: #545b61;
        --ink-3: #8a9196;
        --line: rgba(20, 23, 26, 0.13);
        --line-2: rgba(20, 23, 26, 0.26);
        --hl: #ffe24a;
        --hl-ink: #14171a;
        --film: #0a1016;
        --film-2: #0e1720;
        --film-ink: #7d90a1;
        --film-dim: #3c4b58;
        --film-hi: #c3d1dd;
        --film-str: #8fb4c7;
        --glow: rgba(126, 206, 255, 0.16);

        --f-display: "Smiley", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        --f-body: "Geist", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC",
          "Microsoft YaHei", "Segoe UI", sans-serif;
        --f-mono: "Martian", ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Noto Sans CJK SC", monospace;

        --gut: clamp(20px, 4.2vw, 64px);
        --max: 1480px;
        --bar-h: 64px;
        --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #0f1113;
          --paper-2: #171a1d;
          --ink: #e8ebe7;
          --ink-2: #a2a9ad;
          --ink-3: #6c7378;
          --line: rgba(232, 235, 231, 0.12);
          --line-2: rgba(232, 235, 231, 0.24);
          --film: #04080c;
          --film-2: #071019;
          --film-ink: #6d8396;
          --film-dim: #2c3b48;
          --film-hi: #b4c4d2;
          --film-str: #7fa6ba;
          --glow: rgba(126, 206, 255, 0.12);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --paper: #0f1113;
        --paper-2: #171a1d;
        --ink: #e8ebe7;
        --ink-2: #a2a9ad;
        --ink-3: #6c7378;
        --line: rgba(232, 235, 231, 0.12);
        --line-2: rgba(232, 235, 231, 0.24);
        --film: #04080c;
        --film-2: #071019;
        --film-ink: #6d8396;
        --film-dim: #2c3b48;
        --film-hi: #b4c4d2;
        --film-str: #7fa6ba;
        --glow: rgba(126, 206, 255, 0.12);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--bar-h) + 16px); }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 400 16px/1.7 var(--f-body);
        font-feature-settings: "ss01";
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        text-rendering: optimizeLegibility;
      }
      body[data-lang="en"] { line-height: 1.6; }
      ::selection { background: var(--hl); color: var(--hl-ink); }
      a { color: inherit; }
      img { max-width: 100%; display: block; }
      button { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .wrap { width: min(var(--max), 100%); margin: 0 auto; padding-inline: var(--gut); }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .skip {
        position: fixed; left: 12px; top: 12px; z-index: 100; padding: 8px 14px;
        background: var(--ink); color: var(--paper); font: 600 13px var(--f-body); text-decoration: none;
        transform: translateY(-160%); transition: transform 0.2s var(--ease);
      }
      .skip:focus { transform: none; }

      /* 荧光笔：我的判断。背景是一道笔触，不是色块 —— 两头略斜，宽窄不匀 */
      .hl {
        color: var(--hl-ink);
        background-image: linear-gradient(100deg, transparent 0.3em, var(--hl) 0.4em, var(--hl) calc(100% - 0.35em), transparent calc(100% - 0.2em));
        background-repeat: no-repeat;
        background-size: 100% 90%;
        background-position: 0 65%;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        padding-inline: 0.18em;
        margin-inline: -0.18em;
        transition: background-size 0.9s var(--ease);
      }
      [data-ink="0"] .hl { background-size: 0% 90%; }

      .mono { font-family: var(--f-mono); font-stretch: 87.5%; }
      .label {
        font: 500 11px/1.4 var(--f-mono);
        font-stretch: 87.5%;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-2);
      }

      /* ═══ 顶栏 ═══ */
      .bar {
        position: fixed; inset: 0 0 auto 0; z-index: 30;
        height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
        padding-top: env(safe-area-inset-top, 0px);
        transition: background 0.3s, border-color 0.3s;
        border-bottom: 1px solid transparent;
      }
      .bar[data-solid="1"] {
        background: color-mix(in srgb, var(--paper) 88%, transparent);
        backdrop-filter: blur(14px) saturate(1.2);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        border-color: var(--line);
      }
      :root[data-xray="1"] .bar { background: var(--film); border-color: var(--film-dim); color: var(--film-hi); }
      :root[data-xray="1"] .bar .brand span, :root[data-xray="1"] .nav a, :root[data-xray="1"] .tbtn { color: var(--film-ink); border-color: var(--film-dim); }
      :root[data-xray="1"] .tbtn[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); color: #14171a; }
      .bar .wrap { height: var(--bar-h); display: flex; align-items: center; gap: 18px; }
      .brand { display: flex; align-items: baseline; gap: 12px; text-decoration: none; }
      .brand b { font: 400 25px/1 var(--f-display); letter-spacing: 0.01em; }
      .brand span { font: 500 10.5px/1 var(--f-mono); font-stretch: 87.5%; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; }
      .nav { display: flex; gap: 22px; margin-left: auto; }
      .nav a { font: 500 13px/1 var(--f-body); color: var(--ink-2); text-decoration: none; padding: 8px 0; position: relative; }
      .nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform 0.35s var(--ease); }
      .nav a:hover { color: var(--ink); }
      .nav a:hover::after { transform: scaleX(1); transform-origin: left; }
      .tools { display: flex; align-items: center; gap: 6px; }
      .tbtn {
        height: 34px; min-width: 34px; padding: 0 10px;
        display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        border: 1px solid var(--line); border-radius: 999px; background: transparent;
        font: 500 12px/1 var(--f-mono); font-stretch: 87.5%; letter-spacing: 0.03em; color: var(--ink-2);
        cursor: pointer; text-decoration: none;
        transition: border-color 0.2s, color 0.2s, background 0.2s;
      }
      .tbtn:hover { border-color: var(--line-2); color: var(--ink); }
      .tbtn svg { flex: none; }
      .tbtn kbd { font: inherit; font-size: 10px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-3); }
      .tbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
      .tbtn[aria-pressed="true"] kbd { border-color: color-mix(in srgb, var(--paper) 30%, transparent); color: inherit; }

      /* ═══ §hero 首屏 ═══ */
      .hero { padding-top: calc(var(--bar-h) + clamp(40px, 9vh, 112px)); padding-bottom: clamp(56px, 9vh, 112px); position: relative; }
      .eyebrow { display: flex; align-items: center; gap: 14px; margin: 0 0 clamp(18px, 3vh, 30px); }
      .eyebrow i { flex: none; width: 34px; height: 1px; background: var(--ink-3); }
      .eyebrow .label { color: var(--ink); }
      h1.title {
        margin: 0;
        /* 字号跟着标题那 8 栏的实际宽度走，保证两行写完：最长那行七个字宽 ≈ 6 个字号 */
        font: 400 clamp(54px, calc((min(100vw, var(--max)) - 2 * var(--gut)) * 0.104), 164px)/1.04 var(--f-display);
        letter-spacing: -0.012em;
        font-synthesis: none;
      }
      h1.title span { display: block; white-space: nowrap; }
      body[data-lang="en"] h1.title { font-size: clamp(46px, calc((min(100vw, var(--max)) - 2 * var(--gut)) * 0.097), 150px); line-height: 0.96; letter-spacing: -0.02em; }
      .hero-grid {
        display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: clamp(36px, 6vh, 64px);
        align-items: end;
      }
      .hero-grid h1 { grid-column: 1 / span 8; grid-row: 1; }
      .lede { grid-column: 1 / span 6; grid-row: 2; align-self: start; margin: 0; max-width: 34em; font-size: clamp(16px, 1.25vw, 18.5px); line-height: 1.85; color: var(--ink-2); white-space: pre-line; text-wrap: pretty; }
      body[data-lang="en"] .lede { line-height: 1.65; max-width: 38em; }

      /* 零和全部：我写的、AI 写的 */
      .ratio { grid-column: 9 / span 4; grid-row: 1; display: grid; gap: 16px; padding-bottom: 0.6vw; }
      .rrow { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
      .rrow .label { align-self: end; padding-bottom: 6px; word-break: keep-all; }  /* 挤的时候只在空格处折：「AI / 写的代码」，不拆「代码」 */
      .rnum { font: 600 clamp(40px, 4.6vw, 76px)/0.9 var(--f-mono); font-stretch: 75%; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; text-align: right; }
      .rnum small { font: 500 12px/1 var(--f-mono); font-stretch: 87.5%; letter-spacing: 0.04em; color: var(--ink-3); margin-left: 8px; }
      .rrow.me .rnum b { font-weight: 600; }
      .rnum .hl { background: var(--hl); color: var(--hl-ink); padding: 0.02em 0.12em 0; margin: 0; }
      /* 一根条码：按项目分段，宽度就是行数。我那一段宽度是零，只剩一道黄线。
         最后那段斜纹是作品清单以外的仓库：只计入总数，不列名字 */
      .bars { position: relative; display: flex; height: 28px; gap: 1px; margin-top: 4px; }
      .bars::before { content: ""; position: absolute; left: -5px; top: -6px; bottom: -6px; width: 3px; background: var(--hl); }
      .bars span { position: relative; flex: var(--n) 1 0; min-width: 1px; background: var(--ink); opacity: 0.86; transition: opacity 0.2s; }
      .bars span:nth-child(2n) { opacity: 0.62; }
      .bars span.oth { opacity: 0.86; background: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 5px); }
      .bars:hover span { opacity: 0.3; }
      .bars span:hover { opacity: 1; }
      .bars-cap { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-3); }
      .bars-cap output { color: var(--ink); }
      .hint { grid-column: 9 / span 4; grid-row: 2; align-self: start; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; color: var(--ink-3); }
      .hint > span { display: inline-flex; align-items: center; gap: 9px; }
      .hint kbd { font: 500 10.5px/1 var(--f-mono); padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 4px; color: var(--ink-2); }
      .hint .reticle { width: 18px; height: 18px; border: 1px solid var(--ink-2); border-radius: 50%; position: relative; }
      .hint .reticle::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--ink-2); }

      /* ═══ §method 我只做三件事 ═══ */
      .method { border-top: 1px solid var(--line); padding-block: clamp(56px, 9vh, 104px); }
      .shead { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-items: baseline; margin-bottom: clamp(28px, 5vh, 52px); }
      .shead .label { grid-column: 1 / span 3; }
      .shead h2 { grid-column: 4 / span 6; margin: 0; font: 400 clamp(30px, 3.4vw, 50px)/1.08 var(--f-display); letter-spacing: -0.005em; text-wrap: balance; }
      .shead p { grid-column: 10 / span 3; margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.7; }
      .steps { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; }
      .steps ol { grid-column: 4 / span 9; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
      .steps li { border-top: 2px solid var(--ink); padding-top: 18px; display: grid; gap: 10px; align-content: start; }
      .steps li .label { color: var(--ink-3); }
      .steps li h3 { margin: 0; font: 400 clamp(24px, 2.3vw, 34px)/1.1 var(--f-display); }
      .steps li p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
      /* 其余的一切：一条长长的灰，三个判断点落在上面 */
      .track { grid-column: 4 / span 9; margin-top: clamp(30px, 5vh, 48px); }
      .track .label { margin-bottom: 12px; display: block; }
      .ticks { position: relative; height: 46px; }
      .ticks canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .rest { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 14px; font: 400 12.5px/1.5 var(--f-mono); font-stretch: 87.5%; color: var(--ink-3); }
      .rest b { color: var(--ink-2); font-weight: 500; }

      /* ═══ §works 作品 ═══ */
      .works { border-top: 1px solid var(--line); padding-top: clamp(56px, 9vh, 104px); }
      .spread {
        display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 22px;
        padding-block: clamp(40px, 7vh, 84px);
        border-bottom: 1px solid var(--line);
      }
      .spread:last-child { border-bottom: 0; }
      .meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
      .meta i { flex: 1; height: 1px; background: var(--line); }
      .meta .n { color: var(--ink); }
      .txt { grid-column: 1 / span 5; display: grid; gap: 22px; align-content: start; position: sticky; top: calc(var(--bar-h) + 28px); align-self: start; }
      .fig { grid-column: 6 / span 7; display: grid; gap: 12px; min-width: 0; }
      .spread[data-flip] .txt { grid-column: 8 / span 5; grid-row: 2; }
      .spread[data-flip] .fig { grid-column: 1 / span 7; grid-row: 2; }
      .badge { display: flex; align-items: center; gap: 12px; min-height: 36px; }
      .badge img, .badge .ico { width: 36px; height: 36px; border-radius: 22%; flex: none; filter: grayscale(1); transition: filter 0.5s; }
      .badge .ico { display: grid; place-items: center; border: 1px solid var(--line-2); color: var(--ink-2); }
      .spread:hover .badge img { filter: none; }
      .pname { margin: 0; font: 400 clamp(40px, 5vw, 80px)/1.02 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
      .live { font: 500 10.5px/1 var(--f-mono); font-stretch: 87.5%; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 8px 5px; border: 1px solid var(--ink); border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
      .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); animation: blink 1.6s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0.2; } }
      .brief { margin: 0; font-size: clamp(19px, 1.65vw, 24px); line-height: 1.55; letter-spacing: 0.005em; font-weight: 500; text-wrap: pretty; }
      .brief .hl { line-height: 1.75; }
      .desc { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.8; max-width: 36em; text-wrap: pretty; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px 14px; }
      .chips span { font: 400 12px/1.4 var(--f-mono); font-stretch: 87.5%; color: var(--ink-3); }
      .chips span::before { content: "# "; opacity: 0.6; }
      .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .btn {
        height: 42px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px;
        border: 1px solid var(--ink); background: transparent; color: var(--ink);
        font: 500 13px/1 var(--f-body); letter-spacing: 0.01em; text-decoration: none; cursor: pointer;
        transition: background 0.25s var(--ease), color 0.25s var(--ease);
      }
      .btn:hover { background: var(--ink); color: var(--paper); }
      .btn.primary { background: var(--ink); color: var(--paper); }
      .btn.primary:hover { background: transparent; color: var(--ink); }
      .btn svg { transition: transform 0.3s var(--ease); }
      .btn:hover svg.ne { transform: translate(2px, -2px); }
      .stat { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-3); }
      .stat b { color: var(--ink); font-weight: 500; }

      /* 截图：看片灯上的一张片子。四角套准线，默认去色 —— 那是 AI 的产出 */
      .plate { position: relative; margin: 10px; cursor: zoom-in; }
      .plate::before, .plate::after {
        content: ""; position: absolute; width: 18px; height: 18px; pointer-events: none;
        border-color: var(--ink-3); border-style: solid; opacity: 0.9;
      }
      .plate::before { left: -10px; top: -10px; border-width: 1px 0 0 1px; }
      .plate::after { right: -10px; bottom: -10px; border-width: 0 1px 1px 0; }
      .plate .box { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--paper-2); outline: 1px solid var(--line); }
      .plate img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: 50% 0;
        filter: grayscale(1) contrast(1.04) brightness(1.02);
        transition: filter 0.7s var(--ease), transform 1.2s var(--ease), opacity 0.4s;
      }
      .plate img[data-fit="contain"] { object-fit: contain; object-position: 50% 50%; }
      .spread:hover .plate img, .plate:focus-visible img { filter: none; }
      .plate:hover img { transform: scale(1.012); }
      .plate img[data-loading="1"] { opacity: 0.2; }
      .figcap { display: flex; gap: 14px; align-items: baseline; justify-content: space-between; margin: 0 10px; color: var(--ink-3); }
      .figcap b { color: var(--ink-2); font-weight: 500; }
      .figcap .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; text-align: right; text-transform: none; letter-spacing: 0.02em; }
      .thumbs { display: flex; gap: 8px; margin: 0 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
      .thumbs::-webkit-scrollbar { display: none; }
      .thumb {
        flex: none; width: 76px; aspect-ratio: 16 / 10; padding: 0; border: 0; background: var(--paper-2);
        cursor: pointer; position: relative; outline: 1px solid var(--line); outline-offset: 0;
      }
      .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; filter: grayscale(1); opacity: 0.55; transition: opacity 0.25s, filter 0.25s; }
      .thumb:hover img { opacity: 1; }
      .thumb[aria-current="true"] img { opacity: 1; filter: none; }
      .thumb[aria-current="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 2px; background: var(--ink); }
      .thumb:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      /* ═══ §index 全部 ═══ */
      .index { border-top: 1px solid var(--line); padding-block: clamp(56px, 9vh, 104px); }
      .find {
        display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 16px;
        align-items: center; margin-bottom: 28px;
      }
      .q { grid-column: 1 / span 5; display: flex; align-items: center; gap: 10px; height: 46px; border-bottom: 1px solid var(--ink); }
      .q span { font: 500 15px/1 var(--f-mono); color: var(--ink-3); }
      .q input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font: 400 15px/1 var(--f-body); color: var(--ink); }
      .q input::placeholder { color: var(--ink-3); }
      .q input::-webkit-search-cancel-button { display: none; }
      .q kbd { font: 500 10.5px/1 var(--f-mono); padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 4px; color: var(--ink-3); }
      .q:focus-within { border-color: var(--ink); box-shadow: 0 1px 0 0 var(--ink); }
      .cats { grid-column: 7 / span 6; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: flex-end; }
      .cat { border: 0; background: none; padding: 6px 0; cursor: pointer; font: 500 13px/1 var(--f-body); color: var(--ink-3); position: relative; }
      .cat sup { font: 500 9.5px/1 var(--f-mono); margin-left: 3px; vertical-align: 0.6em; }
      .cat:hover { color: var(--ink); }
      .cat[aria-pressed="true"] { color: var(--ink); }
      .cat[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--ink); }

      .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
      .row {
        display: grid; grid-template-columns: 40px minmax(0, 2.5fr) minmax(0, 4.2fr) 92px minmax(120px, 1.5fr) 168px;
        column-gap: 20px; align-items: center; min-height: 64px; padding-block: 12px;
        border-bottom: 1px solid var(--line); position: relative;
        transition: background 0.2s;
      }
      .row:hover { background: color-mix(in srgb, var(--ink) 3.5%, transparent); }
      .row[hidden] { display: none; }
      .row .no { font: 400 11px/1 var(--f-mono); color: var(--ink-3); padding-left: 4px; font-variant-numeric: tabular-nums; }
      .row .nm { font: 400 21px/1.15 var(--f-display); display: flex; align-items: center; gap: 10px; min-width: 0; }
      .row .nm em { font: 500 9.5px/1 var(--f-mono); font-style: normal; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 6px 3px; border: 1px solid var(--line-2); border-radius: 999px; color: var(--ink-2); flex: none; }
      .row .bf { color: var(--ink-2); font-size: 14px; line-height: 1.55; }
      .row .ct { font: 400 12px/1.3 var(--f-mono); font-stretch: 87.5%; color: var(--ink-3); }
      .row .lc { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
      .row .lc i { display: block; height: 6px; background: var(--ink); opacity: 0.8; width: max(2px, calc(var(--w) * 100%)); }
      .row .lc span { font: 400 12px/1 var(--f-mono); font-stretch: 87.5%; font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 6ch; text-align: right; }
      .row .go { display: flex; gap: 6px; justify-content: flex-end; }
      .ilink {
        height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;
        border: 1px solid var(--line-2); text-decoration: none; font: 500 12px/1 var(--f-body); color: var(--ink-2);
        transition: background 0.2s, color 0.2s, border-color 0.2s; white-space: nowrap;
      }
      /* pri 得写在 :hover 前面：两条权重一样，写在后面的会把悬停时的反色字盖回黑字，整颗按钮一片黑 */
      .ilink.pri { border-color: var(--ink); color: var(--ink); }
      .ilink:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
      .none { padding: 40px 0; color: var(--ink-3); font: 400 13px var(--f-mono); }
      /* 悬停预览：跟着指针走的一张小片子 */
      .float {
        position: fixed; left: 0; top: 0; z-index: 20; width: 300px; pointer-events: none;
        opacity: 0; transform: translate3d(-9999px, 0, 0); transition: opacity 0.2s;
      }
      .float[data-on="1"] { opacity: 1; }
      .float .box { aspect-ratio: 16 / 10; overflow: hidden; background: var(--paper-2); outline: 1px solid var(--line-2); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.45); }
      .float img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
      .float .label { margin-top: 8px; display: block; }

      /* ═══ §colophon 版权页 ═══ */
      .colophon { border-top: 1px solid var(--ink); padding-block: clamp(56px, 10vh, 120px) clamp(28px, 5vh, 44px); }
      .colophon .big { margin: 0; font: 400 clamp(32px, 4.4vw, 72px)/1.12 var(--f-display); letter-spacing: -0.008em; max-width: 18em; text-wrap: balance; }
      body[data-lang="en"] .colophon .big { max-width: 22em; }
      .colophon .sub { margin: 26px 0 0; color: var(--ink-2); max-width: 40em; font-size: 15px; line-height: 1.85; }
      .colophon .sub button { border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; font-weight: 600; color: var(--ink); }
      .foot { margin-top: clamp(48px, 9vh, 96px); padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; color: var(--ink-3); }
      .foot .mail { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
      .foot .mail:hover { color: var(--ink); }
      .foot canvas { display: block; }
      .foot .sp { flex: 1; }

      /* ═══ §xray 透镜 ═══
         整页一层「X 光片」，盖在内容上，只在一个圆里露出来（clip-path）。
         它跟着页面一起滚 —— 放在文档流的坐标里，而不是 fixed 再用 JS 追滚动：
         后者在异步滚动下会慢一帧，透镜里的代码跟外面的界面就对不齐了。 */
      .xr {
        position: absolute; left: 0; top: 0; width: 100%; z-index: 25;
        pointer-events: none; overflow: hidden;
        background: var(--film);
        clip-path: circle(0px at -100px -100px);
        contain: layout paint;
        font: 400 10.5px/15px var(--f-mono); font-stretch: 75%;
        color: var(--film-ink);
      }
      body.lensing { cursor: crosshair; }
      .xr::after {
        /* 片子上那层很淡的荧光，靠近透镜中心更亮 */
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(var(--lens-r, 120px) circle at var(--lx, -999px) var(--ly, -999px), var(--glow), transparent 100%);
      }
      .xb { position: absolute; overflow: hidden; white-space: pre; tab-size: 2; }
      .xb.band { display: grid; grid-auto-flow: column; column-gap: 28px; padding: 18px var(--gut); align-content: start; }
      .xb.band pre { margin: 0; overflow: hidden; font: inherit; }
      .xb pre { margin: 0; font: inherit; }
      .xb.data { background: var(--film); box-shadow: 0 0 0 14px var(--film); }
      /* echo：一句我说的话，原样摆在片子上 —— 同样的字、同样的位置，只是黄了，两头多了引号 */
      .xb.echo { overflow: visible; background: var(--film); box-shadow: 0 0 0 16px var(--film); color: var(--hl); z-index: 2; white-space: normal; }
      .xb.echo > :not(.ek) { color: var(--hl); }
      .xb.echo .hl { background: none; padding: 0; margin: 0; color: inherit; }
      .xb.echo .ln, .xb.echo h1 span { position: relative; display: block; }
      .xb.echo .eq { font-family: var(--f-mono); font-stretch: 75%; font-weight: 400; font-style: normal; font-size: max(10.5px, 0.34em); color: var(--film-str); letter-spacing: 0; vertical-align: baseline; }
      .xb.echo .eqo { position: absolute; left: 0; transform: translateX(calc(-100% - 0.15em)); }
      .xb.echo .eqc { display: inline-block; width: 0; white-space: nowrap; padding-left: 0.1em; }
      .xb.echo .ek { position: absolute; left: 0; top: -17px; font: 400 10.5px/15px var(--f-mono); font-stretch: 75%; color: var(--film-ink); white-space: pre; letter-spacing: 0; }
      .xb.echo .ek2 { top: auto; bottom: -17px; }
      .xb.echo h1 span { animation: none !important; }
      .xb.shot { background: var(--film-2); padding: 14px 16px; box-shadow: 0 0 0 1px var(--film-dim); }
      .xb .g { color: var(--film-dim); user-select: none; }
      .xb .k { color: var(--film-hi); }
      .xb .s { color: var(--film-str); }
      .xb .c { color: var(--film-dim); font-style: italic; }
      .xb .h { color: var(--hl); }
      .xb .fh { color: var(--film-hi); }
      .xb .ell { color: var(--film-dim); }

      /* 透镜外圈：一枚放大镜的刻度环。它是 fixed 的，跟着指针；里面的代码由 .xr 负责 */
      .ring {
        position: fixed; left: 0; top: 0; z-index: 26; pointer-events: none;
        width: 0; height: 0; opacity: 0; transition: opacity 0.3s;
      }
      .ring[data-on="1"] { opacity: 1; }
      .ring svg { position: absolute; left: 0; top: 0; overflow: visible; }
      .ring .cap {
        position: absolute; left: 0; top: 0; white-space: nowrap;
        font: 500 10px/1 var(--f-mono); font-stretch: 87.5%; letter-spacing: 0.04em;
        color: var(--film-hi); background: var(--film); padding: 5px 7px 4px; transform: translate(-50%, 0);
        box-shadow: 0 0 0 1px var(--film-dim);
      }
      .ring .cap b { color: var(--hl); font-weight: 500; }
      .scanline { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--hl) 8%, var(--hl) 92%, transparent); z-index: 27; pointer-events: none; opacity: 0; }
      .scanline span { position: absolute; right: var(--gut); top: 6px; font: 500 10px/1 var(--f-mono); letter-spacing: 0.06em; color: var(--ink-2); }

      /* 触屏上的透视开关：右下角一个圆钮 */
      .xfab {
        position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 31;
        width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--ink); background: var(--paper);
        display: none; place-items: center; cursor: pointer; box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
      }
      .xfab[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
      @media (hover: none), (pointer: coarse) { .xfab { display: grid; } }

      /* ═══ 大图 ═══ */
      .lb {
        position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
        padding: clamp(10px, 2vh, 20px) clamp(10px, 2.4vw, 28px) calc(clamp(10px, 2vh, 20px) + env(safe-area-inset-bottom, 0px));
        background: rgba(4, 8, 12, 0.94); color: #e8ebe7;
        opacity: 0; transition: opacity 0.25s;
      }
      .lb[data-on="1"] { opacity: 1; }
      .lbhead { display: flex; align-items: center; gap: 14px; flex: none; padding-top: env(safe-area-inset-top, 0px); }
      .lbtitle { flex: 1; min-width: 0; font: 400 22px/1.2 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lbx, .lbnav { width: 42px; height: 42px; flex: none; display: grid; place-content: center; border: 1px solid rgba(232, 235, 231, 0.3); border-radius: 50%; background: transparent; color: inherit; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
      .lbx:hover, .lbnav:hover { background: rgba(232, 235, 231, 0.12); border-color: rgba(232, 235, 231, 0.6); }

      /* 一条长长的灰：每一道竖线是一次 AI 的产出，三道黄线是我的三次判断。

      let ticksP = 1;

        ticksP = p;

        const r = cv.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
        const ctx = cv.getContext("2d");
        ctx.scale(dpr, dpr);
        const cs = getComputedStyle(document.body);
        const ink = cs.getPropertyValue("--ink").trim(), hl = cs.getPropertyValue("--hl").trim();
        let seed = 7;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        const marks = [0.012, 0.4, 0.985];
        // p 从 0 到 1：灰线从左往右一根根长出来，长到哪儿，哪儿的黄线才落下
        const grow = (f) => { const k = Math.min(1, Math.max(0, (p * 1.35 - f * 0.9) / 0.45)); return 1 - Math.pow(1 - k, 3); };
        for (let x = 0; x < r.width; x += 3) {
          const f = x / r.width;
          const h0 = 8 + rnd() * rnd() * (r.height - 14);
          const a0 = 0.18 + rnd() * 0.32;
          if (marks.some((m) => Math.abs(m - f) * r.width < 7)) continue;
          const h = h0 * grow(f);
          if (h < 0.5) continue;
          ctx.globalAlpha = a0;
          ctx.fillStyle = ink;
          ctx.fillRect(x, r.height - h, 1, h);
        }
        ctx.globalAlpha = 1;
        for (const m of marks) {
          const g = grow(m);
          if (g <= 0) continue;
          ctx.fillStyle = hl;
          ctx.fillRect(Math.round(m * r.width) - 1.5, 0, 3, r.height * g);
        }

          io.disconnect();
          const t0 = performance.now();
          const step = (now) => { const f = Math.min(1, (now - t0) / 1600); drawTicks(f); if (f < 1) requestAnimationFrame(step); };
          requestAnimationFrame(step);
        }, { rootMargin: "0px 0px -15% 0px" });
        io.observe(cv);
      }

<script>
      "use strict";
      // §xray
      /* ═══════════════════════════════════════════════════════════════
         透镜

         页面底下铺一整层「X 光片」：每一块区域换成画出它的真代码。
           band  一整个区块 → 这一页自己的源码里，属于这个区块的 CSS / HTML / JS
           echo  一句我说的话 → 它在源码里的那串字符串：同样的字、同样的位置，
                 只是变成黄色，两头多出引号 —— 你读到的那句话，就是代码里的一串字面量
           data  一段项目文案 → sites.js 里这个项目的那一条
           shot  一张截图   → 那个项目仓库里，画出这一屏的源文件（code/<slug>.json）

         透镜三种待法：park（开场停在标题末尾，静态截图里也看得见）、
         pointer（跟着鼠标）、doc（触屏上被手指拖走，之后跟着页面走）。
         整页透视是另一个状态：圆从开关的位置撑满全屏。
         这一层 aria-hidden：它是给眼睛的，信息全在页面本身。
         ═══════════════════════════════════════════════════════════════ */
      const XR = (() => {

        const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const FINE = matchMedia("(hover: hover) and (pointer: fine)").matches;
        const LH = 15;                       // 代码行高，跟 .xr 的 line-height 一致
        const src = { self: "", sites: "", selfLines: [], sitesLines: [] };
        const code = Object.create(null);
        let human = "", blocks = [], built = false, timer = 0;
        /* p：当前位置（视口坐标）；t：目标；d：文档坐标（park / doc 两种待法用）；r：半径 */
        const st = { px: -500, py: -500, tx: -500, ty: -500, dx: 0, dy: 0, r: 0, rt: 0,
          follow: "park", hidden: true, raf: 0, full: false, fullR: 0, scanning: false };
        const R = () => Math.round(Math.max(78, Math.min(140, innerWidth * 0.082)));

        /* ── 源码 ── */
        async function load() {
          const get = (u) => fetch(u, { cache: "force-cache" }).then((r) => (r.ok ? r.text() : "")).catch(() => "");
          [src.self, src.sites] = await Promise.all([get(SELF_SRC ? asset(SELF_SRC) : location.pathname), get(V("sites.js"))]);
          src.selfLines = src.self.split("\n");
          src.sitesLines = src.sites.split("\n");
          // 出自我口的话：界面文案 + 每个项目的名字、短句、描述。透镜里遇到它们就标黄
          const bag = [];
          for (const lang of ["zh", "en"]) for (const v of Object.values(I18N[lang])) bag.push(...[].concat(v).flat());
          for (const p of PROJECTS) for (const k of ["name", "brief", "desc"]) {
            const v = p[k];
            if (v) bag.push(...(typeof v === "string" ? [v] : Object.values(v)));
          }
          human = "\u0001" + bag.filter((x) => typeof x === "string").join("\u0001") + "\u0001";
          schedule(0);
        }
        function projectCode(slug) {
          if (!(slug in code)) code[slug] = fetch(V(`code/${slug}.json`)).then((r) => (r.ok ? r.json() : null)).catch(() => null);
          return code[slug];
        }

        /* ── 一行代码 → 带颜色的 HTML：注释、字符串、关键字三种，够了 ── */
        const KW = /\b(const|let|var|function|return|if|else|for|while|import|export|from|class|new|await|async|def|struct|func|private|public|static|val|fun|override|true|false|null|nil|this|self|switch|case|break|of|in|try|catch|throw|type|interface|extends|guard|some|enum)\b/g;
        function paint(line, lang, stateIn) {
          let out = "", i = 0, state = stateIn;
          const s = line;
          const push = (cls, txt) => { out += cls ? `<span class="${cls}">${esc(txt)}</span>` : esc(txt).replace(KW, '<span class="k">$1</span>'); };
          while (i < s.length) {

              const close = state === "html" ? "-->" : "*/";

              if (end < 0) { push("c", s.slice(i)); return { html: out, state }; }
              push("c", s.slice(i, end + close.length)); i = end + close.length; state = null; continue;
            }
            const ch = s[i], rest = s.slice(i);

        const cap = s[S.lang] || s.zh;
        lb.title.textContent = L(p.name) || "";
        lb.cap.innerHTML = `${esc(cap)}${list.length > 1 ? ` <b>· ${t("shotOf").replace("%1", lbI + 1).replace("%2", list.length)}</b>` : ""}${s.code ? ` <b>· ${esc(p.repo)}/${esc(s.code.split("#")[0])}</b>` : ""}`;
        lb.img.alt = `${L(p.name) || ""} — ${cap}`;
        lb.raw.href = V(s.src);
        lb.raw.textContent = t("raw");
        setZoom(false);
        lb.img.dataset.ready = "0";
        lb.img.onload = () => { lb.img.dataset.ready = "1"; sizeLb(lb.img); };
        lb.img.src = V(s.src);
        for (const n of lb.root.querySelectorAll(".lbnav")) n.hidden = list.length < 2;
        lb.dots.innerHTML = list.length > 1 ? list.map((x, k) => `<button class="lbdot" type="button" data-i="${k}" aria-current="${k === lbI}" aria-label="${esc(x[S.lang] || x.zh)}"></button>`).join("") : "";
      }
      function openLb(slug, i) {
        if (!shotsOf(slug).length) return;
        lbBack = document.activeElement; lbSlug = slug; lbI = i || 0;
        lb.root.hidden = false;
        document.body.style.overflow = "hidden";
        paintLb();
        requestAnimationFrame(() => (lb.root.dataset.on = "1"));
        lb.close.focus();
        if (window.gtag) gtag("event", "preview_project", { site: "portal", target: slug, mode: "lightbox" });
      }
      function closeLb() {
        if (lb.root.hidden) return;
        lb.root.dataset.on = "0"; lb.root.hidden = true;
        setZoom(false);
        document.body.style.overflow = "";
        lbSlug = null;
        if (lbBack && document.contains(lbBack)) lbBack.focus();
        lbBack = null;
      }
      lb.close.addEventListener("click", closeLb);
      lb.root.addEventListener("click", (e) => {
        const nav = e.target.closest(".lbnav");
        if (nav) { lbI += Number(nav.dataset.d); return paintLb(); }
        const dot = e.target.closest(".lbdot");
        if (dot) { lbI = Number(dot.dataset.i); return paintLb(); }
        if (e.target.closest(".lbraw") || e.target.closest(".lbx")) return;
        if (panned) { panned = false; return; }
        if (e.target === lb.img) return setZoom(lb.stage.dataset.zoom !== "1");
        closeLb();
      });
      lb.stage.addEventListener("pointerdown", (e) => { panned = false; drag = { x: e.clientX, y: e.clientY, sl: lb.stage.scrollLeft, st: lb.stage.scrollTop, zoom: lb.stage.dataset.zoom === "1" }; });
      lb.stage.addEventListener("pointermove", (e) => {
        if (!drag || !drag.zoom) return;
        lb.stage.scrollLeft = drag.sl - (e.clientX - drag.x);
        lb.stage.scrollTop = drag.st - (e.clientY - drag.y);
        if (Math.abs(e.clientX - drag.x) > 4 || Math.abs(e.clientY - drag.y) > 4) panned = true;
      });
      lb.stage.addEventListener("pointerup", (e) => {
        const d = drag; drag = null;
        setTimeout(() => (panned = false), 0);
        if (!d || d.zoom) return;
        const dx = e.clientX - d.x;
        if (Math.abs(dx) > 40) { lbI += dx < 0 ? 1 : -1; paintLb(); }
      });
      lb.root.addEventListener("wheel", (e) => { if (lb.stage.dataset.zoom === "1" && e.target.closest(".lbstage")) return; e.preventDefault(); }, { passive: false });

      /* ═══ 事件 ═══ */
      document.addEventListener("click", (e) => {
        const th = e.target.closest(".thumb");
        if (th) return setShot(th.closest(".spread"), Number(th.dataset.k));
        const pl = e.target.closest(".plate");
        if (pl) { const sp = pl.closest(".spread"); return openLb(sp.dataset.slug, sp._k || 0); }
        const cat = e.target.closest(".cat");
        if (cat) {
          S.cat = cat.dataset.cat;
          for (const x of document.querySelectorAll(".cat")) x.setAttribute("aria-pressed", String(x.dataset.cat === S.cat));
          filter();
          if (window.gtag) gtag("event", "filter_category", { site: "portal", category: S.cat });
          return;
        }
        if (e.target.closest("#colX")) { const r = e.target.getBoundingClientRect(); return XR.toggle({ x: r.left + r.width / 2, y: r.top + r.height / 2 }); }
        const a = e.target.closest("a[data-slug]");
        if (a && window.gtag) gtag("event", "open_project", { site: "portal", target: a.dataset.slug, kind: a.dataset.kind });
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.closest && e.target.closest(".plate") && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault(); const sp = e.target.closest(".spread"); return openLb(sp.dataset.slug, sp._k || 0);
        }
      });
      document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; filter(); } });
      addEventListener("keydown", (e) => {
        if (!lb.root.hidden) {
          if (e.key === "Escape") { e.preventDefault(); return closeLb(); }
          if (e.key === "ArrowRight") { e.preventDefault(); lbI += 1; return paintLb(); }
          if (e.key === "ArrowLeft") { e.preventDefault(); lbI -= 1; return paintLb(); }
          if (e.key === "Home") { e.preventDefault(); lbI = 0; return paintLb(); }
          if (e.key === "End") { e.preventDefault(); lbI = shotsOf(lbSlug).length - 1; return paintLb(); }
          if (e.key === "Tab") {
            const f = [...lb.root.querySelectorAll("button, a[href]")].filter((b) => !b.hidden && b.offsetParent);
            if (!f.length) return;
            const first = f[0], last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
          return;
        }
        const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
        if (!typing && (e.key === "x" || e.key === "X") && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); return XR.toggle(); }
        if (e.key === "Escape" && XR.full) { return XR.setFull(false); }
        const q = $("q");
        if (e.key === "/" && !typing && q) { e.preventDefault(); q.focus({ preventScroll: true }); q.scrollIntoView({ block: "center", behavior: "smooth" }); }
        else if (e.key === "Escape" && document.activeElement === q) { q.value = ""; S.q = ""; filter(); q.blur(); }
      });
      $("xbtn").addEventListener("click", (e) => { const r = $("xbtn").getBoundingClientRect(); XR.toggle(e.detail ? { x: r.left + r.width / 2, y: r.top + r.height / 2 } : null); });
      $("xfab").addEventListener("click", () => { const r = $("xfab").getBoundingClientRect(); XR.toggle({ x: r.left + r.width / 2, y: r.top + r.height / 2 }); });

      /* 条码：指到哪一段，右下角报哪个项目 */
      document.addEventListener("pointerover", (e) => {
        const s = e.target.closest(".bars span");
        const out = $("barsOut");
        if (out) out.textContent = s ? s.dataset.n : "";
      });

      /* 索引表的悬停预览：一张小片子跟着指针 */
      (() => {
        const fl = $("float"), img = fl.querySelector("img"), cap = fl.querySelector(".label");
        if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
        // 外链的那张（取件码助手）拿不到就不弹 —— 宁可没有，也不留一个空框
        img.onerror = () => { shot = false; fl.dataset.on = "0"; };
        let cur = null, shot = false, edge = 0, x = 0, y = 0, raf = 0;
        const move = () => { raf = 0; fl.style.transform = `translate3d(${x}px, ${y}px, 0)`; };
        document.addEventListener("pointermove", (e) => {
          const row = e.target.closest(".row");
          if (row !== cur) {
            cur = row;
            const p = row && PROJECTS.find((q) => q.slug === row.dataset.slug);
            const s = p && p.shots && p.shots[0];
            shot = !!s;
            if (s) { img.src = V(s.src); cap.textContent = `${L(p.name)} · ${s[S.lang] || s.zh}`; }
            // 「打开 / 下载 / 源码」那一栏留给点击。窄屏下每行这一栏宽窄不一，取最靠左的那一行，
            // 片子上下会压到邻行，邻行的按钮也不能盖
            if (row) edge = Math.min(...[...document.querySelectorAll(".row:not([hidden]) .go")].map((g) => g.getBoundingClientRect().left)) - 16;
          }
          if (!cur) { fl.dataset.on = "0"; return; }
          // 指针进了按钮那一栏就收起；没进时片子只放在它左边，右边放不下就翻到指针左边
          fl.dataset.on = shot && e.clientX < edge ? "1" : "0";
          const w = fl.offsetWidth;
          x = e.clientX + 24 + w <= edge ? e.clientX + 24 : Math.max(8, e.clientX - 24 - w);
          y = Math.max(110, Math.min(e.clientY, innerHeight - 120)) - 90;
          if (!raf) raf = requestAnimationFrame(move);
        }, { passive: true });
        addEventListener("scroll", () => { fl.dataset.on = "0"; cur = null; }, { passive: true });
      })();

      /* 顶栏：滚过首屏一点点就加底色 */
      addEventListener("scroll", () => { $("bar").dataset.solid = scrollY > 8 ? "1" : "0"; }, { passive: true });

      /* 荧光笔：滚到才划。没滚到的先收起来；IntersectionObserver 不在就一直是划好的 */
      const inkIO = "IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches
        ? new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { e.target.dataset.ink = "1"; inkIO.unobserve(e.target); } }, { rootMargin: "0px 0px -12% 0px" })
        : null;
      function armInk() {
        if (!inkIO) return;
        for (const el of document.querySelectorAll(".method .steps li, .spread .brief, .colophon .big")) {
          const r = el.getBoundingClientRect();
          if (r.top > innerHeight * 0.88) { el.dataset.ink = "0"; inkIO.observe(el); }
        }
      }

      /* ═══ 语言 / 明暗 ═══ */
      const LANG_KEY = "decli.lang", THEME_KEY = "decli.theme", root = document.documentElement;
      function setLang(l, remember) {
        S.lang = l;
        document.body.dataset.lang = l;
        root.lang = l === "zh" ? "zh-CN" : "en";
        if (remember) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} }
        render();
        armInk();
        armTicks();
      }
      $("lang").addEventListener("click", () => { const n = S.lang === "zh" ? "en" : "zh"; setLang(n, true); if (window.gtag) gtag("event", "switch_language", { site: "portal", to: n }); });
      try { const s = localStorage.getItem(THEME_KEY); if (s === "dark" || s === "light") root.dataset.theme = s; } catch (e) {}
      $("theme").addEventListener("click", () => {
        const sys = matchMedia("(prefers-color-scheme: dark)").matches;
        const n = (root.dataset.theme || (sys ? "dark" : "light")) === "dark" ? "light" : "dark";
        root.dataset.theme = n;
        try { localStorage.setItem(THEME_KEY, n); } catch (e) {}
        drawTicks(); paintMail();
        if (window.gtag) gtag("event", "switch_theme", { site: "portal", to: n });
      });
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawTicks(); paintMail(); });

      /* ═══ 邮箱：画在 canvas 上，源码里没有可以被正则捞走的字面量 ═══ */
      const LOCAL = [100, 101, 99, 108, 105], HOST = [113, 113, 46, 99, 111, 109];
      const mail = () => String.fromCharCode.apply(null, LOCAL) + "@" + String.fromCharCode.apply(null, HOST);
      function paintMail() {
        const cv = $("mailc");
        if (!cv) return;
        const cs = getComputedStyle(cv.parentElement);
        const size = 11, font = `500 ${size}px ${getComputedStyle(document.body).getPropertyValue("--f-mono")}`;
        const ctx0 = cv.getContext("2d");
        ctx0.font = font;
        const text = mail().toUpperCase();
        const w = Math.ceil(ctx0.measureText(text).width + text.length * 0.66) + 2, h = 16;
        const dpr = Math.min(devicePixelRatio || 1, 3);
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        cv.style.width = w + "px"; cv.style.height = h + "px";
        const ctx = cv.getContext("2d");
        ctx.scale(dpr, dpr); ctx.font = font; ctx.textBaseline = "middle"; ctx.fillStyle = cs.color;
        if ("letterSpacing" in ctx) ctx.letterSpacing = "0.66px";
        ctx.fillText(text, 1, h / 2 + 0.5);
      }
      document.addEventListener("click", async (e) => {
        if (!e.target.closest("#mail")) return;
        try { await navigator.clipboard.writeText(mail()); }
        catch (err) {
          const ta = document.createElement("textarea");
          ta.value = mail(); ta.style.cssText = "position:fixed;top:-100px;opacity:0";
          document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
        }
        const toast = $("toast");
        toast.textContent = t("copied"); toast.dataset.on = "1";
        setTimeout(() => (toast.dataset.on = "0"), 1800);
      });

      /* ═══ 启动 ═══ */
      let lang0 = "zh";
      try { const s = localStorage.getItem(LANG_KEY); lang0 = s === "zh" || s === "en" ? s : /^zh\b/i.test(navigator.language || "") ? "zh" : "en"; } catch (e) {}
      setLang(lang0, false);
      if (!window.CODE_STATS) statsReady.then(() => { render(); armInk(); armTicks(); });
      XR.load().then(() => {
        renderColophon();
        const go = () => setTimeout(() => XR.intro(), 420);
        (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(go));
      });
      setTimeout(() => document.body.classList.remove("boot"), 1600);
      if (document.fonts) document.fonts.ready.then(() => { drawTicks(); paintMail(); });
      addEventListener("resize", () => { clearTimeout(window.__rt); window.__rt = setTimeout(drawTicks, 120); });
    </script>
  </body>
</html>
