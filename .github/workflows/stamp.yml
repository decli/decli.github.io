# 推到 main 之后，自动给静态资源盖内容版本号并回提交。
#
# 为什么要有这个：改完直接推、推完直接生效，是这个仓库的前提。手动跑一个
# 脚本才生效，等于把「忘了跑」变成一类线上 bug —— 而且症状正好是最难查的
# 那种：HTML 是新的，图和 sites.js 还是旧缓存。所以交给流水线。
#
# 防死循环：脚本自己那次回提交带 [stamp]，带这个标记的 push 直接跳过。
# 想去掉这套：删掉这个文件，改完资源自己跑 `python3 tools/stamp.py` 再推，
# 效果一样，只是要记得跑。

name: 资源版本号

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stamp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    if: ${{ !contains(github.event.head_commit.message, '[stamp]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 盖版本号
        run: python3 tools/stamp.py

      - name: 有变化才提交
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "index.html 没变，不用提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "盖资源版本号 [stamp]"
          git push
