    <style>
      /* ═══════════════════════════════════════════════════════════════
         decli · 作品集

         ── 加一个项目要改哪里 ──
         只改 sites.js。分类、筛选、搜索、埋点、中英文全都跟着数据走，
         这个文件一个字都不用动。

         ── 视觉：为什么是「极光 + 风场 + 光晕」──
         这三样都是 /ftms/ 里已经在用的语言。入口页跟子站长得像，点进去
         才不会有「换了一个网站」的断裂感。而且全是纯 CSS：
         没有依赖，没有图片，没有字体请求，首屏就是这一个文件。

         动效克制：极光 40 秒一圈、风场 26 秒一轮，位移都很小。
         入口页要的是「有呼吸」，不是「在动」—— 动得看得出来就抢注意力了。
         `prefers-reduced-motion` 下全部停掉。

         ── 底色的透明度别再往上调 ──
         几个 --aurora / --spot / --wind 都压在 0.022~0.085，模糊 96px。
         入口页的底色是给内容让路的，一眼能看出「在渐变」就已经太重了。

         ── 这一页只做一件事：把人分发到各个项目去 ──
         曾经加过戳泡泡、加过连连看，都拿掉了 —— 入口页多一个玩意儿，
         主线就模糊一分。要往上加东西之前先问一句：
         它帮访客更快找到想要的项目了吗？
         ═══════════════════════════════════════════════════════════════ */

      :root {
        --bg: #f5f7fc;
        --card: rgba(255, 255, 255, 0.66);
        --card-solid: #fff;
        --line: rgba(18, 32, 68, 0.09);
        --line-2: rgba(18, 32, 68, 0.16);
        --text: #101828;
        --text-2: #4a566d;
        --text-3: #7b879e;
        --brand: #3b5bd6;
        --brand-2: #7c5cff;
        --brand-3: #06b6d4;
        --live: #0f9d58;
        --glow: rgba(59, 91, 214, 0.13);
        --shadow: 0 20px 44px -26px rgba(16, 24, 40, 0.42);
        --shadow-lg: 0 28px 60px -30px rgba(16, 24, 40, 0.5);
        --wind: rgba(59, 91, 214, 0.065);
        --aurora-1: rgba(124, 92, 255, 0.06);
        --aurora-2: rgba(6, 182, 212, 0.05);
        --aurora-3: rgba(59, 91, 214, 0.055);
        --spot-1: rgba(124, 92, 255, 0.035);
        --spot-2: rgba(6, 182, 212, 0.022);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {

          --bg: #060a18;
          --card: rgba(20, 28, 50, 0.56);
          --card-solid: #141c32;

          --line-2: rgba(150, 178, 240, 0.26);
          --text: #eaf0ff;
          --text-2: #a6b3d2;
          --text-3: #78849f;
          --brand: #7c9bff;
          --brand-2: #a78bfa;
          --brand-3: #22d3ee;
          --live: #34d399;
          --glow: rgba(124, 155, 255, 0.2);
          --shadow: 0 24px 54px -28px rgba(0, 0, 0, 0.85);
          --shadow-lg: 0 32px 70px -32px rgba(0, 0, 0, 0.9);
          --wind: rgba(143, 169, 255, 0.085);
          --aurora-1: rgba(124, 92, 255, 0.075);
          --aurora-2: rgba(6, 182, 212, 0.055);
          --aurora-3: rgba(59, 91, 214, 0.07);
          --spot-1: rgba(150, 120, 255, 0.042);
          --spot-2: rgba(34, 211, 238, 0.028);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #060a18;
        --card: rgba(20, 28, 50, 0.56);
        --card-solid: #141c32;
        --line: rgba(150, 178, 240, 0.13);
        --line-2: rgba(150, 178, 240, 0.26);

        --brand-2: #a78bfa;

        --shadow-lg: 0 32px 70px -32px rgba(0, 0, 0, 0.9);
        --wind: rgba(143, 169, 255, 0.085);
        --aurora-1: rgba(124, 92, 255, 0.075);
        --aurora-2: rgba(6, 182, 212, 0.055);
        --aurora-3: rgba(59, 91, 214, 0.07);
        --spot-1: rgba(150, 120, 255, 0.042);
        --spot-2: rgba(34, 211, 238, 0.028);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.7 "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Source Han Sans SC",
          "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      body[data-lang="en"] {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      /* ── 极光：三团大色斑，缓慢漂浮 + 跟着鼠标做视差 ──
         两个动作要拆到两层上：外层 span 只做视差位移，内层 i 只做漂浮关键帧。
         挤在同一个元素上的话，`animation` 里的 transform 会把 JS 写的那个
         整帧覆盖掉 —— 视差看起来就完全没生效，而且不报任何错。 */
      .aurora {
        position: fixed;
        inset: -20% -10%;
        z-index: 0;
        pointer-events: none;
        filter: blur(96px);
      }
      .aurora span {
        position: absolute;
        inset: 0;
        display: block;
        will-change: transform;
        /* 比指针慢半拍才有「跟」的感觉；一步到位反而像整个背景被钉在光标上 */
        transition: transform 0.7s cubic-bezier(0.22, 0.8, 0.3, 1);
      }
      .aurora i {
        position: absolute;
        display: block;
        border-radius: 50%;
        animation: float 40s ease-in-out infinite;
      }
      .aurora span:nth-child(1) i { width: 46vw; height: 46vw; top: -6%; left: 52%; background: var(--aurora-1); }
      .aurora span:nth-child(2) i { width: 38vw; height: 38vw; top: 34%; left: -6%; background: var(--aurora-2); animation-duration: 52s; animation-delay: -14s; }
      .aurora span:nth-child(3) i { width: 42vw; height: 42vw; top: 62%; left: 58%; background: var(--aurora-3); animation-duration: 46s; animation-delay: -26s; }
      @keyframes float {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        33%      { transform: translate3d(4%, -5%, 0) scale(1.07); }
        66%      { transform: translate3d(-5%, 4%, 0) scale(0.95); }
      }

      /* ── 流光：一团跟着指针走的高光 ──
         不加过渡，让它精确贴着手；「慢半拍」那件事交给上面的极光去做，
         两层一快一慢，才有厚度。 */
      .spot {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s;
        background:
          radial-gradient(420px circle at var(--px, 50vw) var(--py, 32vh), var(--spot-1), transparent 66%),
          radial-gradient(760px circle at var(--px, 50vw) var(--py, 32vh), var(--spot-2), transparent 70%);
      }
      body[data-pointer="1"] .spot { opacity: 1; }


      /* ── 风场：几条常年不改向的流线 ── */
      .wind { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
      .wind path {
        fill: none;
        stroke: var(--wind);
        stroke-linecap: round;
        stroke-dasharray: 210 1500;
        animation: drift 26s linear infinite;
      }
      .wind path:nth-child(2) { animation-duration: 34s; animation-delay: -6s; }
      .wind path:nth-child(3) { animation-duration: 29s; animation-delay: -14s; }
      .wind path:nth-child(4) { animation-duration: 38s; animation-delay: -3s; }
      .wind path:nth-child(5) { animation-duration: 31s; animation-delay: -19s; }
      .wind path:nth-child(6) { animation-duration: 43s; animation-delay: -11s; }
      @keyframes drift { to { stroke-dashoffset: -1710; } }

      .page {
        position: relative;
        z-index: 1;
        width: min(1120px, 100%);
        margin: 0 auto;
        padding: clamp(26px, 5vh, 46px) clamp(18px, 4vw, 32px) 60px;
      }

      /* ═══ 页眉 ═══ */
      header.top { display: flex; align-items: center; gap: 10px; margin-bottom: clamp(38px, 7vh, 70px); }
      .me { display: flex; align-items: center; gap: 11px; font-weight: 650; letter-spacing: 0.02em; font-size: 15.5px; }
      .avatar {
        width: 36px; height: 36px; border-radius: 12px; flex: none;
        display: grid; place-content: center;
        background: linear-gradient(140deg, var(--brand), var(--brand-2));
        color: #fff; font-size: 16px; font-weight: 700;
        box-shadow: 0 6px 18px -6px var(--brand);
      }
      .spacer { flex: 1; }
      .ghost {
        display: inline-flex; align-items: center; justify-content: center; gap: 5px;
        height: 36px; min-width: 36px; padding: 0 10px;
        border: 1px solid var(--line); border-radius: 11px;
        background: var(--card); backdrop-filter: blur(12px);
        color: var(--text-2); font: inherit; font-size: 13px; font-weight: 600;
        cursor: pointer; text-decoration: none;
        transition: border-color 0.16s, color 0.16s, transform 0.16s;
      }
      .ghost:hover { border-color: var(--line-2); color: var(--text); transform: translateY(-1px); }
      .ghost:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

      /* ═══ 主标题 ═══ */
      h1 {
        margin: 0 0 14px;
        font-size: clamp(34px, 6.4vw, 60px);
        font-weight: 750;
        line-height: 1.16;
        letter-spacing: -0.025em;
      }
      h1 .g {
        background: linear-gradient(96deg, var(--brand), var(--brand-2) 55%, var(--brand-3));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .lede { margin: 0 0 22px; max-width: 52ch; color: var(--text-2); font-size: clamp(15px, 1.9vw, 17px); }

      .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 30px; }
      .stat { display: flex; align-items: baseline; gap: 6px; color: var(--text-3); font-size: 13px; }
      .stat b {
        font-size: 21px; font-weight: 700; color: var(--text);
        font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
      }

      /* ═══ 工具条：搜索 + 分类 ═══ */
      .tools { display: grid; gap: 12px; margin-bottom: 22px; }
      .find {
        display: flex; align-items: center; gap: 9px;
        height: 46px; padding: 0 15px;
        border: 1px solid var(--line); border-radius: 13px;
        background: var(--card); backdrop-filter: blur(12px);
        transition: border-color 0.16s, box-shadow 0.16s;
      }
      .find:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--glow); }
      .find svg { flex: none; color: var(--text-3); }
      .find input { flex: 1; min-width: 0; border: 0; background: none; color: inherit; font: inherit; outline: none; }
      .find input::placeholder { color: var(--text-3); }
      .find kbd {
        flex: none; padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px;
        color: var(--text-3); font: 600 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .cats { display: flex; flex-wrap: wrap; gap: 8px; }
      .cat {
        display: inline-flex; align-items: center; gap: 7px;
        height: 34px; padding: 0 13px;
        border: 1px solid var(--line); border-radius: 999px;
        background: var(--card); color: var(--text-2);
        font: inherit; font-size: 13.5px; font-weight: 550;
        cursor: pointer; white-space: nowrap;
        transition: border-color 0.16s, color 0.16s, background 0.16s;
      }
      .cat:hover { border-color: var(--line-2); color: var(--text); }
      .cat:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .cat[aria-pressed="true"] {
        border-color: transparent; color: #fff;
        background: linear-gradient(120deg, var(--brand), var(--brand-2));
        box-shadow: 0 6px 18px -8px var(--brand);
      }
      .cat em {
        font-style: normal; font-size: 11.5px; font-weight: 700;
        padding: 1px 6px; border-radius: 999px;
        background: rgba(125, 140, 180, 0.16); color: inherit;
        font-variant-numeric: tabular-nums;
      }
      .cat[aria-pressed="true"] em { background: rgba(255, 255, 255, 0.22); }

      /* ═══ 卡片网格 ═══ */
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
        grid-auto-flow: dense;
      }
      .card {
        position: relative;
        display: flex; flex-direction: column; gap: 12px;
        padding: 18px;
        border: 1px solid var(--line); border-radius: 18px;
        background: var(--card); backdrop-filter: blur(14px);
        color: inherit; text-decoration: none;
        overflow: hidden;
        transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        animation: rise 0.5s cubic-bezier(0.22, 0.8, 0.3, 1) backwards;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
      /* 光晕跟着指针走 —— 跟 /ftms/ 看板上的卡片同一个手法。
         位置由 JS 写进 --mx / --my，CSS 只负责画。 */
      .card::before {
        content: "";
        position: absolute; inset: -1px; border-radius: inherit;
        background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), var(--glow), transparent 72%);
        opacity: 0; transition: opacity 0.24s; pointer-events: none;
      }
      .card:hover { border-color: var(--line-2); transform: translateY(-3px); box-shadow: var(--shadow); }
      .card:hover::before { opacity: 1; }
      .card:focus-within { border-color: var(--line-2); }
      .card[hidden] { display: none; }

      /* 有在线地址的占两格 —— 能点开试的东西，值得大一点 */
      @media (min-width: 760px) {
        .card[data-featured] { grid-column: span 2; }
      }
      .card[data-featured] { padding: 22px; }
      .card[data-featured]:hover { box-shadow: var(--shadow-lg); }

      .head { display: flex; align-items: flex-start; gap: 13px; }
      .mark {
        width: 44px; height: 44px; border-radius: 13px; flex: none;
        display: grid; place-content: center; overflow: hidden;
        background: var(--card-solid); border: 1px solid var(--line);
      }
      .mark img { width: 44px; height: 44px; display: block; }
      .mark.tinted { border: 0; color: #fff; }
      .mark svg { display: block; }
      .card[data-featured] .mark { width: 50px; height: 50px; border-radius: 15px; }
      .card[data-featured] .mark img { width: 50px; height: 50px; }

      .title { min-width: 0; flex: 1; }
      .title h2 {
        margin: 0; font-size: 16.5px; font-weight: 680; letter-spacing: -0.005em;
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      }
      .card[data-featured] .title h2 { font-size: 18.5px; }
      .live {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 1px 8px; border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--live) 42%, transparent);
        color: var(--live); font-size: 11px; font-weight: 650; letter-spacing: 0.02em;
      }
      .live::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
      .kind { color: var(--text-3); font-size: 12.5px; font-weight: 500; margin-top: 2px; }

      .desc { margin: 0; color: var(--text-2); font-size: 13.5px; line-height: 1.65; }
      .card[data-featured] .desc { font-size: 14px; }

      .tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag {
        padding: 2px 9px; border-radius: 7px;
        background: color-mix(in srgb, var(--brand) 9%, transparent);
        color: var(--text-2); font-size: 11.5px; letter-spacing: 0.01em;
      }

      .acts { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }
      .btn {
        display: inline-flex; align-items: center; gap: 6px;
        height: 34px; padding: 0 14px; border-radius: 10px;
        font-size: 13px; font-weight: 620; text-decoration: none;
        border: 1px solid var(--line); color: var(--text-2); background: transparent;
        transition: border-color 0.16s, color 0.16s, transform 0.16s, background 0.16s;
      }
      .btn:hover { border-color: var(--line-2); color: var(--text); transform: translateY(-1px); }
      .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .btn.primary {
        border-color: transparent; color: #fff;
        background: linear-gradient(120deg, var(--brand), var(--brand-2));
        box-shadow: 0 8px 20px -10px var(--brand);
      }
      .btn.primary:hover { color: #fff; filter: brightness(1.06); }

      /* ═══════════════════════════════════════════════════════════════
         产品截图

         ── 入口为什么在按钮右边那条空白上 ──
         卡片底部那一行，左边是「打开 / 源码」，右边一直空着。空白本来就是
         卡片上唯一一处「没在说事」的地方，把预览挂在那儿，谁都不挡谁：
         想去的人一眼看得见，不想看的人视线根本不经过。
         再加一个真按钮当它的实体 —— 否则「这儿能停鼠标」这件事没人知道，
         而且触屏和键盘就彻底进不来了。

         ── 三种设备三条路 ──
         鼠标：停在入口上 → 卡内展开；点一下 → 全屏大图
         键盘：Tab 到入口，回车 → 全屏大图（悬停那套对键盘没有意义）
         触屏：没有 hover，点一下 → 全屏大图

         ── 卡内预览为什么不盖住底部那一行 ──
         盖住就等于把「打开」「源码」两个主按钮埋了：鼠标要走到面板上才能
         翻页，而面板正压在按钮上，人就没路可退了。所以面板下沿停在 acts
         上方（--acts-h），预览开着的时候两个按钮照样能点。

         ── 图为什么是 contain 不是 cover ──
         这堆截图从 16:10 的看板到 0.46 的手机竖屏都有，cover 会把竖屏截图
         裁得只剩中间一条。contain 会留黑边，但留白比裁掉内容诚实。
         ═══════════════════════════════════════════════════════════════ */
      .card { --acts-h: 56px; }              /* padding 18 + 按钮 34 + acts 的 padding-top 4 */
      .card[data-featured] { --acts-h: 60px; }
      /* 有截图的卡片给个下限，好让预览面板有二百四十来像素可用。
         不给的话面板只剩一百六，横屏截图裁到只认得出个导航条 ——
         那就不叫预览了。同一行的卡片会跟着一起长高，看着更透气，不算亏。
         只在**有悬停**的设备上加：手机根本展不开卡内预览，这几十像素
         在那儿纯粹是标签和按钮之间一段空当，白让人多划一屏。 */
      @media (hover: hover) and (pointer: fine) {
        .card[data-shots] { min-height: 280px; }
        .card[data-shots][data-featured] { min-height: 292px; }
      }

      .peek {
        flex: 1 1 auto; min-width: 0;
        display: inline-flex; align-items: center; gap: 6px;
        height: 34px; padding: 0 10px;
        border: 0; border-radius: 10px;
        background: transparent; color: var(--text-3);
        font: inherit; font-size: 12.5px; font-weight: 560;
        cursor: pointer; white-space: nowrap; overflow: hidden;
        transition: color 0.16s, background 0.16s;
      }
      .card:hover .peek { color: var(--text-2); background: color-mix(in srgb, var(--text) 5%, transparent); }
      .peek:hover, .peek[data-on="1"] {
        color: var(--brand);
        background: color-mix(in srgb, var(--brand) 10%, transparent);
      }
      .peek:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .peek svg { flex: none; }
      .peek em { font-style: normal; font-variant-numeric: tabular-nums; opacity: 0.75; }

      .peekbox {
        position: absolute; left: 0; right: 0; top: 0; bottom: var(--acts-h);
        z-index: 2;
        display: flex; flex-direction: column;
        background: var(--card-solid);
        opacity: 0; transition: opacity 0.2s;
      }
      .peekbox[data-on="1"] { opacity: 1; }
      .peekbox[hidden] { display: none; }

      .peekfig {
        position: relative; flex: 1; min-height: 0; overflow: hidden;
        /* 竖图 contain 之后两侧会露底，给一点很淡的底纹，别是一片死白 */
        background:
          radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--brand) 7%, transparent), transparent 70%),
          var(--card-solid);
      }
      /* 绝对定位撑满，别靠 max-height:100% —— 父级的高度是 flex 算出来的，
         百分比高度在这种链路上时灵时不灵，图会直接漫出去被裁掉。
         object-fit 到底取 cover 还是 contain 由 JS 按图的方向定，见 fitShot。 */
      .peekfig img {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: contain;
        object-position: 50% 0;      /* 万一是 cover，从顶上开始留 —— 界面的身份都在顶上 */
        opacity: 0; transition: opacity 0.24s;
        cursor: zoom-in;
      }
      .peekfig img[data-ready="1"] { opacity: 1; }
      /* 图还没到时的微光扫描。图在缓存里时这一帧根本不会出现 */
      .peekfig::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(100deg, transparent 24%, var(--glow) 50%, transparent 76%);
        background-size: 240% 100%;
        opacity: 0; transition: opacity 0.2s;
        animation: sweep 1.15s linear infinite;
      }
      .peekfig[data-loading="1"]::after { opacity: 1; }
      @keyframes sweep { from { background-position: 140% 0; } to { background-position: -140% 0; } }

      .peekbar {
        display: flex; align-items: center; gap: 4px;
        height: 30px; flex: none; padding: 0 5px;
        border-top: 1px solid var(--line);
      }
      .peekcap {
        flex: 1; min-width: 0; text-align: center;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: var(--text-2); font-size: 11.5px;
      }
      .peekcap b { margin-left: 6px; color: var(--text-3); font-weight: 600; font-variant-numeric: tabular-nums; }
      .peeknav {
        width: 24px; height: 24px; flex: none;
        display: grid; place-content: center;
        border: 0; border-radius: 8px; background: none;
        color: var(--text-3); cursor: pointer;
        transition: color 0.14s, background 0.14s;
      }
      .peeknav:hover { color: var(--text); background: color-mix(in srgb, var(--text) 9%, transparent); }
      .peeknav[hidden] { display: none; }

      /* ═══ 全屏大图 ═══
         卡内那块最多两百来像素高，看个轮廓够了，看清楚不够。
         点一下进这里：图给到 84vh，左右翻页、圆点跳转、Esc 退出。
         底色两套主题都用深色 —— 截图多半是浅色界面，深底才托得住。 */
      .lb {
        position: fixed; inset: 0; z-index: 50;
        display: flex; flex-direction: column;
        padding: clamp(10px, 2.2vh, 20px) clamp(10px, 2.4vw, 26px);
        background: rgba(6, 10, 24, 0.82);
        backdrop-filter: blur(16px);
        opacity: 0; transition: opacity 0.22s;
      }
      .lb[data-on="1"] { opacity: 1; }
      .lb[hidden] { display: none; }

      .lbhead { display: flex; align-items: center; gap: 10px; flex: none; color: #eaf0ff; }
      .lbtitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 650; }
      .lbclose {
        width: 38px; height: 38px; flex: none;
        display: grid; place-content: center;
        border: 1px solid rgba(234, 240, 255, 0.22); border-radius: 12px;
        background: rgba(255, 255, 255, 0.06); color: #eaf0ff;
        cursor: pointer; transition: background 0.14s, border-color 0.14s;
      }
      .lbclose:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(234, 240, 255, 0.4); }

      .lbstage { flex: 1 1 0; min-height: 0; display: flex; align-items: center; gap: clamp(6px, 1.6vw, 16px); }
      /* align-self:stretch 把高度交给 flex 行直接定死，contain 才有一个确定的框可依。
         max-width 是防超宽屏把 1200 宽的原图硬拉大 —— 拉大就是糊。 */
      .lbstage img {
        flex: 1 1 auto; min-width: 0; align-self: stretch;
        max-width: 1240px; margin-inline: auto; display: block;
        object-fit: contain;
        opacity: 0; transition: opacity 0.2s;
        cursor: zoom-out;
      }
      .lbstage img[data-ready="1"] { opacity: 1; }
      .lbnav {
        width: 46px; height: 46px; flex: none;
        display: grid; place-content: center;
        border: 1px solid rgba(234, 240, 255, 0.2); border-radius: 50%;
        background: rgba(255, 255, 255, 0.07); color: #eaf0ff;
        cursor: pointer; transition: background 0.14s, transform 0.14s;
      }
      .lbnav:hover { background: rgba(255, 255, 255, 0.17); transform: scale(1.06); }
      .lbnav[hidden] { display: none; }

      .lbfoot { flex: none; display: grid; gap: 8px; justify-items: center; padding-top: clamp(8px, 1.6vh, 14px); }
      .lbcap { color: rgba(234, 240, 255, 0.82); font-size: 13px; text-align: center; }
      .lbcap b { margin-left: 8px; color: rgba(234, 240, 255, 0.5); font-weight: 600; font-variant-numeric: tabular-nums; }
      .lbdots { display: flex; gap: 7px; }
      .lbdot {
        width: 7px; height: 7px; padding: 0;
        border: 0; border-radius: 50%;
        background: rgba(234, 240, 255, 0.3);
        cursor: pointer; transition: background 0.14s, transform 0.14s;
      }
      .lbdot:hover { background: rgba(234, 240, 255, 0.6); }
      .lbdot[aria-current="true"] { background: #eaf0ff; transform: scale(1.25); }
      .lbclose:focus-visible, .lbnav:focus-visible, .lbdot:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

      /* 窄屏上左右两个圆钮要吃掉近百像素宽，而这块屏本来就只有三百多 ——
         横屏截图能有多大全看宽度。所以窄屏改成浮在图上，宽度全让给图。 */
      @media (max-width: 560px) {
        .lb { padding: 10px 8px; }
        .lbstage { position: relative; }
        .lbnav {
          position: absolute; z-index: 1; top: 50%;
          width: 38px; height: 38px; transform: translateY(-50%);
        }
        .lbnav[data-d="-1"] { left: 2px; }
        .lbnav[data-d="1"] { right: 2px; }
        .lbnav:hover { transform: translateY(-50%); }
      }

      .none { padding: 44px 0; text-align: center; color: var(--text-3); font-size: 14px; }
      .none[hidden] { display: none; }

      /* ═══ 页脚 ═══ */
      footer {
        margin-top: 52px; padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px;
        color: var(--text-3); font-size: 12.5px;
      }
      footer .owner { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
      footer .mail {
        display: inline-flex; align-items: center; padding: 0 2px;
        border: 0; border-radius: 5px; background: none; color: inherit; font: inherit;
        cursor: pointer; transition: opacity 0.16s;
      }
      footer .mail:hover { opacity: 0.7; }
      footer .mail:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      footer canvas { vertical-align: -0.22em; }
      .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: 0.5; }

      #toast {
        position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
        padding: 10px 17px; border-radius: 11px;
        background: var(--card-solid); border: 1px solid var(--line-2);
        box-shadow: var(--shadow); color: var(--text); font-size: 13px;
        opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
        z-index: 9;
      }
      #toast[data-on="1"] { opacity: 1; transform: translate(-50%, 0); }

      /* 有人明确要求少动效，就一动不动 */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .aurora i, .wind path { animation: none; }
        .aurora span { transition: none; transform: none !important; }
        .spot { display: none; }
        .wind path { stroke-dasharray: none; }
        .card { animation: none; }
        .card, .btn, .ghost, .cat { transition: none; }
        .card:hover, .btn:hover, .ghost:hover { transform: none; }
        /* 预览：过渡和扫光全停，图和翻页一个不少 */
        .peek, .peekbox, .peekfig img, .peeknav, .lb, .lbstage img, .lbnav, .lbclose, .lbdot { transition: none; }
        .peekfig::after { animation: none; }
        .lbnav:hover { transform: none; }
        .lbdot[aria-current="true"] { transform: none; }
      }
    </style>
  </head>

          shotOf: "第 %1 张，共 %2 张",
          closeShots: "关闭",
          prevShot: "上一张",
          nextShot: "下一张",
        },
        en: {
          title: ["Annoyed enough", "to just build it"],
          lede: "Thirteen projects. Some scratched an itch of my own, some were built for family — a trade-ops suite, a WeChat formatter, a Mac cleaner, an IP monitor, a parcel-code reader. All client-side or local, no sign-up, just open and use.",
          all: "All",
          search: "Search name, purpose, keyword…",
          none: "Nothing matches.",
          projects: "projects",
          online: "live online",
          open: "Open",
          download: "Download",
          source: "Source",
          liveTag: "Live",
          rights: "All rights reserved 2026",
          copied: "Email copied to clipboard",
          langBtn: "中",
          themeTitle: "Toggle theme",
          preview: "Preview",
          previewA11y: "See screenshots of %s",
          shotOf: "%1 of %2",
          closeShots: "Close",
          prevShot: "Previous",
          nextShot: "Next",
        },
      };

      /* 图标：给没有自己 favicon 的项目用。
         全是线条图形，配 tint 上色 —— 比 emoji 靠谱：
         emoji 在 Windows / Mac / Android 上长得完全不一样，一排摆开必然花。 */
      const ICONS = {
        globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>',
        target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
        chat: '<path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.5A8 8 0 0 1 13 4a8 8 0 0 1 8 8Z"/><path d="M9 11h.01M13 11h.01M17 11h.01"/>',
        tab: '<rect x="3" y="5" width="18" height="15" rx="2.5"/><path d="M3 9.5h7l1.6-2.4H21"/>',
        scroll: '<path d="M12 4v16"/><path d="m7 9 5-5 5 5"/><path d="m7 15 5 5 5-5"/>',
        download: '<path d="M12 3v12"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M4 20h16"/>',
        package: '<path d="m12 3 8 4.2v9.6L12 21l-8-4.2V7.2Z"/><path d="M4.3 7.3 12 11.4l7.7-4.1M12 11.4V21"/>',
        chess: '<path d="M9 4h6v2.6l2 2.4H7l2-2.4Z"/><path d="M8.4 9h7.2l-.9 6H9.3Z"/><path d="M6.5 20h11l-.8-2.6H7.3Z"/>',
      };

      const S = { lang: "zh", cat: "all", q: "" };
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      /* 字段可以是字符串（中英文同名），也可以是 {zh, en} */
      const L = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v[S.lang] ?? v.zh : v);
      const t = (k) => I18N[S.lang][k];

      const PROJECTS = Array.isArray(window.PROJECTS) ? window.PROJECTS : [];
      const CATEGORIES = Array.isArray(window.CATEGORIES) ? window.CATEGORIES : [];
      /* 能点开试的排前面 —— 首屏就该是「可以马上玩」的那几个 */
      const LIST = [...PROJECTS].sort((a, b) => (b.href ? 1 : 0) - (a.href ? 1 : 0));

      /* ── 资源版本号 ──
         GitHub Pages 给所有响应发 max-age=600，而且不支持自定义响应头，改不掉。
         但缓存是按 URL 存的 —— 地址里带上内容哈希，图换了、sites.js 改了，
         新的 index.html 一到就会去取新的，不会拿旧缓存对付。
         表由 tools/stamp.py 生成（见 head 里那对 ASSET-VERSIONS 标记）。
         表里没有的原样返回：子站 favicon 归各自仓库管，外链图更轮不到这儿定。 */
      const V = (p) => {
        const h = window.ASSET_V && window.ASSET_V[p];
        return h ? `${p}?v=${h}` : p;
      };

      /* 截图清单单独拷一份出来管：图挂了就从这儿删（见 dropShot），
         直接改 sites.js 那份数组等于把数据源改脏了。
         版本号在这里一次性拼好 —— 预取和真正加载必须是同一个 URL，
         各拼各的就等于同一张图下两遍。 */
      const SHOTS = Object.create(null);
      for (const p of LIST) {
        if (Array.isArray(p.shots) && p.shots.length) {
          SHOTS[p.slug] = p.shots.map((s) => ({ ...s, src: V(s.src) }));
        }
      }
      const shotsOf = (slug) => SHOTS[slug] || [];

      const el = {
        h1: document.getElementById("h1"), lede: document.getElementById("lede"),
        stats: document.getElementById("stats"), cats: document.getElementById("cats"),
        grid: document.getElementById("grid"), none: document.getElementById("none"),
        q: document.getElementById("q"), lang: document.getElementById("lang"),
        theme: document.getElementById("theme"), rights: document.getElementById("rights"),
        toast: document.getElementById("toast"),
      };

      /* 全屏大图那一份 DOM。声明放在这儿而不是下面的事件区：
         keydown 是全局监听，脚本一跑完就能触发，引用得先立在那儿。 */
      const lb = {
        root: document.getElementById("lb"), img: document.getElementById("lbimg"),
        stage: document.getElementById("lbstage"), cap: document.getElementById("lbcap"),
        dots: document.getElementById("lbdots"), title: document.getElementById("lbtitle"),
        close: document.getElementById("lbclose"),
      };

      function catName(key) {
        const c = CATEGORIES.find((x) => x.key === key);
        return c ? c[S.lang] : key;
      }

      function renderChrome() {
        const [a, b] = t("title");
        /* 中文两段直接相连（做了几个 + 能用的东西）；英文之间要有个空格，
           不然会渲染成 "A few thingsthat actually work" —— 一眼就是拼接出来的 */
        const gap = S.lang === "en" ? " " : "";
        el.h1.innerHTML = `${esc(a)}${gap}<span class="g">${esc(b)}</span>`;
        el.lede.textContent = t("lede");
        el.q.placeholder = t("search");
        el.q.setAttribute("aria-label", t("search"));
        el.none.textContent = t("none");
        el.lang.textContent = t("langBtn");
        el.theme.title = t("themeTitle");
        el.rights.textContent = t("rights");
        document.getElementById("mail").setAttribute("aria-label", S.lang === "zh" ? "复制邮箱" : "Copy email");
        lb.close.setAttribute("aria-label", t("closeShots"));
        for (const n of lb.root.querySelectorAll(".lbnav")) {
          n.setAttribute("aria-label", t(Number(n.dataset.d) < 0 ? "prevShot" : "nextShot"));
        }

        const live = LIST.filter((p) => p.href).length;
        el.stats.innerHTML =
          `<span class="stat"><b>${LIST.length}</b>${esc(t("projects"))}</span>` +
          `<span class="stat"><b>${live}</b>${esc(t("online"))}</span>`;

        el.cats.innerHTML =
          `<button class="cat" data-cat="all" aria-pressed="${S.cat === "all"}">${esc(t("all"))}<em>${LIST.length}</em></button>` +
          CATEGORIES.map((c) => {
            const n = LIST.filter((p) => p.cat === c.key).length;
            if (!n) return "";
            return `<button class="cat" data-cat="${esc(c.key)}" aria-pressed="${S.cat === c.key}">${esc(c[S.lang])}<em>${n}</em></button>`;
          }).join("");
      }

      function cardHTML(p, i) {
        const shots = shotsOf(p.slug);
        const mark = String(p.icon || "").startsWith("/")
          ? `<span class="mark"><img src="${esc(V(p.icon))}" alt="" loading="lazy"
               onerror="this.parentElement.classList.add('tinted');this.parentElement.style.background='linear-gradient(140deg,#64748b,#475569)';this.outerHTML='&#128279;'"></span>`
          : `<span class="mark tinted" style="background:linear-gradient(140deg,${esc((p.tint || ["#64748b", "#475569"])[0])},${esc((p.tint || ["#64748b", "#475569"])[1])})">
               <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[p.icon] || ICONS.package}</svg>
             </span>`;

        const acts =
          (p.href
            ? `<a class="btn primary" href="${esc(p.href)}" target="_blank" rel="noopener noreferrer" data-slug="${esc(p.slug)}" data-kind="demo">
                 ${esc(t("open"))}
                 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
               </a>`
            : "") +
          /* 下载：给「装完才能跑」的原生 App。它不带「在线」徽标，也不进
             「个可在线体验」那个计数 —— 下一个安装包和点开就能试，不是一回事 */
          (!p.href && p.dl
            ? `<a class="btn primary" href="${esc(p.dl)}" target="_blank" rel="noopener noreferrer" data-slug="${esc(p.slug)}" data-kind="download">
                 ${esc(t("download"))}
                 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
               </a>`
            : "") +
          `<a class="btn" href="https://github.com/decli/${esc(p.repo)}" target="_blank" rel="noopener noreferrer" data-slug="${esc(p.slug)}" data-kind="repo">
             <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
             ${esc(t("source"))}
           </a>` +
          /* 预览入口：按钮右边那条空白（flex:1 就是让它把空白占满）。
             真按钮，不是纯 hover 的热区 —— 键盘 Tab 得到，触屏点得到。 */
          (shots.length
            ? `<button class="peek" type="button" aria-haspopup="dialog"
                       aria-label="${esc(t("previewA11y").replace("%s", L(p.name)))}">
                 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                   <rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.6" cy="9.8" r="1.5"/><path d="m4 17 5-4.6 3.4 3.1L16 11l4 4.4"/>
                 </svg>
                 <span>${esc(t("preview"))}</span><em>${shots.length}</em>
               </button>`
            : "");

        const tags = (L(p.tags) || []).map((x) => `<span class="tag">${esc(x)}</span>`).join("");
        const hay = [L(p.name), p.slug, p.repo, L(p.desc), (L(p.tags) || []).join(" "), catName(p.cat)].join(" ").toLowerCase();

        /* 卡内预览整块对读屏隐藏（aria-hidden），里面的翻页键也一并退出
           Tab 序列 —— 它是纯鼠标的东西，键盘和读屏走「预览」按钮进大图，
           那条路信息更全。aria-hidden 里留可聚焦元素是硬伤，别省这个 tabindex。 */
        const nav = (d, label) => `<button class="peeknav" type="button" data-d="${d}" tabindex="-1" aria-label="${esc(t(label))}">
             <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d < 0 ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7"}"/></svg>
           </button>`;
        const peekBox = shots.length
          ? `<div class="peekbox" hidden aria-hidden="true">
               <div class="peekfig"><img alt="" decoding="async"></div>
               <div class="peekbar">
                 ${shots.length > 1 ? nav(-1, "prevShot") : ""}
                 <span class="peekcap"></span>
                 ${shots.length > 1 ? nav(1, "nextShot") : ""}
               </div>
             </div>`
          : "";

        return `<article class="card"${p.href ? " data-featured" : ""}${shots.length ? " data-shots" : ""}
                  data-cat="${esc(p.cat)}" data-slug="${esc(p.slug)}" data-find="${esc(hay)}"
                  style="animation-delay:${Math.min(i, 12) * 45}ms">
          <div class="head">
            ${mark}
            <div class="title">
              <h2>${esc(L(p.name))}${p.href ? `<span class="live">${esc(t("liveTag"))}</span>` : ""}</h2>
              <div class="kind">${esc(catName(p.cat))}</div>
            </div>
          </div>
          <p class="desc">${esc(L(p.desc))}</p>
          <div class="tags">${tags}</div>
          <div class="acts">${acts}</div>
          ${peekBox}
        </article>`;
      }

      function render() {
        renderChrome();
        if (!LIST.length) {
          el.grid.innerHTML = `<p class="none" style="grid-column:1/-1">项目清单没加载出来 —— 检查 sites.js 是否存在且语法正确。</p>`;
          return;
        }
        /* 切语言会把整个网格重建一遍，开着的预览连同它挂在卡片上的翻页位置
           一起没了 —— 先手动收掉，不然 peekCard 会指着一个已经不在文档里的节点 */
        closePeek();
        el.grid.innerHTML = LIST.map(cardHTML).join("");
        if (!lb.root.hidden) paintLb();   // 大图开着的话，标题和说明也跟着换语言
        filter();
      }

      function filter() {
        const k = S.q.trim().toLowerCase();
        let n = 0;
        for (const c of el.grid.querySelectorAll(".card")) {
          const ok = (S.cat === "all" || c.dataset.cat === S.cat) && (!k || c.dataset.find.includes(k));
          c.hidden = !ok;
          if (ok) n++;
        }
        el.none.hidden = n > 0;
      }

      /* ── 事件 ── */
      el.cats.addEventListener("click", (e) => {
        const b = e.target.closest(".cat");
        if (!b) return;
        S.cat = b.dataset.cat;
        for (const x of el.cats.querySelectorAll(".cat")) x.setAttribute("aria-pressed", String(x.dataset.cat === S.cat));
        filter();
        if (window.gtag) gtag("event", "filter_category", { site: "portal", category: S.cat });
      });

      el.q.addEventListener("input", () => { S.q = el.q.value; filter(); });
      addEventListener("keydown", (e) => {
        /* 大图开着的时候键盘归它管：这时候按 `/` 想搜索是没有的事，
           而焦点必须留在对话框里 —— 否则读屏会读到底下那一整页 */
        if (!lb.root.hidden) {
          if (e.key === "Escape") { e.preventDefault(); return closeLb(); }
          if (e.key === "ArrowRight") { e.preventDefault(); lbI += 1; return paintLb(); }
          if (e.key === "ArrowLeft") { e.preventDefault(); lbI -= 1; return paintLb(); }
          if (e.key === "Home") { e.preventDefault(); lbI = 0; return paintLb(); }
          if (e.key === "End") { e.preventDefault(); lbI = shotsOf(lbSlug).length - 1; return paintLb(); }
          if (e.key === "Tab") {
            const f = [...lb.root.querySelectorAll("button")].filter((b) => !b.hidden && b.offsetParent);
            if (!f.length) return;
            const first = f[0], last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
          return;
        }
        if (e.key === "Escape" && peekCard) { closePeek(); return; }
        if (e.key === "/" && document.activeElement !== el.q) { e.preventDefault(); el.q.focus(); }
        else if (e.key === "Escape" && document.activeElement === el.q) {
          el.q.value = ""; S.q = ""; filter(); el.q.blur();
        }
      });

      /* 光晕跟随。一个委托监听覆盖所有卡片，加卡片不用再挂事件 */
      el.grid.addEventListener("pointermove", (e) => {
        const c = e.target.closest(".card");
        if (!c) return;
        const r = c.getBoundingClientRect();
        c.style.setProperty("--mx", `${e.clientX - r.left}px`);
        c.style.setProperty("--my", `${e.clientY - r.top}px`);
      });

      /* 点击去哪，记一笔。只报 slug 和「点的是体验还是源码」*/
      el.grid.addEventListener("click", (e) => {
        const a = e.target.closest("a[data-slug]");
        if (a && window.gtag) gtag("event", "open_project", { site: "portal", target: a.dataset.slug, kind: a.dataset.kind });
      });

      /* ═══════════════════════════════════════════════════════════════
         产品截图：卡内预览 + 全屏大图

         图一律**用到才下载**。首屏这一页本来只有一个 HTML 文件，
         26 张截图要是跟着首屏一起发，等于把一个零依赖的入口页做成了
         一兆多的图库。所以 img 出厂时没有 src，展开才填。

         预取分两步，都踩在人真实的动作节奏上：
           指针进卡片 → 悄悄下第一张（这时人还在往按钮那边走）
           翻到第 i 张 → 顺手把 i±1 也下了（十有八九下一步就翻到）
         等指针真的停到「预览」上，图基本已经躺在缓存里了。
         ═══════════════════════════════════════════════════════════════ */
      const HOVER_OK = matchMedia("(hover: hover) and (pointer: fine)").matches;
      const HOVER_DELAY = 130;      // 比「路过」长、比「我想看看」短
      const shotCap = (s) => (s ? s[S.lang] ?? s.zh ?? "" : "");
      const prefetched = new Set();
      /* 正在下的那几个 Image 得有人拿着。`new Image().src = ...` 写完就没人引用了，
         下载途中被回收掉请求就跟着取消 —— 表现是「预取好像没生效」，还不报错。
         下完立刻松手：留着的话 25 张 2560×1600 解码后是几百兆内存，
         而字节本来就在 HTTP 缓存里，不需要这边替它存。 */
      const inflight = new Set();

      function prefetch(src) {
        if (!src || prefetched.has(src)) return;
        prefetched.add(src);
        const im = new Image();
        inflight.add(im);
        im.onload = im.onerror = () => inflight.delete(im);
        im.src = src;
      }

      /* 图挂了（最典型的是外链那张）就把它从清单里摘掉，顺手把入口上的
         计数改对；一张不剩就连入口一起撤 —— 与其留个点开是空的按钮，
         不如当它没有过。 */
      function dropShot(slug, src) {
        const list = SHOTS[slug];
        if (!list) return [];
        const left = list.filter((s) => s.src !== src);
        SHOTS[slug] = left;
        for (const card of el.grid.querySelectorAll(`.card[data-slug="${CSS.escape(slug)}"]`)) {
          const btn = card.querySelector(".peek");
          if (!btn) continue;
          if (!left.length) {
            closePeek();
            card.querySelector(".peekbox")?.remove();
            btn.remove();
          } else {
            btn.querySelector("em").textContent = String(left.length);
            card.querySelectorAll(".peeknav").forEach((n) => (n.hidden = left.length < 2));
          }
        }
        return left;
      }

      /* cover 还是 contain，按「裁掉的是哪一边」来定，不是按图横竖。
         cover 总是从图相对更大的那条边上裁：
           图比框更扁（比例大于框）→ 裁两侧。侧栏、右边那列全没了，不行
           图比框更方/更竖（比例小于框）→ 裁上下。配上 object-position 顶对齐，
           留下的正好是页头和第一屏，界面的身份全在那儿 —— 这个可以
         所以：只在「裁上下」那一档用 cover，其余一律 contain（宁可留白，不砍内容）。 */
      function fitShot(img, fig) {
        if (!img.naturalWidth || !fig) return;
        const r = fig.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const cover = img.naturalWidth / img.naturalHeight < r.width / r.height;
        img.style.objectFit = cover ? "cover" : "contain";
        /* 顶对齐只在 cover 时有意义（留住页头）。contain 还顶着放的话，
           空出来的一条全堆在下边，看着像图掉下去了 —— 那时候居中才对。 */
        img.style.objectPosition = cover ? "50% 0" : "50% 50%";
      }

      /* 把 src 装进某个 img，管好「加载中 / 好了 / 挂了」三个状态。
         同一个 src 重复设不会再触发 onload，所以先短路掉。 */
      function loadShot(img, wrap, src, onFail, onLoad) {
        if (img.dataset.src === src && img.dataset.ready === "1") return;
        img.dataset.src = src;
        img.dataset.ready = "0";
        wrap.dataset.loading = "1";
        img.onload = () => {
          if (img.dataset.src !== src) return;   // 期间又翻了一张，这次的结果作废
          wrap.dataset.loading = "0";
          img.dataset.ready = "1";
          onLoad && onLoad(img);
        };
        img.onerror = () => {
          wrap.dataset.loading = "0";
          onFail && onFail();
        };
        img.src = src;
      }

      /* ── 卡内预览 ── */
      let peekCard = null, peekTimer = 0;

      function paintPeek(card) {
        const list = shotsOf(card.dataset.slug);
        if (!list.length) return;
        const i = (card._i = Math.max(0, Math.min(card._i || 0, list.length - 1)));
        const box = card.querySelector(".peekbox");
        const img = box.querySelector("img");
        const fig = box.querySelector(".peekfig");
        box.querySelector(".peekcap").innerHTML =
          `${esc(shotCap(list[i]))}${list.length > 1 ? `<b>${i + 1}/${list.length}</b>` : ""}`;
        loadShot(img, fig, list[i].src, () => {
          const left = dropShot(card.dataset.slug, list[i].src);
          if (left.length) { card._i = i % left.length; paintPeek(card); }
        }, (im) => fitShot(im, fig));
        prefetch(list[(i + 1) % list.length]?.src);
        prefetch(list[(i - 1 + list.length) % list.length]?.src);
      }

      function openPeek(card) {
        if (peekCard === card) return;
        closePeek();
        const box = card.querySelector(".peekbox");
        if (!box || !shotsOf(card.dataset.slug).length) return;
        peekCard = card;
        card._i = card._i || 0;
        box.hidden = false;
        paintPeek(card);
        /* 先取消 hidden，下一帧再打开透明度 —— 同一帧里做，浏览器不会
           把它当成过渡的起点，淡入就直接跳过去了 */
        requestAnimationFrame(() => box.dataset.on = "1");
        card.querySelector(".peek")?.setAttribute("data-on", "1");
        if (window.gtag) gtag("event", "preview_project", { site: "portal", target: card.dataset.slug, mode: "peek" });
      }

      function closePeek() {
        if (!peekCard) return;
        const box = peekCard.querySelector(".peekbox");
        if (box) { box.dataset.on = "0"; box.hidden = true; }
        peekCard.querySelector(".peek")?.removeAttribute("data-on");
        peekCard = null;
      }

      function stepPeek(card, d) {
        const list = shotsOf(card.dataset.slug);
        if (list.length < 2) return;
        card._i = ((card._i || 0) + d + list.length) % list.length;   // 到头就绕回来
        paintPeek(card);
      }

      el.grid.addEventListener("pointerover", (e) => {
        const card = e.target.closest(".card");
        if (!card) return;
        // 指针一进卡片就把封面那张备着，人这会儿还在往下走
        prefetch(shotsOf(card.dataset.slug)[0]?.src);
        if (!HOVER_OK) return;
        const trigger = e.target.closest(".peek, .peekbox");
        clearTimeout(peekTimer);
        if (trigger) {
          if (peekCard !== card) peekTimer = setTimeout(() => openPeek(card), HOVER_DELAY);
        } else if (peekCard === card) {
          // 从预览面板退回卡片正文，说明人不想看了 —— 收起来，别赖着
          peekTimer = setTimeout(closePeek, HOVER_DELAY);
        }
      });
      /* 用 pointerout + relatedTarget 判「真的离开这张卡了吗」。
         写成 pointerleave 挂在 grid 上捕获会误伤：从「预览」按钮挪到面板里
         也算离开了按钮，预览会当场消失，人根本翻不了页。 */
      el.grid.addEventListener("pointerout", (e) => {
        const card = e.target.closest(".card");
        if (!card || card !== peekCard) return;
        if (e.relatedTarget && card.contains(e.relatedTarget)) return;
        clearTimeout(peekTimer);
        peekTimer = setTimeout(closePeek, HOVER_DELAY);
      });
      // 页面一滚，卡片就从指针底下走开了，预览留着没有意义
      addEventListener("scroll", () => { clearTimeout(peekTimer); closePeek(); }, { passive: true });
      // 窗口变了，框的宽高比也变了，cover / contain 得重算一遍
      addEventListener("resize", () => {
        if (!peekCard) return;
        const fig = peekCard.querySelector(".peekfig");
        fitShot(fig.querySelector("img"), fig);
      });

      /* 翻页：面板里的箭头、滚轮。滚轮只在预览开着时拦，
         其余时候页面该怎么滚怎么滚。 */
      el.grid.addEventListener("click", (e) => {
        const nav = e.target.closest(".peeknav");
        if (!nav) return;
        e.preventDefault();
        stepPeek(nav.closest(".card"), Number(nav.dataset.d));
      });
      el.grid.addEventListener(
        "wheel",
        (e) => {
          if (!peekCard || !e.target.closest(".peekbox")) return;
          e.preventDefault();
          stepPeek(peekCard, (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) > 0 ? 1 : -1);
        },
        { passive: false },
      );

      /* ── 全屏大图 ── */
      let lbSlug = null, lbI = 0, lbBack = null;

      /* 大图**不放大**：显示宽度最多等于图自己的物理像素数。
         2 倍屏上把一张 1600 宽的图铺到 1240 CSS px，等于放大 1.55 倍 —— 糊。
         上游 README 只给到那么大的几张（MacPleco、IP 弹窗）就让它小一点，
         小而清楚，好过大而糊。 */
      function capLb(img) {
        if (!img.naturalWidth) return;
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        img.style.maxWidth = `${Math.min(1240, Math.round(img.naturalWidth / dpr))}px`;
      }

      function paintLb() {
        const list = shotsOf(lbSlug);
        if (!list.length) return closeLb();
        lbI = (lbI + list.length) % list.length;
        const p = LIST.find((x) => x.slug === lbSlug) || {};
        const cap = shotCap(list[lbI]);
        lb.title.textContent = L(p.name) || "";
        lb.cap.innerHTML = `${esc(cap)}${list.length > 1 ? `<b>${t("shotOf").replace("%1", lbI + 1).replace("%2", list.length)}</b>` : ""}`;
        lb.img.alt = `${L(p.name) || ""} — ${cap}`;
        loadShot(lb.img, lb.stage, list[lbI].src, () => {
          const left = dropShot(lbSlug, list[lbI].src);
          if (!left.length) closeLb(); else paintLb();
        }, capLb);
        for (const n of lb.root.querySelectorAll(".lbnav")) n.hidden = list.length < 2;
        lb.dots.innerHTML = list.length > 1
          ? list.map((s, k) =>
              `<button class="lbdot" data-i="${k}" aria-current="${k === lbI}" aria-label="${esc(shotCap(s))}"></button>`).join("")
          : "";
        prefetch(list[(lbI + 1) % list.length]?.src);
        prefetch(list[(lbI - 1 + list.length) % list.length]?.src);
      }

      function openLb(slug, i) {
        if (!shotsOf(slug).length) return;
        closePeek();
        lbBack = document.activeElement;
        lbSlug = slug;
        lbI = i || 0;
        lb.root.hidden = false;
        document.body.style.overflow = "hidden";
        paintLb();
        requestAnimationFrame(() => (lb.root.dataset.on = "1"));
        lb.close.focus();
        if (window.gtag) gtag("event", "preview_project", { site: "portal", target: slug, mode: "lightbox" });
      }

      function closeLb() {
        if (lb.root.hidden) return;
        lb.root.dataset.on = "0";
        lb.root.hidden = true;
        document.body.style.overflow = "";
        lbSlug = null;
        /* 焦点还给点开它的那个按钮 —— 不还的话焦点会掉回 body，
           键盘用户下一次 Tab 得从整页开头再走一遍 */
        if (lbBack && document.contains(lbBack)) lbBack.focus();
        lbBack = null;
      }

      el.grid.addEventListener("click", (e) => {
        const btn = e.target.closest(".peek");
        if (btn) {
          const card = btn.closest(".card");
          return openLb(card.dataset.slug, card._i || 0);
        }
        // 卡内预览点图也进大图：那儿正好是人已经在看的地方
        const fig = e.target.closest(".peekfig");
        if (fig) {
          const card = fig.closest(".card");
          openLb(card.dataset.slug, card._i || 0);
        }
      });

      lb.close.addEventListener("click", closeLb);
      lb.root.addEventListener("click", (e) => {
        const nav = e.target.closest(".lbnav");
        if (nav) { lbI += Number(nav.dataset.d); return paintLb(); }
        const dot = e.target.closest(".lbdot");
        if (dot) { lbI = Number(dot.dataset.i); return paintLb(); }
        // 点图片本身或点空处都关掉 —— 大图看完了就该退出去
        if (e.target === lb.img || e.target === lb.root || e.target === lb.stage) closeLb();
      });

      /* 触屏左右滑。阈值 40px：比手指停在屏幕上的抖动大，比一次真滑动小 */
      let swipeX = null;
      lb.stage.addEventListener("pointerdown", (e) => (swipeX = e.clientX));
      lb.stage.addEventListener("pointerup", (e) => {
        if (swipeX === null) return;
        const dx = e.clientX - swipeX;
        swipeX = null;
        if (Math.abs(dx) > 40) { lbI += dx < 0 ? 1 : -1; paintLb(); }
      });
      lb.root.addEventListener(
        "wheel",
        (e) => { e.preventDefault(); },
        { passive: false },
      );

      /* ── 语言 ──
         默认跟浏览器走：navigator.language 不是中文就开英文。
         手动切过就记住，之后不再猜。 */
      const LANG_KEY = "decli.lang";
      function setLang(l, remember) {
        S.lang = l;
        document.body.dataset.lang = l;
        document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
        if (remember) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} }
        render();
        paintMail();
      }
      el.lang.addEventListener("click", () => {
        const next = S.lang === "zh" ? "en" : "zh";
        setLang(next, true);
        if (window.gtag) gtag("event", "switch_language", { site: "portal", to: next });
      });

      /* ── 明暗 ──
         入口页只要「跟系统」和「反过来」两种，三档轮换太重了。
         选择记在 localStorage，跟子站各自的记忆互不干扰。 */
      const THEME_KEY = "decli.theme";
      const root = document.documentElement;
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "dark" || saved === "light") root.dataset.theme = saved;
      } catch (e) {}
      el.theme.addEventListener("click", () => {
        const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const next = (root.dataset.theme || (sysDark ? "dark" : "light")) === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        paintMail();
        if (window.gtag) gtag("event", "switch_theme", { site: "portal", to: next });
      });

      /* ── 版权邮箱 ──
         画在 canvas 上：DOM 里没有文本节点，源码里也没有可直接正则捞走的
         字面量，更没写进 aria-label / title —— 那些都是纯文本属性，
         写进去等于前面全白做。贴在公开网页上的邮箱，半天就会进群发名录。
         补偿：整块是个按钮，点击 / 回车即复制，读屏用户拿到的是可粘贴的
         真地址，而爬虫不会去点按钮。 */
      const LOCAL = [100, 101, 99, 108, 105];
      const HOST = [113, 113, 46, 99, 111, 109];
      const mail = () => String.fromCharCode.apply(null, LOCAL) + "@" + String.fromCharCode.apply(null, HOST);

      function paintMail() {
        const cv = document.getElementById("mailc");
        const probe = cv.getContext("2d");
        if (!probe) return;
        const cs = getComputedStyle(cv.parentElement);
        const size = 12.5;
        const font = `500 ${size}px ${cs.fontFamily}`;
        probe.font = font;
        const text = mail();
        const w = Math.ceil(probe.measureText(text).width) + 2;
        const h = Math.ceil(size * 1.4);
        const dpr = Math.min(devicePixelRatio || 1, 3);
        /* ⚠️ 给 canvas 赋 width/height 会**清空**它，所以字体必须在这之后再设一次 */
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        cv.style.width = w + "px";
        cv.style.height = h + "px";
        const ctx = cv.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.font = font;
        ctx.textBaseline = "middle";
        ctx.fillStyle = cs.color;
        ctx.fillText(text, 1, h / 2);
      }

      document.getElementById("mail").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(mail());
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = mail();
          ta.style.cssText = "position:fixed;top:-100px;opacity:0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        el.toast.textContent = t("copied");
        el.toast.dataset.on = "1";
        setTimeout(() => (el.toast.dataset.on = "0"), 1800);
      });

      /* ═══════════════════════════════════════════════════════════════
         背景：一团跟着指针走的高光

         pointermove 一秒能来一百多次，每次都直接写 style 会让整页跟着抖。
         所以只记坐标，真正写样式攒到下一帧 —— 而且是**按需**请求这一帧：
         指针不动就一帧都不排，页面闲着的时候这段代码等于不存在。
         ═══════════════════════════════════════════════════════════════ */
      (function () {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        let px = 0, py = 0, queued = false, moved = false;
        const spans = document.querySelectorAll(".aurora span");
        // 三层各走各的，方向和快慢都不同，叠起来才有厚度
        const FACTOR = [[0.035, 0.03], [-0.028, -0.022], [0.045, -0.035]];

        function paint() {
          queued = false;
          document.body.style.setProperty("--px", px + "px");
          document.body.style.setProperty("--py", py + "px");
          const dx = px - innerWidth / 2, dy = py - innerHeight / 2;
          spans.forEach((sp, i) => {
            const f = FACTOR[i] || FACTOR[0];
            sp.style.transform = `translate3d(${(dx * f[0]).toFixed(1)}px, ${(dy * f[1]).toFixed(1)}px, 0)`;
          });
        }

        addEventListener("pointermove", (e) => {
          px = e.clientX; py = e.clientY;
          if (!moved) { moved = true; document.body.dataset.pointer = "1"; }
          if (!queued) { queued = true; requestAnimationFrame(paint); }
        }, { passive: true });
      })();

      /* ── 启动 ── */
      let lang0 = "zh";
      try {
        const saved = localStorage.getItem(LANG_KEY);
        lang0 = saved === "zh" || saved === "en" ? saved : /^zh\b/i.test(navigator.language || "") ? "zh" : "en";
      } catch (e) {}
      setLang(lang0, false);

      if (document.fonts) document.fonts.ready.then(paintMail).catch(() => {});
      new MutationObserver(paintMail).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintMail);
      addEventListener("resize", paintMail);
    </script>
  </body>
</html>
