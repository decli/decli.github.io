    <style>
      /* ═══════════════════════════════════════════════════════════════
         decli · 作品集

         ── 加一个项目要改哪里 ──
         只改 sites.js。分类、筛选、搜索、埋点、中英文全都跟着数据走，
         这个文件一个字都不用动。

         ── 视觉：为什么是「极光 + 风场 + 光晕」──
         这三样都是 /ftms/ 里已经在用的语言。入口页跟子站长得像，点进去
         才不会有「换了一个网站」的断裂感。而且全是纯 CSS：
         没有依赖，没有图片，没有字体请求，首屏就是这一个文件。

         动效克制：极光 40 秒一圈、风场 26 秒一轮，位移都很小。
         入口页要的是「有呼吸」，不是「在动」—— 动得看得出来就抢注意力了。
         `prefers-reduced-motion` 下全部停掉。
         ═══════════════════════════════════════════════════════════════ */

      :root {
        --bg: #f5f7fc;
        --card: rgba(255, 255, 255, 0.66);
        --card-solid: #fff;
        --line: rgba(18, 32, 68, 0.09);
        --line-2: rgba(18, 32, 68, 0.16);
        --text: #101828;
        --text-2: #4a566d;
        --text-3: #7b879e;
        --brand: #3b5bd6;
        --brand-2: #7c5cff;
        --brand-3: #06b6d4;
        --live: #0f9d58;
        --glow: rgba(59, 91, 214, 0.13);
        --shadow: 0 20px 44px -26px rgba(16, 24, 40, 0.42);
        --shadow-lg: 0 28px 60px -30px rgba(16, 24, 40, 0.5);
        --wind: rgba(59, 91, 214, 0.2);
        --aurora-1: rgba(124, 92, 255, 0.24);
        --aurora-2: rgba(6, 182, 212, 0.2);
        --aurora-3: rgba(59, 91, 214, 0.22);
        --spot-1: rgba(124, 92, 255, 0.13);
        --spot-2: rgba(6, 182, 212, 0.09);
        --scrim: rgba(16, 24, 48, 0.46);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #060a18;
          --card: rgba(20, 28, 50, 0.56);
          --card-solid: #141c32;
          --line: rgba(150, 178, 240, 0.13);
          --line-2: rgba(150, 178, 240, 0.26);
          --text: #eaf0ff;
          --text-2: #a6b3d2;
          --text-3: #78849f;
          --brand: #7c9bff;
          --brand-2: #a78bfa;
          --brand-3: #22d3ee;
          --live: #34d399;
          --glow: rgba(124, 155, 255, 0.2);
          --shadow: 0 24px 54px -28px rgba(0, 0, 0, 0.85);
          --shadow-lg: 0 32px 70px -32px rgba(0, 0, 0, 0.9);
          --wind: rgba(143, 169, 255, 0.3);
          --aurora-1: rgba(124, 92, 255, 0.3);
          --aurora-2: rgba(6, 182, 212, 0.22);
          --aurora-3: rgba(59, 91, 214, 0.28);
          --spot-1: rgba(150, 120, 255, 0.16);
          --spot-2: rgba(34, 211, 238, 0.1);
          --scrim: rgba(2, 5, 14, 0.66);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #060a18;
        --card: rgba(20, 28, 50, 0.56);
        --card-solid: #141c32;
        --line: rgba(150, 178, 240, 0.13);
        --line-2: rgba(150, 178, 240, 0.26);
        --text: #eaf0ff;
        --text-2: #a6b3d2;
        --text-3: #78849f;
        --brand: #7c9bff;
        --brand-2: #a78bfa;
        --brand-3: #22d3ee;
        --live: #34d399;
        --glow: rgba(124, 155, 255, 0.2);
        --shadow: 0 24px 54px -28px rgba(0, 0, 0, 0.85);
        --shadow-lg: 0 32px 70px -32px rgba(0, 0, 0, 0.9);
        --wind: rgba(143, 169, 255, 0.3);
        --aurora-1: rgba(124, 92, 255, 0.3);
        --aurora-2: rgba(6, 182, 212, 0.22);
        --aurora-3: rgba(59, 91, 214, 0.28);
        --spot-1: rgba(150, 120, 255, 0.16);
        --spot-2: rgba(34, 211, 238, 0.1);
        --scrim: rgba(2, 5, 14, 0.66);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.7 "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Source Han Sans SC",
          "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      body[data-lang="en"] {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      /* ── 极光：三团大色斑，缓慢漂浮 + 跟着鼠标做视差 ──
         两个动作要拆到两层上：外层 span 只做视差位移，内层 i 只做漂浮关键帧。
         挤在同一个元素上的话，`animation` 里的 transform 会把 JS 写的那个
         整帧覆盖掉 —— 视差看起来就完全没生效，而且不报任何错。 */
      .aurora {
        position: fixed;
        inset: -20% -10%;
        z-index: 0;
        pointer-events: none;
        filter: blur(70px);
      }
      .aurora span {
        position: absolute;
        inset: 0;
        display: block;
        will-change: transform;
        /* 比指针慢半拍才有「跟」的感觉；一步到位反而像整个背景被钉在光标上 */
        transition: transform 0.7s cubic-bezier(0.22, 0.8, 0.3, 1);
      }
      .aurora i {
        position: absolute;
        display: block;
        border-radius: 50%;
        animation: float 40s ease-in-out infinite;
      }
      .aurora span:nth-child(1) i { width: 46vw; height: 46vw; top: -6%; left: 52%; background: var(--aurora-1); }
      .aurora span:nth-child(2) i { width: 38vw; height: 38vw; top: 34%; left: -6%; background: var(--aurora-2); animation-duration: 52s; animation-delay: -14s; }
      .aurora span:nth-child(3) i { width: 42vw; height: 42vw; top: 62%; left: 58%; background: var(--aurora-3); animation-duration: 46s; animation-delay: -26s; }
      @keyframes float {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        33%      { transform: translate3d(4%, -5%, 0) scale(1.07); }
        66%      { transform: translate3d(-5%, 4%, 0) scale(0.95); }
      }

      /* ── 流光：一团跟着指针走的高光 ──
         不加过渡，让它精确贴着手；「慢半拍」那件事交给上面的极光去做，
         两层一快一慢，才有厚度。 */
      .spot {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s;
        background:
          radial-gradient(420px circle at var(--px, 50vw) var(--py, 32vh), var(--spot-1), transparent 66%),
          radial-gradient(760px circle at var(--px, 50vw) var(--py, 32vh), var(--spot-2), transparent 70%);
      }
      body[data-pointer="1"] .spot { opacity: 1; }

      /* ── 泡泡：画在 canvas 上，压在内容底下 ── */
      .bubbles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }


      /* ── 风场：几条常年不改向的流线 ── */
      .wind { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
      .wind path {
        fill: none;
        stroke: var(--wind);
        stroke-linecap: round;
        stroke-dasharray: 210 1500;
        animation: drift 26s linear infinite;
      }
      .wind path:nth-child(2) { animation-duration: 34s; animation-delay: -6s; }
      .wind path:nth-child(3) { animation-duration: 29s; animation-delay: -14s; }
      .wind path:nth-child(4) { animation-duration: 38s; animation-delay: -3s; }
      .wind path:nth-child(5) { animation-duration: 31s; animation-delay: -19s; }
      .wind path:nth-child(6) { animation-duration: 43s; animation-delay: -11s; }
      @keyframes drift { to { stroke-dashoffset: -1710; } }

      .page {
        position: relative;
        z-index: 1;
        width: min(1120px, 100%);
        margin: 0 auto;
        padding: clamp(26px, 5vh, 46px) clamp(18px, 4vw, 32px) 60px;
      }

      /* ═══ 页眉 ═══ */
      header.top { display: flex; align-items: center; gap: 10px; margin-bottom: clamp(38px, 7vh, 70px); }
      .me { display: flex; align-items: center; gap: 11px; font-weight: 650; letter-spacing: 0.02em; font-size: 15.5px; }
      .avatar {
        width: 36px; height: 36px; border-radius: 12px; flex: none;
        display: grid; place-content: center;
        background: linear-gradient(140deg, var(--brand), var(--brand-2));
        color: #fff; font-size: 16px; font-weight: 700;
        box-shadow: 0 6px 18px -6px var(--brand);
      }
      .spacer { flex: 1; }
      .ghost {
        display: inline-flex; align-items: center; justify-content: center; gap: 5px;
        height: 36px; min-width: 36px; padding: 0 10px;
        border: 1px solid var(--line); border-radius: 11px;
        background: var(--card); backdrop-filter: blur(12px);
        color: var(--text-2); font: inherit; font-size: 13px; font-weight: 600;
        cursor: pointer; text-decoration: none;
        transition: border-color 0.16s, color 0.16s, transform 0.16s;
      }
      .ghost:hover { border-color: var(--line-2); color: var(--text); transform: translateY(-1px); }
      .ghost:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

      /* ═══ 主标题 ═══ */
      h1 {
        margin: 0 0 14px;
        font-size: clamp(34px, 6.4vw, 60px);
        font-weight: 750;
        line-height: 1.16;
        letter-spacing: -0.025em;
      }
      h1 .g {
        background: linear-gradient(96deg, var(--brand), var(--brand-2) 55%, var(--brand-3));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .lede { margin: 0 0 22px; max-width: 52ch; color: var(--text-2); font-size: clamp(15px, 1.9vw, 17px); }

      .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 30px; }
      .stat { display: flex; align-items: baseline; gap: 6px; color: var(--text-3); font-size: 13px; }
      .stat b {
        font-size: 21px; font-weight: 700; color: var(--text);
        font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
      }

      /* ═══ 工具条：搜索 + 分类 ═══ */
      .tools { display: grid; gap: 12px; margin-bottom: 22px; }
      .find {
        display: flex; align-items: center; gap: 9px;
        height: 46px; padding: 0 15px;
        border: 1px solid var(--line); border-radius: 13px;
        background: var(--card); backdrop-filter: blur(12px);
        transition: border-color 0.16s, box-shadow 0.16s;
      }
      .find:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--glow); }
      .find svg { flex: none; color: var(--text-3); }
      .find input { flex: 1; min-width: 0; border: 0; background: none; color: inherit; font: inherit; outline: none; }
      .find input::placeholder { color: var(--text-3); }
      .find kbd {
        flex: none; padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px;
        color: var(--text-3); font: 600 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .cats { display: flex; flex-wrap: wrap; gap: 8px; }
      .cat {
        display: inline-flex; align-items: center; gap: 7px;
        height: 34px; padding: 0 13px;
        border: 1px solid var(--line); border-radius: 999px;
        background: var(--card); color: var(--text-2);
        font: inherit; font-size: 13.5px; font-weight: 550;
        cursor: pointer; white-space: nowrap;
        transition: border-color 0.16s, color 0.16s, background 0.16s;
      }
      .cat:hover { border-color: var(--line-2); color: var(--text); }
      .cat:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .cat[aria-pressed="true"] {
        border-color: transparent; color: #fff;
        background: linear-gradient(120deg, var(--brand), var(--brand-2));
        box-shadow: 0 6px 18px -8px var(--brand);
      }
      .cat em {
        font-style: normal; font-size: 11.5px; font-weight: 700;
        padding: 1px 6px; border-radius: 999px;
        background: rgba(125, 140, 180, 0.16); color: inherit;
        font-variant-numeric: tabular-nums;
      }
      .cat[aria-pressed="true"] em { background: rgba(255, 255, 255, 0.22); }

      /* ═══ 卡片网格 ═══ */
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
        grid-auto-flow: dense;
      }
      .card {
        position: relative;
        display: flex; flex-direction: column; gap: 12px;
        padding: 18px;
        border: 1px solid var(--line); border-radius: 18px;
        background: var(--card); backdrop-filter: blur(14px);
        color: inherit; text-decoration: none;
        overflow: hidden;
        transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        animation: rise 0.5s cubic-bezier(0.22, 0.8, 0.3, 1) backwards;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
      /* 光晕跟着指针走 —— 跟 /ftms/ 看板上的卡片同一个手法。
         位置由 JS 写进 --mx / --my，CSS 只负责画。 */
      .card::before {
        content: "";
        position: absolute; inset: -1px; border-radius: inherit;
        background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), var(--glow), transparent 72%);
        opacity: 0; transition: opacity 0.24s; pointer-events: none;
      }
      .card:hover { border-color: var(--line-2); transform: translateY(-3px); box-shadow: var(--shadow); }
      .card:hover::before { opacity: 1; }
      .card:focus-within { border-color: var(--line-2); }
      .card[hidden] { display: none; }

      /* 有在线地址的占两格 —— 能点开试的东西，值得大一点 */
      @media (min-width: 760px) {
        .card[data-featured] { grid-column: span 2; }
      }
      .card[data-featured] { padding: 22px; }
      .card[data-featured]:hover { box-shadow: var(--shadow-lg); }

      .head { display: flex; align-items: flex-start; gap: 13px; }
      .mark {
        width: 44px; height: 44px; border-radius: 13px; flex: none;
        display: grid; place-content: center; overflow: hidden;
        background: var(--card-solid); border: 1px solid var(--line);
      }
      .mark img { width: 44px; height: 44px; display: block; }
      .mark.tinted { border: 0; color: #fff; }
      .mark svg { display: block; }
      .card[data-featured] .mark { width: 50px; height: 50px; border-radius: 15px; }
      .card[data-featured] .mark img { width: 50px; height: 50px; }

      .title { min-width: 0; flex: 1; }
      .title h2 {
        margin: 0; font-size: 16.5px; font-weight: 680; letter-spacing: -0.005em;
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      }
      .card[data-featured] .title h2 { font-size: 18.5px; }
      .live {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 1px 8px; border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--live) 42%, transparent);
        color: var(--live); font-size: 11px; font-weight: 650; letter-spacing: 0.02em;
      }
      .live::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
      .kind { color: var(--text-3); font-size: 12.5px; font-weight: 500; margin-top: 2px; }

      .desc { margin: 0; color: var(--text-2); font-size: 13.5px; line-height: 1.65; }
      .card[data-featured] .desc { font-size: 14px; }

      .tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag {
        padding: 2px 9px; border-radius: 7px;
        background: color-mix(in srgb, var(--brand) 9%, transparent);
        color: var(--text-2); font-size: 11.5px; letter-spacing: 0.01em;
      }

      .acts { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }
      .btn {
        display: inline-flex; align-items: center; gap: 6px;
        height: 34px; padding: 0 14px; border-radius: 10px;
        font-size: 13px; font-weight: 620; text-decoration: none;
        border: 1px solid var(--line); color: var(--text-2); background: transparent;
        transition: border-color 0.16s, color 0.16s, transform 0.16s, background 0.16s;
      }
      .btn:hover { border-color: var(--line-2); color: var(--text); transform: translateY(-1px); }
      .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .btn.primary {
        border-color: transparent; color: #fff;
        background: linear-gradient(120deg, var(--brand), var(--brand-2));
        box-shadow: 0 8px 20px -10px var(--brand);
      }
      .btn.primary:hover { color: #fff; filter: brightness(1.06); }
      .btn:disabled { opacity: 0.42; cursor: default; pointer-events: none; }

      .none { padding: 44px 0; text-align: center; color: var(--text-3); font-size: 14px; }
      .none[hidden] { display: none; }

      /* ═══ 页脚 ═══ */
      footer {
        margin-top: 52px; padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px;
        color: var(--text-3); font-size: 12.5px;
      }
      footer .owner { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
      footer .mail {
        display: inline-flex; align-items: center; padding: 0 2px;
        border: 0; border-radius: 5px; background: none; color: inherit; font: inherit;
        cursor: pointer; transition: opacity 0.16s;
      }
      footer .mail:hover { opacity: 0.7; }
      footer .mail:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      footer canvas { vertical-align: -0.22em; }
      .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: 0.5; }

      #toast {
        position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
        padding: 10px 17px; border-radius: 11px;
        background: var(--card-solid); border: 1px solid var(--line-2);
        box-shadow: var(--shadow); color: var(--text); font-size: 13px;
        opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
        z-index: 9;
      }
      #toast[data-on="1"] { opacity: 1; transform: translate(-50%, 0); }

      /* ═══ 连连看 ═══
         棋盘上的 12 种图案就是这 12 个项目自己的图标 —— 玩一局，等于把它们
         从头到尾认了两遍。游戏在替入口页干活，而不是跟它抢注意力。
         尺寸（--tile / --gap / --ico / --cols）由 JS 按可用空间算好写进来：
         格子必须是正方形，还得同时塞进宽和高，交给 CSS 猜不如直接算。 */
      .game {
        position: fixed; inset: 0; z-index: 40;
        display: grid; place-items: center;
        padding: 10px;
        background: var(--scrim);
        backdrop-filter: blur(10px);
        animation: gfade 0.2s ease-out;
      }
      .game[hidden] { display: none; }
      @keyframes gfade { from { opacity: 0; } }

      .sheet {
        position: relative;
        width: min(900px, 100%); max-height: 100%;
        display: flex; flex-direction: column; gap: 11px;
        padding: 15px clamp(12px, 2.6vw, 20px) 14px;
        border: 1px solid var(--line-2); border-radius: 22px;
        background: var(--card-solid); box-shadow: var(--shadow-lg);
        overflow: hidden;
      }
      .ghd { display: flex; align-items: flex-start; gap: 10px; }
      .ghd h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.012em; }
      .ghd p { margin: 2px 0 0; max-width: 62ch; color: var(--text-3); font-size: 12.5px; line-height: 1.55; }

      .gnum { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 18px; }
      .gnum > span { display: flex; align-items: baseline; gap: 5px; color: var(--text-3); font-size: 12px; }
      .gnum b { color: var(--text); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .combo {
        margin-left: auto; padding: 3px 11px; border-radius: 999px;
        background: linear-gradient(120deg, var(--brand), var(--brand-2));
        color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap;
        opacity: 0; transform: scale(0.8); transition: opacity 0.18s, transform 0.18s;
      }
      .combo[data-on="1"] { opacity: 1; transform: scale(1); animation: cpop 0.3s; }
      @keyframes cpop { 50% { transform: scale(1.15); } }

      .gtime { height: 5px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--text-3) 24%, transparent); }
      .gtime i {
        display: block; height: 100%; border-radius: inherit; transform-origin: left;
        background: linear-gradient(90deg, var(--brand-3), var(--brand-2));
      }
      /* 剩四分之一就变红。颜色是唯一的「快没了」提示，不用再弹字 */
      .gtime[data-low="1"] i { background: linear-gradient(90deg, #f59e0b, #ef4444); }

      /* 上下留出的这点空当是给连线走的：绕棋盘外面那一段会画在这里，
         贴着 0 边距的话线会被压成一条紧贴格子的细缝，看不出「绕过去了」 */
      .board { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; padding: 13px 0; }
      .board > canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .tiles { display: grid; grid-template-columns: repeat(var(--cols, 8), var(--tile, 52px)); gap: var(--gap, 7px); }

      .tile {
        width: var(--tile, 52px); height: var(--tile, 52px);
        display: grid; place-content: center; padding: 0;
        border: 1px solid var(--tc-line); border-radius: calc(var(--tile, 52px) * 0.24);
        background: var(--tc-bg); color: var(--tc-hot);
        cursor: pointer; -webkit-tap-highlight-color: transparent;
        transition: transform 0.13s, box-shadow 0.13s, border-color 0.13s;
      }
      .tile img, .tile svg { width: var(--ico, 30px); height: var(--ico, 30px); display: block; }
      .tile b { font-size: calc(var(--ico, 30px) * 0.78); font-weight: 800; line-height: 1; }
      .tile:hover { transform: translateY(-2px); box-shadow: 0 9px 18px -11px var(--tc-hot); }
      .tile:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .tile[data-sel="1"] {
        border-color: var(--tc-hot); transform: translateY(-2px);
        box-shadow: 0 0 0 2px var(--tc-hot), 0 12px 22px -12px var(--tc-hot);
      }
      /* 提示的边框是静态的，动画只是锦上添花 —— 关掉动效后提示仍然看得见 */
      .tile[data-hint="1"] { border-color: var(--tc-hot); box-shadow: 0 0 0 2px var(--tc-hot); animation: ghint 0.7s ease-in-out 2; }
      @keyframes ghint { 50% { transform: translateY(-4px) scale(1.07); } }
      .tile[data-bad="1"] { animation: gbad 0.32s; }
      @keyframes gbad { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
      .tile[data-go="1"] { animation: ggone 0.26s ease-in forwards; pointer-events: none; }
      @keyframes ggone { to { opacity: 0; transform: scale(0.35) rotate(10deg); } }
      /* 消掉的格子留着位置不塌 —— 塌了整盘会跳，也就没法连线了 */
      .tile[data-gone="1"] { visibility: hidden; pointer-events: none; }

      .gft { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .gft .hit {
        margin-left: auto; max-width: 46%; color: var(--text-2); font-size: 12.5px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        opacity: 0; transition: opacity 0.22s;
      }
      .gft .hit[data-on="1"] { opacity: 1; }

      .over {
        position: absolute; inset: 0; z-index: 2;
        display: grid; place-items: center; text-align: center; padding: 20px;
        background: color-mix(in srgb, var(--card-solid) 90%, transparent);
        backdrop-filter: blur(5px); animation: gfade 0.22s ease-out;
      }
      .over[hidden] { display: none; }
      .over b { display: block; font-size: clamp(22px, 5vw, 28px); font-weight: 750; letter-spacing: -0.02em; }
      .over p { margin: 7px 0 18px; color: var(--text-2); font-size: 14px; }
      .over .row { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }
      .over .rec {
        display: inline-block; margin-bottom: 10px; padding: 2px 10px; border-radius: 999px;
        background: linear-gradient(120deg, var(--brand), var(--brand-2));
        color: #fff; font-size: 12px; font-weight: 700;
      }

      /* 页眉窄了先丢按钮上的字，图标还在 —— 丢按钮本身等于把入口藏起来 */
      @media (max-width: 430px) {
        #playT { display: none; }
      }

      /* 有人明确要求少动效，就一动不动 */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .aurora i, .wind path { animation: none; }
        .aurora span { transition: none; transform: none !important; }
        .spot { display: none; }
        .wind path { stroke-dasharray: none; }
        .card { animation: none; }
        .card, .btn, .ghost, .cat { transition: none; }
        .card:hover, .btn:hover, .ghost:hover { transform: none; }
        /* 游戏是点进来才有的，不是环境动效 —— 照常能玩，只是不再动 */
        .game, .over, .tile, .combo { animation: none; transition: none; }
        .tile:hover { transform: none; }
      }
    </style>
  </head>

    <script>
      /* ═══ 界面文案 ═══
         项目本身的中英文在 sites.js 里，这里只放界面自己的词。 */

        zh: {

             「做了几个能用的东西」说的是**结果**，谁都能说，也就谁都记不住。

      /* 图标：给没有自己 favicon 的项目用。

      const ICONS = {
        globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>',
        target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
        chat: '<path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.5A8 8 0 0 1 13 4a8 8 0 0 1 8 8Z"/><path d="M9 11h.01M13 11h.01M17 11h.01"/>',
        tab: '<rect x="3" y="5" width="18" height="15" rx="2.5"/><path d="M3 9.5h7l1.6-2.4H21"/>',
        scroll: '<path d="M12 4v16"/><path d="m7 9 5-5 5 5"/><path d="m7 15 5 5 5-5"/>',

        package: '<path d="m12 3 8 4.2v9.6L12 21l-8-4.2V7.2Z"/><path d="M4.3 7.3 12 11.4l7.7-4.1M12 11.4V21"/>',
        chess: '<path d="M9 4h6v2.6l2 2.4H7l2-2.4Z"/><path d="M8.4 9h7.2l-.9 6H9.3Z"/><path d="M6.5 20h11l-.8-2.6H7.3Z"/>',
      };

      const S = { lang: "zh", cat: "all", q: "" };
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      /* 字段可以是字符串（中英文同名），也可以是 {zh, en} */
      const L = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v[S.lang] ?? v.zh : v);
      const t = (k) => I18N[S.lang][k];

      const PROJECTS = Array.isArray(window.PROJECTS) ? window.PROJECTS : [];
      const CATEGORIES = Array.isArray(window.CATEGORIES) ? window.CATEGORIES : [];
      /* 能点开试的排前面 —— 首屏就该是「可以马上玩」的那几个 */
      const LIST = [...PROJECTS].sort((a, b) => (b.href ? 1 : 0) - (a.href ? 1 : 0));

      const el = {
        h1: document.getElementById("h1"), lede: document.getElementById("lede"),
        stats: document.getElementById("stats"), cats: document.getElementById("cats"),

        toast: document.getElementById("toast"), playT: document.getElementById("playT"),
      };

      function catName(key) {
        const c = CATEGORIES.find((x) => x.key === key);
        return c ? c[S.lang] : key;
      }

      function renderChrome() {
        const [a, b] = t("title");
        /* 中文两段直接相连（做了几个 + 能用的东西）；英文之间要有个空格，
           不然会渲染成 "A few thingsthat actually work" —— 一眼就是拼接出来的 */
        const gap = S.lang === "en" ? " " : "";
        el.h1.innerHTML = `${esc(a)}${gap}<span class="g">${esc(b)}</span>`;
        el.lede.textContent = t("lede");
        el.q.placeholder = t("search");
        el.q.setAttribute("aria-label", t("search"));
        el.none.textContent = t("none");
        el.lang.textContent = t("langBtn");
        el.theme.title = t("themeTitle");
        el.rights.textContent = t("rights");
        el.playT.textContent = t("game").btn;
        document.getElementById("play").title = t("game").title;
        document.getElementById("mail").setAttribute("aria-label", S.lang === "zh" ? "复制邮箱" : "Copy email");

        const live = LIST.filter((p) => p.href).length;
        el.stats.innerHTML =
          `<span class="stat"><b>${LIST.length}</b>${esc(t("projects"))}</span>` +
          `<span class="stat"><b>${live}</b>${esc(t("online"))}</span>`;

        el.cats.innerHTML =
          `<button class="cat" data-cat="all" aria-pressed="${S.cat === "all"}">${esc(t("all"))}<em>${LIST.length}</em></button>` +
          CATEGORIES.map((c) => {
            const n = LIST.filter((p) => p.cat === c.key).length;
            if (!n) return "";
            return `<button class="cat" data-cat="${esc(c.key)}" aria-pressed="${S.cat === c.key}">${esc(c[S.lang])}<em>${n}</em></button>`;
          }).join("");
      }

      function cardHTML(p, i) {
        const mark = String(p.icon || "").startsWith("/")
          ? `<span class="mark"><img src="${esc(p.icon)}" alt="" loading="lazy"
               onerror="this.parentElement.classList.add('tinted');this.parentElement.style.background='linear-gradient(140deg,#64748b,#475569)';this.outerHTML='&#128279;'"></span>`
          : `<span class="mark tinted" style="background:linear-gradient(140deg,${esc((p.tint || ["#64748b", "#475569"])[0])},${esc((p.tint || ["#64748b", "#475569"])[1])})">
               <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[p.icon] || ICONS.package}</svg>
             </span>`;

        const acts =
          (p.href
            ? `<a class="btn primary" href="${esc(p.href)}" target="_blank" rel="noopener noreferrer" data-slug="${esc(p.slug)}" data-kind="demo">
                 ${esc(t("open"))}
                 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
               </a>`
            : "") +
          `<a class="btn" href="https://github.com/decli/${esc(p.repo)}" target="_blank" rel="noopener noreferrer" data-slug="${esc(p.slug)}" data-kind="repo">
             <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
             ${esc(t("source"))}
           </a>`;

        const tags = (L(p.tags) || []).map((x) => `<span class="tag">${esc(x)}</span>`).join("");
        const hay = [L(p.name), p.slug, p.repo, L(p.desc), (L(p.tags) || []).join(" "), catName(p.cat)].join(" ").toLowerCase();

        return `<article class="card"${p.href ? " data-featured" : ""} data-cat="${esc(p.cat)}"
                  data-find="${esc(hay)}" style="animation-delay:${Math.min(i, 12) * 45}ms">
          <div class="head">
            ${mark}
            <div class="title">
              <h2>${esc(L(p.name))}${p.href ? `<span class="live">${esc(t("liveTag"))}</span>` : ""}</h2>
              <div class="kind">${esc(catName(p.cat))}</div>
            </div>
          </div>
          <p class="desc">${esc(L(p.desc))}</p>
          <div class="tags">${tags}</div>
          <div class="acts">${acts}</div>
        </article>`;
      }

      function render() {
        renderChrome();
        if (!LIST.length) {
          el.grid.innerHTML = `<p class="none" style="grid-column:1/-1">项目清单没加载出来 —— 检查 sites.js 是否存在且语法正确。</p>`;
          return;
        }
        el.grid.innerHTML = LIST.map(cardHTML).join("");
        filter();
      }

      function filter() {
        const k = S.q.trim().toLowerCase();
        let n = 0;
        for (const c of el.grid.querySelectorAll(".card")) {
          const ok = (S.cat === "all" || c.dataset.cat === S.cat) && (!k || c.dataset.find.includes(k));
          c.hidden = !ok;
          if (ok) n++;
        }
        el.none.hidden = n > 0;
      }

      /* ── 事件 ── */
      el.cats.addEventListener("click", (e) => {
        const b = e.target.closest(".cat");
        if (!b) return;
        S.cat = b.dataset.cat;
        for (const x of el.cats.querySelectorAll(".cat")) x.setAttribute("aria-pressed", String(x.dataset.cat === S.cat));
        filter();
        if (window.gtag) gtag("event", "filter_category", { site: "portal", category: S.cat });
      });

      el.q.addEventListener("input", () => { S.q = el.q.value; filter(); });
      addEventListener("keydown", (e) => {
        // 游戏面板开着的时候整页的快捷键都归它，别把焦点抢到搜索框去
        if (document.body.dataset.game === "1") return;
        if (e.key === "/" && document.activeElement !== el.q) { e.preventDefault(); el.q.focus(); }
        else if (e.key === "Escape" && document.activeElement === el.q) {
          el.q.value = ""; S.q = ""; filter(); el.q.blur();
        }
      });

      /* 光晕跟随。一个委托监听覆盖所有卡片，加卡片不用再挂事件 */
      el.grid.addEventListener("pointermove", (e) => {
        const c = e.target.closest(".card");
        if (!c) return;
        const r = c.getBoundingClientRect();
        c.style.setProperty("--mx", `${e.clientX - r.left}px`);
        c.style.setProperty("--my", `${e.clientY - r.top}px`);
      });

      /* 点击去哪，记一笔。只报 slug 和「点的是体验还是源码」*/
      el.grid.addEventListener("click", (e) => {
        const a = e.target.closest("a[data-slug]");
        if (a && window.gtag) gtag("event", "open_project", { site: "portal", target: a.dataset.slug, kind: a.dataset.kind });
      });

      /* ── 语言 ──
         默认跟浏览器走：navigator.language 不是中文就开英文。
         手动切过就记住，之后不再猜。 */
      const LANG_KEY = "decli.lang";
      function setLang(l, remember) {
        S.lang = l;
        document.body.dataset.lang = l;
        document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
        if (remember) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} }
        render();
        paintMail();
        // 游戏面板开着的话跟着换语言（引擎是个 IIFE，从 window 上取）
        if (window.__gameLang) window.__gameLang();
      }
      el.lang.addEventListener("click", () => {
        const next = S.lang === "zh" ? "en" : "zh";
        setLang(next, true);
        if (window.gtag) gtag("event", "switch_language", { site: "portal", to: next });
      });

      /* ── 明暗 ──
         入口页只要「跟系统」和「反过来」两种，三档轮换太重了。
         选择记在 localStorage，跟子站各自的记忆互不干扰。 */
      const THEME_KEY = "decli.theme";
      const root = document.documentElement;
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "dark" || saved === "light") root.dataset.theme = saved;
      } catch (e) {}
      el.theme.addEventListener("click", () => {
        const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const next = (root.dataset.theme || (sysDark ? "dark" : "light")) === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        paintMail();
        if (window.gtag) gtag("event", "switch_theme", { site: "portal", to: next });
      });

      /* ── 版权邮箱 ──
         画在 canvas 上：DOM 里没有文本节点，源码里也没有可直接正则捞走的
         字面量，更没写进 aria-label / title —— 那些都是纯文本属性，
         写进去等于前面全白做。贴在公开网页上的邮箱，半天就会进群发名录。
         补偿：整块是个按钮，点击 / 回车即复制，读屏用户拿到的是可粘贴的
         真地址，而爬虫不会去点按钮。 */
      const LOCAL = [100, 101, 99, 108, 105];
      const HOST = [113, 113, 46, 99, 111, 109];
      const mail = () => String.fromCharCode.apply(null, LOCAL) + "@" + String.fromCharCode.apply(null, HOST);

      function paintMail() {
        const cv = document.getElementById("mailc");
        const probe = cv.getContext("2d");
        if (!probe) return;
        const cs = getComputedStyle(cv.parentElement);
        const size = 12.5;
        const font = `500 ${size}px ${cs.fontFamily}`;
        probe.font = font;
        const text = mail();
        const w = Math.ceil(probe.measureText(text).width) + 2;
        const h = Math.ceil(size * 1.4);
        const dpr = Math.min(devicePixelRatio || 1, 3);
        /* ⚠️ 给 canvas 赋 width/height 会**清空**它，所以字体必须在这之后再设一次 */
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        cv.style.width = w + "px";
        cv.style.height = h + "px";
        const ctx = cv.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.font = font;
        ctx.textBaseline = "middle";
        ctx.fillStyle = cs.color;
        ctx.fillText(text, 1, h / 2);
      }

      document.getElementById("mail").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(mail());
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = mail();
          ta.style.cssText = "position:fixed;top:-100px;opacity:0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        el.toast.textContent = t("copied");
        el.toast.dataset.on = "1";
        setTimeout(() => (el.toast.dataset.on = "0"), 1800);
      });

      /* ═══════════════════════════════════════════════════════════════
         背景：流光跟随 + 可戳破的泡泡

         ── 泡泡不计分 ──
         它就是背景本身：一直在飘，路过顺手戳一下有个爆开的反馈，不戳也不
         碍事。真要玩的在页眉那个「连连看」里 —— 一个页面上摆两套记分，
         谁都不知道自己在玩哪个。

         ── 点击怎么不跟正事打架 ──
         canvas 是 pointer-events:none 压在最底下，点击在 document 上接。
         落在卡片、链接、按钮、输入框上的一律放行，只有点在空白处才当戳泡泡。
         这样「点空白关掉输入焦点」这种下意识动作也不会被抢走。

         ── 开销 ──
         最多 16 个泡泡 + 60 个碎片，都是实心圆。标签页切走就停 rAF，
         `prefers-reduced-motion` 下整套不启动。
         ═══════════════════════════════════════════════════════════════ */
      (function () {
        const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const cv = document.getElementById("bub");
        const ctx = cv.getContext("2d");

        /* ── 流光跟随 ──
           pointermove 只记坐标，真正写样式放到 rAF 里 —— 指针事件一秒能来
           一百多次，每次都写一遍 style 会让整页跟着抖。 */
        let px = innerWidth / 2, py = innerHeight * 0.32, dirty = false, moved = false;
        const spans = document.querySelectorAll(".aurora span");
        const FACTOR = [[0.035, 0.03], [-0.028, -0.022], [0.045, -0.035]];

        addEventListener("pointermove", (e) => {
          px = e.clientX; py = e.clientY; dirty = true;
          if (!moved) { moved = true; document.body.dataset.pointer = "1"; }
        }, { passive: true });

        function paintPointer() {
          if (!dirty) return;
          dirty = false;
          document.body.style.setProperty("--px", px + "px");
          document.body.style.setProperty("--py", py + "px");
          const dx = px - innerWidth / 2, dy = py - innerHeight / 2;
          spans.forEach((sp, i) => {
            const f = FACTOR[i] || FACTOR[0];
            sp.style.transform = `translate3d(${(dx * f[0]).toFixed(1)}px, ${(dy * f[1]).toFixed(1)}px, 0)`;
          });
        }

        if (REDUCED) return;

        /* ── 泡泡 ── */
        let W = 0, H = 0, dpr = 1;
        const bubbles = [], parts = [];
        const MAX = 16;
        let pops = 0, raf = 0, prev = 0;

        function resize() {
          dpr = Math.min(devicePixelRatio || 1, 2);
          W = innerWidth; H = innerHeight;
          cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
          cv.style.width = W + "px"; cv.style.height = H + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        addEventListener("resize", resize);

        /* 色相取品牌那一段（蓝 → 紫 → 青），不让泡泡跑出整页的配色 */
        const HUES = [222, 232, 258, 268, 190, 174];
        const rnd = (a, b) => a + Math.random() * (b - a);

        function spawn(atBottom) {
          return {
            x: rnd(0, W),
            y: atBottom ? H + rnd(20, 160) : rnd(0, H),
            r: rnd(9, 30),
            vy: rnd(0.16, 0.5),
            sway: rnd(0.2, 0.7),
            ph: rnd(0, Math.PI * 2),
            hue: HUES[(Math.random() * HUES.length) | 0],
            a: rnd(0.14, 0.34),
          };
        }
        for (let i = 0; i < MAX; i++) bubbles.push(spawn(false));

        function burst(b) {
          const n = 9 + ((Math.random() * 4) | 0);
          for (let i = 0; i < n && parts.length < 60; i++) {
            const ang = (Math.PI * 2 * i) / n + rnd(-0.25, 0.25);
            const sp = rnd(0.9, 2.9);
            parts.push({ x: b.x, y: b.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.35,
                         r: rnd(1.4, 3.4), hue: b.hue, life: 1 });
          }
        }

        function popAt(cx, cy) {
          let hit = false;
          for (let i = bubbles.length - 1; i >= 0; i--) {
            const b = bubbles[i];
            if (Math.hypot(b.x - cx, b.y - cy) <= b.r + 24) {
              burst(b);
              bubbles.splice(i, 1, spawn(true));
              hit = true;
            }
          }
          if (!hit) return;
          pops++;
          // 只报「有人戳过」这一件事，不报次数也不报坐标
          if (pops === 1 && window.gtag) gtag("event", "play_bubbles", { site: "portal" });
        }

        addEventListener("click", (e) => {
          // 游戏面板开着的时候整页都归它，背景不接管任何点击
          if (document.body.dataset.game === "1") return;
          // 落在能点的东西上一律放行：连「点空白处收起输入焦点」都不该被抢走
          if (e.target.closest("a, button, input, select, textarea, label, .card")) return;
          popAt(e.clientX, e.clientY);
        });

        function frame(now) {
          raf = requestAnimationFrame(frame);
          const dt = Math.min((now - prev) / 16.67 || 1, 3);
          prev = now;
          paintPointer();

          ctx.clearRect(0, 0, W, H);

          for (const b of bubbles) {
            b.y -= b.vy * dt;
            b.ph += 0.012 * dt;
            b.x += Math.sin(b.ph) * b.sway * 0.4 * dt;
            if (b.y < -b.r - 20) Object.assign(b, spawn(true));

            const near = Math.hypot(b.x - px, b.y - py) <= b.r + 24;
            const g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.1, b.x, b.y, b.r);
            g.addColorStop(0, `hsla(${b.hue}, 92%, 76%, ${b.a * (near ? 1.7 : 1)})`);
            g.addColorStop(1, `hsla(${b.hue}, 88%, 60%, 0)`);
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();

            // 指针靠近就描一圈 —— 这是唯一的「可以戳」提示，不用文字说明
            if (near) {
              ctx.strokeStyle = `hsla(${b.hue}, 92%, 72%, 0.5)`;
              ctx.lineWidth = 1.4;
              ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4, 0, 7); ctx.stroke();
            }
          }

          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i];
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vy += 0.045 * dt; p.vx *= 0.985; p.life -= 0.022 * dt;
            if (p.life <= 0) { parts.splice(i, 1); continue; }
            ctx.fillStyle = `hsla(${p.hue}, 94%, 72%, ${p.life * 0.75})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, 7); ctx.fill();
          }
        }
        raf = requestAnimationFrame(frame);

        // 标签页切走 / 游戏面板挡在前面就停：没人看的时候没必要一直画
        function halt() { cancelAnimationFrame(raf); raf = 0; }
        function go() { if (!raf) { prev = performance.now(); raf = requestAnimationFrame(frame); } }
        window.__bg = (on) => (on ? go() : halt());
        document.addEventListener("visibilitychange", () => {
          if (document.hidden || document.body.dataset.game === "1") halt();
          else go();
        });
      })();

      /* ═══════════════════════════════════════════════════════════════
         连连看

         ── 为什么是连连看，不是扫雷 ──
         棋盘上的 12 种图案就是这 12 个项目自己的图标。玩一局要把它们来回
         认上好几遍，消掉一对还会报出项目名 —— 游戏在替入口页干活。
         扫雷同样好玩，但它的格子跟项目没有半点关系，那就只是换了张皮的
         扫雷，玩完对这些项目还是一无所知。

         ── 规则 ──
         经典规则：两个相同的图案，中间能用不超过两次拐弯的折线连上就消掉。
         棋盘外面一圈算空地（所以边上的格子可以绕外面连），这也是经典规则。
         判定用 0-1 BFS 在 (格子, 方向) 上跑，转弯记 1 步、直行记 0 步，
         代价超过 2 就剪掉 —— 比一层层套 if 判断「直线 / 一拐 / 两拐」好懂，
         而且顺带把路径吐出来了，画连线不用再算一遍。

         ── 不会卡死 ──
         每消一对就查一次还有没有能连的，没有就自动重排（不扣分不占次数）。
         重排本身也可能无解，所以洗到有解为止；万一连洗 40 次都无解，兜底
         直接把一对相同的换到相邻两格 —— 相邻的同图案永远连得上。
         兜底用的是**交换**不是覆盖：覆盖会让某个图案剩下奇数个，整盘再也
         消不完。

         ── 输赢 ──
         时间条会漏，消一对回 4.5 秒。真在玩的人不会死，发呆的人会。
         漏完就结算 —— 游戏得有输的可能才有意思，而重开只要一次点击。
         ═══════════════════════════════════════════════════════════════ */
      (function () {
        const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const BEST_KEY = "decli.match.best";
        const TMAX = 80;          // 起始秒数
        const GAIN = 4.5;         // 每消一对回多少秒
        const COMBO_MS = 4000;    // 连击窗口
        const COMBO_MAX = 10;
        const HINT_COST = 80, SHUF_COST = 60, SHUFFLES = 3;

        /* 12 个均匀分布的色相。这里**不**沿用卡片的 tint：卡片上有两个项目
           都用地球图标，靠天蓝 / 石板灰区分在卡片上够用，摆成一盘 48 格要
           一眼分清就不够了。图案 + 颜色两重区分，扫盘才不费眼。 */
        const HUE = ["#3b5bd6", "#7c5cff", "#d946ef", "#ec4899", "#f43f5e", "#f97316",
                     "#f59e0b", "#84cc16", "#10b981", "#14b8a6", "#06b6d4", "#0ea5e9"];
        const D = [[1, 0], [0, 1], [-1, 0], [0, -1]];   // 0↔2、1↔3 互为反向（nd ^ 2）

        const KINDS = LIST;
        const playBtn = document.getElementById("play");
        if (!KINDS.length) { playBtn.hidden = true; return; }

        const gameEl = document.getElementById("game");
        const boardEl = document.getElementById("gBoard");
        const tilesEl = document.getElementById("gTiles");
        const lk = document.getElementById("gLink");
        const overEl = document.getElementById("gOver");
        const comboEl = document.getElementById("gCombo");
        const hitEl = document.getElementById("gHit");
        const fillEl = document.getElementById("gFill");
        const timeEl = document.getElementById("gTime");
        const $ = (id) => document.getElementById(id);
        const G = () => I18N[S.lang].game;
        const fmt = (s, n) => String(s).replace("{n}", n);

        let C = 8, R = 6, gw = 10, gh = 8;
        let cells = [], bestBuf = null, fromBuf = null;
        let TILE = 52, GAP = 7, OX = 0, OY = 0, cw = 0, ch = 0, lctx = null;
        let sel = -1, cur = 0;
        let score = 0, combo = 0, comboAt = -1e9, left = 0, shuffles = SHUFFLES;
        let time = TMAX, running = false, raf = 0, prev = 0;
        let flash = null, lastEnd = { cleared: false, rec: false };
        let hitTimer = 0, comboTimer = 0;

        const readBest = () => { try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } };
        const writeBest = (v) => { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} };
        const shuffleArr = (a) => {
          for (let i = a.length - 1; i > 0; i--) {
            const j = (Math.random() * (i + 1)) | 0;
            const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
          }
          return a;
        };

        /* ── 棋盘 ── */
        function tileHTML(k, i) {
          const p = KINDS[k], h = HUE[k % HUE.length];
          const face = String(p.icon || "").startsWith("/")
            ? `<img src="${esc(p.icon)}" alt="" data-h="${esc(h)}" data-c="${esc(String(L(p.name)).trim().charAt(0).toUpperCase())}">`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="${esc(h)}" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">${ICONS[p.icon] || ICONS.package}</svg>`;
          return `<button class="tile" type="button" tabindex="-1" data-i="${i}" aria-label="${esc(L(p.name))}"
            style="--tc-bg:color-mix(in srgb, ${h} 13%, var(--card-solid));--tc-line:color-mix(in srgb, ${h} 32%, transparent);--tc-hot:${h}"
            >${face}</button>`;
        }

        /* 重画整盘。洗牌之后也走这里 —— 一格一格改 DOM 更啰嗦也更容易错。
           已经消掉的格子重画后立刻补回隐藏状态，不然会「复活」。 */
        function repaint() {
          tilesEl.style.setProperty("--cols", C);
          const gone = cells.map((c) => c.gone);
          tilesEl.innerHTML = cells.map((c, i) => tileHTML(c.k, i)).join("");
          const nodes = tilesEl.children;
          for (let i = 0; i < cells.length; i++) {
            cells[i].el = nodes[i];
            if (gone[i]) nodes[i].dataset.gone = "1";
          }
          /* 子站的 favicon 万一取不到（比如那个站还没发出去），退成项目名的
             首字母 —— 退成同一个通用图标的话，三个在线项目会长得一模一样。 */
          for (const img of tilesEl.querySelectorAll("img")) {
            img.addEventListener("error", () => {
              const b = document.createElement("b");
              b.textContent = img.dataset.c || "?";
              b.style.color = img.dataset.h;
              img.replaceWith(b);
            }, { once: true });
          }
          sel = -1;
          setCur(cells.findIndex((c) => !c.gone), true);
          sizeBoard();
        }

        function build() {
          /* 竖屏 6×8、横屏 8×6，都是 48 格 24 对 —— 正好每个项目两对。
             一局之内不再改（转屏只重算格子大小），免得把玩到一半的盘掀了。 */
          const portrait = innerHeight > innerWidth;
          C = portrait ? 6 : 8; R = portrait ? 8 : 6;
          gw = C + 2; gh = R + 2;
          bestBuf = new Uint8Array(gw * gh * 4);
          fromBuf = new Int32Array(gw * gh * 4);
          const deck = [];
          for (let i = 0; i < (C * R) / 2; i++) { const k = i % KINDS.length; deck.push(k, k); }
          shuffleArr(deck);
          cells = deck.map((k) => ({ k, gone: false, el: null }));
          left = (C * R) / 2;
          repaint();
          ensurePlayable();
        }

        let sizing = false;
        /* ⚠️ 棋盘能有多高，**不能**拿棋盘容器自己去量。
           容器多高取决于格子多大，格子多大又取决于容器多高 —— 量一次改一次，
           来回振荡，最后停在一个两边都不满足的值上（矮屏幕上就是格子溢出面板）。
           改成从外往里倒推：屏幕高度，减去面板外边距、面板内边距、几条间隙，
           再减去除棋盘之外那四块的实际高度。这些量全都跟格子大小无关，算一次就定。 */
        function sizeBoard() {
          const bw = boardEl.clientWidth;
          if (!bw || sizing) return;
          sizing = true;
          const sheet = boardEl.parentElement;
          const px = (n, k) => parseFloat(getComputedStyle(n)[k]) || 0;
          let used = px(sheet, "paddingTop") + px(sheet, "paddingBottom") +
                     px(boardEl, "paddingTop") + px(boardEl, "paddingBottom") +
                     px(sheet, "rowGap") * 4 +                      // 五个弹性子项 → 四条间隙
                     px(gameEl, "paddingTop") + px(gameEl, "paddingBottom");
          // .over 是绝对定位的，不算弹性子项，所以这里只点名那四块
          for (const sel of [".ghd", ".gnum", ".gtime", ".gft"]) {
            const n = sheet.querySelector(sel);
            if (n) used += n.getBoundingClientRect().height;
          }
          const bh = Math.max(70, innerHeight - used);
          GAP = C > 6 ? 7 : 8;
          TILE = Math.max(26, Math.min(72,
            Math.floor(Math.min((bw - (C - 1) * GAP) / C, (bh - (R - 1) * GAP) / R))));
          tilesEl.style.setProperty("--tile", TILE + "px");
          tilesEl.style.setProperty("--gap", GAP + "px");
          tilesEl.style.setProperty("--ico", Math.round(TILE * 0.56) + "px");
          sizeCanvas();
          sizing = false;
        }

        function sizeCanvas() {
          const b = boardEl.getBoundingClientRect(), tl = tilesEl.getBoundingClientRect();
          const dpr = Math.min(devicePixelRatio || 1, 2);
          cw = Math.round(b.width); ch = Math.round(b.height);
          if (!cw || !ch) return;
          /* ⚠️ 给 canvas 赋 width/height 会清空画布**并且重置变换**，
             所以 setTransform 必须放在赋值之后。 */
          lk.width = Math.round(cw * dpr); lk.height = Math.round(ch * dpr);
          lctx = lk.getContext("2d");
          lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          OX = tl.left - b.left; OY = tl.top - b.top;
        }

        /* 棋盘外那一圈的坐标会落到画布外面，夹回边上 ——
           线贴着边缘拐弯，跟经典连连看看起来是一回事。 */
        const PX = (gx) => Math.max(4, Math.min(cw - 4, OX + (gx - 1) * (TILE + GAP) + TILE / 2));
        const PY = (gy) => Math.max(4, Math.min(ch - 4, OY + (gy - 1) * (TILE + GAP) + TILE / 2));

        /* ── 连通判定：0-1 BFS，直行 0 步、转弯 1 步，超过 2 步剪掉 ── */
        const free = (x, y) => {
          if (x < 0 || y < 0 || x >= gw || y >= gh) return false;
          if (x === 0 || y === 0 || x === gw - 1 || y === gh - 1) return true;  // 外圈算空地
          return cells[(y - 1) * C + (x - 1)].gone;
        };

        function findPath(a, b) {
          const ax = (a % C) + 1, ay = ((a / C) | 0) + 1;
          const bx = (b % C) + 1, by = ((b / C) | 0) + 1;
          const best = bestBuf, from = fromBuf;
          best.fill(9); from.fill(-2);
          const ok = (x, y) => (x === bx && y === by) || free(x, y);
          const dq = [];
          for (let d = 0; d < 4; d++) {
            const nx = ax + D[d][0], ny = ay + D[d][1];
            if (!ok(nx, ny)) continue;
            const k = ((ny * gw + nx) << 2) | d;
            best[k] = 0; from[k] = -1; dq.push(k);
          }
          let head = 0;
          while (head < dq.length) {
            const k = dq[head++], cell = k >> 2, d = k & 3, tn = best[k];
            const x = cell % gw, y = (cell / gw) | 0;
            if (x === bx && y === by) {
              const pts = [];
              for (let cu = k; cu >= 0; cu = from[cu]) pts.push([(cu >> 2) % gw, ((cu >> 2) / gw) | 0]);
              pts.push([ax, ay]);
              pts.reverse();
              // 只留拐点，共线的中间点丢掉
              const out = [pts[0]];
              for (let i = 1; i < pts.length - 1; i++) {
                const u = out[out.length - 1], v = pts[i], w = pts[i + 1];
                if ((u[0] === v[0] && v[0] === w[0]) || (u[1] === v[1] && v[1] === w[1])) continue;
                out.push(v);
              }
              out.push(pts[pts.length - 1]);
              return out;
            }
            for (let nd = 0; nd < 4; nd++) {
              if ((nd ^ 2) === d) continue;              // 不许原路折回
              const nt = tn + (nd === d ? 0 : 1);
              if (nt > 2) continue;
              const nx = x + D[nd][0], ny = y + D[nd][1];
              if (!ok(nx, ny)) continue;
              const nk = ((ny * gw + nx) << 2) | nd;
              if (best[nk] <= nt) continue;
              best[nk] = nt; from[nk] = k;
              if (nt === tn) dq.splice(head, 0, nk); else dq.push(nk);
            }
          }
          return null;
        }

        function anyMove() {
          const by = new Map();
          for (let i = 0; i < cells.length; i++) {
            if (cells[i].gone) continue;
            const arr = by.get(cells[i].k);
            if (arr) arr.push(i); else by.set(cells[i].k, [i]);
          }
          for (const arr of by.values())
            for (let i = 0; i < arr.length; i++)
              for (let j = i + 1; j < arr.length; j++)
                if (findPath(arr[i], arr[j])) return [arr[i], arr[j]];
          return null;
        }

        const liveCells = () => {
          const a = [];
          for (let i = 0; i < cells.length; i++) if (!cells[i].gone) a.push(i);
          return a;
        };

        function ensurePlayable(announce) {
          if (anyMove()) return false;
          const live = liveCells();
          for (let t = 0; t < 40; t++) {
            const ks = shuffleArr(live.map((i) => cells[i].k));
            live.forEach((i, n) => (cells[i].k = ks[n]));
            if (anyMove()) { repaint(); if (announce) say(G().deadlock); return true; }
          }
          /* 兜底：把一对相同的**换**到相邻两格。相邻的同图案永远连得上。
             注意是交换不是覆盖 —— 覆盖会让某个图案剩下奇数个，整盘消不完。 */
          outer: for (const i of live) {
            for (const j of live) {
              if (j <= i) continue;
              const adj = (j - i === C) || (j - i === 1 && ((i / C) | 0) === ((j / C) | 0));
              if (!adj) continue;
              const m = live.find((x) => x !== i && x !== j && cells[x].k === cells[i].k);
              if (m === undefined) continue;
              const tmp = cells[j].k; cells[j].k = cells[m].k; cells[m].k = tmp;
              break outer;
            }
          }
          repaint();
          if (announce) say(G().deadlock);
          return true;
        }

        /* ── 玩法 ── */
        function shake(node) {
          if (!node || REDUCED) return;
          node.dataset.bad = "1";
          setTimeout(() => node.removeAttribute("data-bad"), 340);
        }
        function clearSel() {
          if (sel >= 0 && cells[sel].el) cells[sel].el.removeAttribute("data-sel");
          sel = -1;
        }
        function setCur(i, silent) {
          if (i < 0) return;
          if (cells[cur] && cells[cur].el) cells[cur].el.tabIndex = -1;
          cur = i;
          if (cells[cur] && cells[cur].el) {
            cells[cur].el.tabIndex = 0;
            if (!silent) cells[cur].el.focus();
          }
        }

        function pick(i) {
          const c = cells[i];
          if (!running || !c || c.gone) return;
          setCur(i, true);
          if (sel === i) { clearSel(); return; }
          if (sel >= 0 && cells[sel].k === c.k) {
            const path = findPath(sel, i);
            if (path) { remove(sel, i, path); return; }
            // 同图案但连不上：这是真的走错了，连击断掉
            shake(cells[sel].el); shake(c.el); breakCombo();
          }
          // 点了别的图案只是「改主意」，不罚
          clearSel();
          sel = i;
          c.el.dataset.sel = "1";
        }

        function remove(a, b, path) {
          const k = cells[a].k;
          flash = { pts: path, t: 1.15, color: getComputedStyle(root).getPropertyValue("--brand-2").trim() || "#7c5cff" };
          for (const i of [a, b]) {
            const c = cells[i];
            c.gone = true;
            c.el.removeAttribute("data-sel");
            if (REDUCED) c.el.dataset.gone = "1";
            else {
              const node = c.el;
              node.dataset.go = "1";
              setTimeout(() => { node.dataset.gone = "1"; node.removeAttribute("data-go"); }, 250);
            }
          }
          sel = -1;
          left--;
          // 键盘落脚点刚好被消掉的话，挪到还活着的格子上，不然 Tab 进不来棋盘
          if (cells[cur] && cells[cur].gone) setCur(cells.findIndex((c) => !c.gone), true);
          const now = performance.now();
          combo = now - comboAt < COMBO_MS ? Math.min(combo + 1, COMBO_MAX) : 1;
          comboAt = now;
          score += 100 + (combo - 1) * 50;
          time = Math.min(TMAX, time + GAIN);
          say("✓ " + L(KINDS[k].name));
          paintCombo();
          paintNums();
          if (left <= 0) { finish(true); return; }
          ensurePlayable(true);
        }

        function breakCombo() { combo = 0; comboAt = -1e9; paintCombo(); }

        function hint() {
          if (!running) return;
          const m = anyMove();
          if (!m) return;
          score = Math.max(0, score - HINT_COST);
          breakCombo();
          paintNums();
          for (const i of m) {
            const node = cells[i].el;
            node.dataset.hint = "1";
            setTimeout(() => node.removeAttribute("data-hint"), 1500);
          }
        }

        function reshuffle() {
          if (!running || shuffles <= 0) return;
          shuffles--;
          score = Math.max(0, score - SHUF_COST);
          breakCombo();
          const live = liveCells();
          const ks = shuffleArr(live.map((i) => cells[i].k));
          live.forEach((i, n) => (cells[i].k = ks[n]));
          repaint();
          ensurePlayable();
          paintNums();
          $("gShuf").textContent = fmt(G().shuf, shuffles);
          $("gShuf").disabled = shuffles <= 0;
        }

        /* ── 画面 ── */
        function say(msg) {
          hitEl.textContent = msg;
          hitEl.dataset.on = "1";
          clearTimeout(hitTimer);
          hitTimer = setTimeout(() => (hitEl.dataset.on = "0"), 1900);
        }
        function paintNums() {
          $("gScore").textContent = score;
          $("gLeft").textContent = left;
          $("gBest").textContent = readBest();
        }
        function paintCombo() {
          if (combo < 2) { comboEl.dataset.on = "0"; return; }
          comboEl.textContent = fmt(G().combo, combo);
          comboEl.dataset.on = "0";
          // 强制回流才能让 cpop 重放 —— 不然连续几次连击只有第一次会跳
          void comboEl.offsetWidth;
          comboEl.dataset.on = "1";
          clearTimeout(comboTimer);
          comboTimer = setTimeout(() => (comboEl.dataset.on = "0"), COMBO_MS);
        }
        function paintTime() {
          fillEl.style.transform = `scaleX(${Math.max(0, time / TMAX)})`;
          timeEl.dataset.low = time / TMAX < 0.25 ? "1" : "0";
        }
        function paintLink(dt) {
          if (!lctx) return;
          lctx.clearRect(0, 0, cw, ch);
          if (!flash) return;
          flash.t -= dt * 2.2;
          if (flash.t <= 0) { flash = null; return; }
          const a = Math.min(1, flash.t);
          lctx.strokeStyle = flash.color;
          lctx.lineCap = "round"; lctx.lineJoin = "round";
          for (const [w, alpha] of [[10, a * 0.2], [3, a]]) {
            lctx.lineWidth = w; lctx.globalAlpha = alpha;
            lctx.beginPath();
            flash.pts.forEach(([gx, gy], i) => (i ? lctx.lineTo(PX(gx), PY(gy)) : lctx.moveTo(PX(gx), PY(gy))));
            lctx.stroke();
          }
          lctx.globalAlpha = 1;
        }

        function tick(now) {
          raf = requestAnimationFrame(tick);
          const dt = Math.min((now - prev) / 1000, 0.25);
          prev = now;
          if (running) {
            time -= dt;
            if (time <= 0) { time = 0; paintTime(); finish(false); }
            else paintTime();
          }
          paintLink(dt);
        }

        function finish(cleared) {
          running = false;
          clearSel();
          if (cleared) score += Math.round(time) * 20;   // 清盘了，剩下的时间折成分
          const was = readBest();
          const rec = score > was;
          if (rec) writeBest(score);
          lastEnd = { cleared, rec, was };
          // 结算盖上来之后，棋盘不该再留 Tab 落脚点 —— 底下那盘已经不能动了
          if (cells[cur] && cells[cur].el) cells[cur].el.tabIndex = -1;
          paintNums();
          paintOver();
          overEl.hidden = false;
          $("gAgain").focus();
          if (window.gtag) gtag("event", "play_match", { site: "portal", action: cleared ? "clear" : "timeout", score });
        }
        function paintOver() {
          const g = G();
          $("gOverT").textContent = lastEnd.cleared ? g.cleared : g.timeUp;
          $("gOverS").textContent = fmt(g.got, score) + (lastEnd.rec ? "" : " · " + fmt(g.was, Math.max(lastEnd.was || 0, score)));
          $("gRec").textContent = g.rec;
          $("gRec").hidden = !lastEnd.rec;
        }

        function paintText() {
          const g = G();
          $("gT").textContent = g.title;
          $("gSub").textContent = g.sub;
          tilesEl.setAttribute("aria-label", g.title);
          $("gClose").setAttribute("aria-label", g.close);
          $("gScoreL").textContent = g.score;
          $("gLeftL").textContent = g.left;
          $("gBestL").textContent = g.best;
          $("gHint").textContent = g.hint;
          $("gShuf").textContent = fmt(g.shuf, shuffles);
          $("gNew").textContent = g.newGame;
          $("gAgain").textContent = g.again;
          $("gQuit").textContent = g.quit;
          for (const c of cells) if (c.el) c.el.setAttribute("aria-label", L(KINDS[c.k].name));
          paintNums();
          if (combo >= 2) comboEl.textContent = fmt(g.combo, combo);
          if (!overEl.hidden) paintOver();
        }
        window.__gameLang = () => { if (!gameEl.hidden) paintText(); };

        /* ── 开局 / 收摊 ── */
        function newGame() {
          score = 0; combo = 0; comboAt = -1e9; shuffles = SHUFFLES;
          time = TMAX; flash = null;
          overEl.hidden = true;
          /* 连着清掉文字，不能只把 data-on 关掉：看不见的旧文案还留在 DOM 里，
             读屏软件照样念得出来，切完语言更会念出上一局的中文。 */
          comboEl.dataset.on = "0"; comboEl.textContent = "";
          hitEl.dataset.on = "0"; hitEl.textContent = "";
          $("gShuf").disabled = false;
          build();
          /* 文案要在量棋盘之前落定：说明那一行中英文长度不同，会换行、会把上面
             撑高，棋盘剩多少高度得等它排完才算得准。先量后写的话，560 高的屏上
             格子会按「标题还没填」的空间算大一号，然后被挤出可视区。 */
          paintText();
          sizeBoard();
          paintNums(); paintTime();
          running = true;
          prev = performance.now();
          if (!raf) raf = requestAnimationFrame(tick);
        }

        function open() {
          gameEl.hidden = false;
          document.body.dataset.game = "1";
          document.body.style.overflow = "hidden";
          if (window.__bg) window.__bg(false);   // 面板挡着，背景没必要接着画
          newGame();
          $("gClose").focus();
          if (window.gtag) gtag("event", "play_match", { site: "portal", action: "open" });
        }
        function close() {
          running = false;
          cancelAnimationFrame(raf); raf = 0;
          gameEl.hidden = true;
          document.body.dataset.game = "0";
          document.body.style.overflow = "";
          if (window.__bg && !document.hidden) window.__bg(true);
          playBtn.focus();
        }

        playBtn.addEventListener("click", open);
        $("gClose").addEventListener("click", close);
        $("gQuit").addEventListener("click", close);
        $("gAgain").addEventListener("click", newGame);
        $("gNew").addEventListener("click", newGame);
        $("gHint").addEventListener("click", hint);
        $("gShuf").addEventListener("click", reshuffle);

        tilesEl.addEventListener("click", (e) => {
          const b = e.target.closest(".tile");
          if (b) pick(+b.dataset.i);
        });

        /* 键盘也能玩：方向键在活着的格子之间走，回车 / 空格选中。
           48 个格子全设成可 Tab 的话，一路 Tab 到页脚要按 50 下 ——
           所以只留当前那个是 tabIndex 0，其余 -1（roving tabindex）。 */
        tilesEl.addEventListener("keydown", (e) => {
          const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
          if (!mv) return;
          e.preventDefault();
          let x = cur % C, y = (cur / C) | 0;
          for (let s = 0; s < Math.max(C, R); s++) {
            x = (x + mv[0] + C) % C; y = (y + mv[1] + R) % R;
            const i = y * C + x;
            if (!cells[i].gone) { setCur(i); return; }
          }
        });

        addEventListener("keydown", (e) => {
          if (gameEl.hidden || e.key !== "Escape") return;
          e.preventDefault();
          close();
        });

        /* 说了是 aria-modal，Tab 就不该跑到后面那些被暗底挡住、点也点不到的
           按钮上去 —— 用鼠标的人看到的是「只剩这个面板」，用键盘的人也应该。 */
        gameEl.addEventListener("keydown", (e) => {
          if (e.key !== "Tab") return;
          const f = [...gameEl.querySelectorAll("button:not([disabled])")]
            .filter((n) => n.tabIndex >= 0 && n.offsetParent !== null);
          if (!f.length) return;
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        });
        // 点面板外面的暗底也算关掉 —— 弹层的老规矩
        gameEl.addEventListener("click", (e) => { if (e.target === gameEl) close(); });

        addEventListener("resize", () => { if (!gameEl.hidden) sizeBoard(); });
        /* 盯着棋盘容器的实际尺寸走。文案长度随语言变、字体加载完会重排、
           手机转屏地址栏收起也会变 —— 与其在每个改动点后面补一次 sizeBoard()
           （漏一个就是一次溢出），不如让尺寸变化自己来通知。 */
        if (window.ResizeObserver) new ResizeObserver(() => { if (!gameEl.hidden) sizeBoard(); }).observe(boardEl);
        document.addEventListener("visibilitychange", () => {
          if (gameEl.hidden) return;
          // 切走的时候别偷偷扣时间：回来时把计时基准挪到当下
          if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
          else if (!raf) { prev = performance.now(); raf = requestAnimationFrame(tick); }
        });
      })();

      /* ── 启动 ── */
      let lang0 = "zh";
      try {
        const saved = localStorage.getItem(LANG_KEY);
        lang0 = saved === "zh" || saved === "en" ? saved : /^zh\b/i.test(navigator.language || "") ? "zh" : "en";
      } catch (e) {}
      setLang(lang0, false);

      if (document.fonts) document.fonts.ready.then(paintMail).catch(() => {});
      new MutationObserver(paintMail).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintMail);
      addEventListener("resize", paintMail);
    </script>
  </body>
</html>
