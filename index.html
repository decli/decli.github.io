         分站靠 site 参数和 page_path 前缀在报表里切开。 -->

    <script>

      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      // 浏览器明说了不要被追踪就不发。子站的做法一致，见 ftms 的 lib/analytics.ts
      var dnt = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
      if (dnt !== "1" && dnt !== "yes") {
        gtag("config", "G-Y7H2JMNX74", {
          anonymize_ip: true,

    <style>
      /* ─────────────────────────────────────────────────────────────
         一个入口页，收纳若干子站。

         ── 加一个站要改哪里 ──
         只改文件底部那个 SITES 数组，一条六行。样式、搜索、键盘、埋点
         全都是跟着数据走的 —— 加站不该顺带改一次布局。

         ── 为什么用「风场 + 光晕跟随」──
         这两样是 /ftms/ 里已经在用的视觉语言。入口页跟子站长得像，
         点进去才不会有「换了一个网站」的断裂感；而且这两个效果都是纯 CSS，
         没有任何依赖，一张图片都不下载。
         ───────────────────────────────────────────────────────────── */

      :root {
        --bg: #f4f6fb;
        --bg-2: #e9edf7;
        --card: rgba(255, 255, 255, 0.72);
        --card-solid: #fff;
        --line: rgba(20, 34, 72, 0.1);
        --line-strong: rgba(20, 34, 72, 0.18);
        --text: #131c30;
        --text-2: #4a566d;
        --text-3: #7a86a0;
        --brand-1: #3b5bd6;
        --brand-2: #6f8dff;
        --glow: rgba(59, 91, 214, 0.14);
        --shadow: 0 18px 40px -24px rgba(19, 28, 48, 0.4);
        --wind: rgba(59, 91, 214, 0.24);
      }
      :root[data-theme="dark"],
      :root:not([data-theme="light"]) {
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #070d1c;
          --bg-2: #0d1730;
          --card: rgba(21, 31, 54, 0.6);
          --card-solid: #151f36;
          --line: rgba(150, 178, 240, 0.14);
          --line-strong: rgba(150, 178, 240, 0.28);
          --text: #e9eefc;
          --text-2: #a9b6d4;
          --text-3: #7d8bab;
          --brand-1: #6f8dff;
          --brand-2: #9db4ff;
          --glow: rgba(120, 152, 255, 0.2);
          --shadow: 0 22px 50px -26px rgba(0, 0, 0, 0.8);
          --wind: rgba(143, 169, 255, 0.34);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #070d1c;
        --bg-2: #0d1730;
        --card: rgba(21, 31, 54, 0.6);
        --card-solid: #151f36;
        --line: rgba(150, 178, 240, 0.14);
        --line-strong: rgba(150, 178, 240, 0.28);
        --text: #e9eefc;
        --text-2: #a9b6d4;
        --text-3: #7d8bab;
        --brand-1: #6f8dff;
        --brand-2: #9db4ff;
        --glow: rgba(120, 152, 255, 0.2);
        --shadow: 0 22px 50px -26px rgba(0, 0, 0, 0.8);
        --wind: rgba(143, 169, 255, 0.34);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        background:
          radial-gradient(120% 90% at 85% 0%, var(--bg-2) 0%, transparent 60%),
          radial-gradient(90% 70% at 5% 100%, var(--bg-2) 0%, transparent 55%),
          var(--bg);
        color: var(--text);
        font: 15px/1.7 "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Source Han Sans SC",
          "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }

      /* ── 风场 ──
         几条常年不改向的流线，慢慢往右飘。位移很小、周期很长：
         入口页要的是「有呼吸」，不是「在动」—— 动得看得出来就抢注意力了。 */
      .wind {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.85;
      }
      .wind path {
        fill: none;
        stroke: var(--wind);
        stroke-linecap: round;
        stroke-dasharray: 220 1400;
        animation: drift 26s linear infinite;
      }
      .wind path:nth-child(2) { animation-duration: 34s; animation-delay: -6s; }
      .wind path:nth-child(3) { animation-duration: 29s; animation-delay: -14s; }
      .wind path:nth-child(4) { animation-duration: 38s; animation-delay: -3s; }
      .wind path:nth-child(5) { animation-duration: 31s; animation-delay: -19s; }
      .wind path:nth-child(6) { animation-duration: 42s; animation-delay: -11s; }
      @keyframes drift {
        to { stroke-dashoffset: -1620; }
      }

      .page {
        position: relative;
        z-index: 1;
        width: min(980px, 100%);
        margin: 0 auto;
        padding: clamp(48px, 9vh, 92px) clamp(18px, 4vw, 28px) 56px;
      }

      /* ── 页眉 ── */
      header.top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: clamp(44px, 8vh, 78px);
      }
      .me {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        display: grid;
        place-content: center;
        background: linear-gradient(140deg, var(--brand-1), var(--brand-2));
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.04em;
        flex: none;
      }
      .spacer { flex: 1; }
      .ghost {
        display: inline-grid;
        place-content: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--text-2);
        cursor: pointer;
        transition: border-color 0.16s, color 0.16s, transform 0.16s;
        text-decoration: none;
      }
      .ghost:hover { border-color: var(--line-strong); color: var(--text); transform: translateY(-1px); }
      .ghost:focus-visible { outline: 2px solid var(--brand-1); outline-offset: 2px; }

      /* ── 主标题 ── */
      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 6vw, 52px);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      h1 .g {
        background: linear-gradient(96deg, var(--brand-1), var(--brand-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .lede {
        margin: 0 0 34px;
        max-width: 46ch;
        color: var(--text-2);
        font-size: clamp(15px, 2vw, 17px);
      }

      /* ── 搜索 ── */
      .find {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 20px;
        padding: 0 14px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        backdrop-filter: blur(10px);
        transition: border-color 0.16s;
      }
      .find:focus-within { border-color: var(--brand-1); }
      .find svg { flex: none; color: var(--text-3); }
      .find input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        outline: none;
      }
      .find input::placeholder { color: var(--text-3); }
      .find kbd {
        flex: none;
        padding: 2px 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text-3);
        font: 600 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* ── 卡片 ── */
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      .site {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 18px 18px 17px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        backdrop-filter: blur(10px);
        color: inherit;
        text-decoration: none;
        overflow: hidden;
        transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
        animation: rise 0.44s cubic-bezier(0.22, 0.8, 0.3, 1) backwards;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(9px); }
      }
      /* 光晕跟着指针走 —— 跟 /ftms/ 看板上的卡片是同一个手法。
         位置由 JS 写进 --mx / --my 两个变量，CSS 只负责画。 */
      .site::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 0%), var(--glow), transparent 70%);
        opacity: 0;
        transition: opacity 0.22s;
        pointer-events: none;
      }
      .site:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
      .site:hover::before { opacity: 1; }
      .site:focus-visible { outline: 2px solid var(--brand-1); outline-offset: 3px; }
      .site[hidden] { display: none; }

      .mark {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        flex: none;
        display: grid;
        place-content: center;
        background: var(--card-solid);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .mark img { width: 42px; height: 42px; display: block; }
      .mark span { font-size: 19px; }

      .body { min-width: 0; flex: 1; }
      .name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      .badge {
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        color: var(--text-3);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .badge[data-tone="live"] {
        border-color: rgba(22, 163, 74, 0.4);
        color: #16a34a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .badge[data-tone="live"] { color: #4ade80; }
      }
      :root[data-theme="dark"] .badge[data-tone="live"] { color: #4ade80; }

      .desc {
        margin: 5px 0 10px;
        color: var(--text-2);
        font-size: 13.5px;
        line-height: 1.62;
      }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag {
        padding: 2px 8px;
        border-radius: 7px;
        background: color-mix(in srgb, var(--brand-1) 9%, transparent);
        color: var(--text-2);
        font-size: 11.5px;
        letter-spacing: 0.02em;
      }
      .go {
        align-self: center;
        flex: none;
        color: var(--text-3);
        transition: transform 0.18s, color 0.18s;
      }
      .site:hover .go { transform: translateX(3px); color: var(--brand-1); }

      .none {
        padding: 34px 0;
        text-align: center;
        color: var(--text-3);
        font-size: 14px;
      }
      .none[hidden] { display: none; }

      /* ── 页脚 ── */
      footer {
        margin-top: 48px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 12px;
        color: var(--text-3);
        font-size: 12.5px;
      }
      footer .owner {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      footer .mail {
        display: inline-flex;
        align-items: center;
        padding: 0 2px;
        border: 0;
        border-radius: 5px;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        transition: opacity 0.16s;
      }
      footer .mail:hover { opacity: 0.7; }
      footer .mail:focus-visible { outline: 2px solid var(--brand-1); outline-offset: 2px; }
      footer canvas { vertical-align: -0.22em; }
      .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: 0.5; }

      #copied {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 12px);
        padding: 9px 16px;
        border-radius: 10px;
        background: var(--card-solid);
        border: 1px solid var(--line-strong);
        box-shadow: var(--shadow);
        color: var(--text);
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
      }
      #copied[data-on="1"] { opacity: 1; transform: translate(-50%, 0); }

      /* 有人明确要求少动效，就一动不动 —— 风场是装饰，不该跟这条要求较劲 */
      @media (prefers-reduced-motion: reduce) {
        .wind path { animation: none; stroke-dasharray: none; }
        .site { animation: none; }
        .site, .site .go, .ghost { transition: none; }
        .site:hover { transform: none; }
      }
    </style>
  </head>

  <body>
    <svg class="wind" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-60 130 C 320 76, 700 178, 1500 96" stroke-width="1.5" />
      <path d="M-60 268 C 380 200, 760 300, 1500 220" stroke-width="1" />
      <path d="M-60 410 C 300 340, 820 452, 1500 356" stroke-width="1.8" />
      <path d="M-60 556 C 420 486, 780 604, 1500 500" stroke-width="1.1" />
      <path d="M-60 690 C 340 626, 860 742, 1500 648" stroke-width="1.5" />
      <path d="M-60 820 C 400 760, 760 862, 1500 786" stroke-width="0.9" />
    </svg>

    <div class="page">
      <header class="top">
        <span class="me">
          <span class="avatar">d</span>
          decli
        </span>
        <span class="spacer"></span>
        <a class="ghost" href="https://github.com/decli" rel="me noopener" aria-label="GitHub" title="GitHub">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />

        <button class="ghost" id="theme" aria-label="切换明暗" title="切换明暗">

            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />

      </header>

      <h1>做了几个<span class="g">能用的东西</span></h1>
      <p class="lede">都是纯前端，免注册，打开就能试。数据留在你自己的浏览器里，不上传。</p>

      <label class="find">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input id="q" type="search" placeholder="搜项目名、用途、关键词…" aria-label="搜索项目" autocomplete="off" />
        <kbd>/</kbd>
      </label>

      <div class="grid" id="grid"></div>
      <p class="none" id="none" hidden>没有匹配的项目。</p>

      <footer>
        <!-- 「©」和邮箱之间不留 dot：它们是同一句话的两半（© 谁），
             拆开会读成两条并列信息。分隔点只用在「版权」与「托管方」之间。 -->
        <span class="owner">
          ©
          <button class="mail" id="mail" aria-label="复制邮箱" title="点击复制邮箱">
            <canvas id="mailc" aria-hidden="true"></canvas>
          </button>
          版权所有 2026
        </span>
        <span class="dot" aria-hidden="true"></span>
        <span>Powered by GitHub Pages</span>
      </footer>

    <div id="copied" role="status" aria-live="polite">邮箱已复制到剪贴板</div>

    <script src="sites.js"></script>
    <script>
      /* 项目清单在 sites.js 里 —— 加一个项目只改那一个文件。
         用普通 <script src> 同步加载，不是 fetch：没有异步、没有时序问题，
         唯一的失败模式是文件 404，下面兜住了。 */
      const SITES = Array.isArray(window.SITES) ? window.SITES : [];

      const ICON = {
        arrow:
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
      };

      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      const grid = document.getElementById("grid");
      if (!SITES.length) {
        // sites.js 没加载上（改坏了、或部署漏了这个文件）。白板最难查，
        // 所以直接把原因写在页面上
        grid.innerHTML =
          '<p class="none" style="grid-column:1/-1">项目清单没加载出来 —— 检查 sites.js 是否存在且语法正确。</p>';
      }
      grid.innerHTML = SITES.length ? SITES.map((s, i) => {
        const mark = s.icon.startsWith("/")
          ? `<img src="${esc(s.icon)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🔗'}))">`
          : `<span>${esc(s.icon)}</span>`;
        const tag = s.live ? "a" : "div";
        const attrs = s.live ? `href="${esc(s.href)}" data-slug="${esc(s.slug)}"` : 'aria-disabled="true"';
        return `<${tag} class="site" ${attrs} style="animation-delay:${i * 55}ms"
            data-find="${esc((s.name + " " + s.slug + " " + s.desc + " " + s.tags.join(" ")).toLowerCase())}">
            <span class="mark">${mark}</span>
            <span class="body">
              <span class="name">${esc(s.name)}${s.live ? "" : '<span class="badge">筹备中</span>'}</span>
              <span class="desc">${esc(s.desc)}</span>
              <span class="tags">${s.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</span>
            </span>
            <span class="go">${ICON.arrow}</span>
          </${tag}>`;
      }).join("") : grid.innerHTML;

      /* 光晕跟随。一个委托监听覆盖所有卡片，加卡片不用再挂事件 */
      grid.addEventListener("pointermove", (e) => {
        const card = e.target.closest(".site");
        if (!card) return;
        const r = card.getBoundingClientRect();
        card.style.setProperty("--mx", `${e.clientX - r.left}px`);
        card.style.setProperty("--my", `${e.clientY - r.top}px`);
      });

      /* 点击去哪，记一笔。只报 slug —— 报表里要回答的是「哪个项目有人点」 */
      grid.addEventListener("click", (e) => {
        const a = e.target.closest("a.site");
        if (a && window.gtag) gtag("event", "open_site", { site: "portal", target: a.dataset.slug });
      });

      /* ── 搜索 ──
         三个项目时它是多余的，八个时它是必需的。现在就放上，
         省得以后加到第八个才想起来要改布局。 */
      const q = document.getElementById("q");
      const none = document.getElementById("none");
      const cards = [...grid.querySelectorAll(".site")];
      q.addEventListener("input", () => {
        const k = q.value.trim().toLowerCase();
        let n = 0;
        for (const c of cards) {
          const hit = !k || c.dataset.find.includes(k);
          c.hidden = !hit;
          if (hit) n++;
        }
        none.hidden = n > 0;
      });
      // `/` 聚焦搜索，Esc 清空 —— 跟 /ftms/ 里的快捷键习惯一致
      addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== q) {
          e.preventDefault();
          q.focus();
        } else if (e.key === "Escape" && document.activeElement === q) {
          q.value = "";
          q.dispatchEvent(new Event("input"));
          q.blur();
        }
      });

      /* ── 明暗 ──
         三档轮换太重了，入口页只需要「跟系统」和「反过来」两种。
         选择记在 localStorage，跟子站各自的记忆互不干扰。 */
      const THEME_KEY = "decli.theme";
      const root = document.documentElement;
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === "dark" || saved === "light") root.dataset.theme = saved;
      } catch (e) {}
      document.getElementById("theme").addEventListener("click", () => {
        const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const now = root.dataset.theme || (sysDark ? "dark" : "light");
        const next = now === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        if (window.gtag) gtag("event", "switch_theme", { site: "portal", to: next });
      });

      /* ── 版权邮箱 ──
         画在 canvas 上：DOM 里没有文本节点，源码里也没有可直接正则捞走的
         字面量。贴在公开网页上的邮箱，半天之内就会进入群发名录。
         跟 /ftms/ 里的 Copyright.tsx 是同一套做法。 */
      const L = [100, 101, 99, 108, 105];
      const H = [113, 113, 46, 99, 111, 109];
      const mail = () => String.fromCharCode.apply(null, L) + "@" + String.fromCharCode.apply(null, H);

      function paintMail() {
        const cv = document.getElementById("mailc");
        const probe = cv.getContext("2d");
        if (!probe) return;
        const cs = getComputedStyle(cv.parentElement);
        const size = 12.5;
        const font = `500 ${size}px ${cs.fontFamily}`;
        probe.font = font;
        const text = mail();
        const w = Math.ceil(probe.measureText(text).width) + 2;
        const h = Math.ceil(size * 1.4);
        const dpr = Math.min(devicePixelRatio || 1, 3);
        // 改 width/height 会清空画布，所以字体要在这之后再设一次
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        cv.style.width = w + "px";
        cv.style.height = h + "px";
        const ctx = cv.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.font = font;
        ctx.textBaseline = "middle";
        ctx.fillStyle = cs.color;
        ctx.fillText(text, 1, h / 2);
      }
      paintMail();
      if (document.fonts) document.fonts.ready.then(paintMail).catch(() => {});
      new MutationObserver(paintMail).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintMail);
      addEventListener("resize", paintMail);

      const toast = document.getElementById("copied");
      document.getElementById("mail").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(mail());
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = mail();
          ta.style.cssText = "position:fixed;top:-100px;opacity:0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        toast.dataset.on = "1";
        setTimeout(() => (toast.dataset.on = "0"), 1800);
      });
    </script>
  </body>
</html>
