<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>decli</title>
    <meta name="description" content="decli 的项目站点。" />
    <meta name="author" content="decli" />
    <link rel="icon" href="/ftms/favicon.svg" type="image/svg+xml" />
    <style>
      /* 这一页是个占位首页 —— 换掉它不会影响 /ftms/ 下的任何东西。
         之所以不留空：根目录没有 index.html 时，decli.github.io 会显示
         GitHub 的默认 404，那比放个什么都糟。 */
      :root {
        --bg: #f7f8fb;
        --card: #fff;
        --line: #e4e8f0;
        --text: #1a2233;
        --dim: #6b7688;
        --accent: #3b5bd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --card: #131b2c;
          --line: #26314a;
          --text: #e8eefb;
          --dim: #8b98ae;
          --accent: #7f9bff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 26px;
        padding: 40px 20px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.7 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      }
      main { width: min(560px, 100%); }
      h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 0.01em; }
      .sub { margin: 0 0 26px; color: var(--dim); font-size: 14px; }
      a.card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        transition: border-color 0.16s, transform 0.16s;
      }
      a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
      a.card img { width: 38px; height: 38px; border-radius: 10px; flex: none; }
      .t b { display: block; font-size: 15px; }
      .t span { display: block; color: var(--dim); font-size: 13px; }
      .arrow { margin-left: auto; color: var(--dim); }
      footer { margin-top: 30px; color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; }
      footer canvas { vertical-align: -0.22em; }
    </style>
  </head>
  <body>
    <main>
      <h1>decli</h1>
      <p class="sub">这里放着几个自己写的东西。</p>

      <a class="card" href="/ftms/">
        <img src="/ftms/favicon.svg" alt="" />
        <span class="t">
          <b>信风 Tradewind</b>
          <span>外贸业务全流程管理系统 · 在线演示</span>
        </span>
        <span class="arrow">→</span>
      </a>

      <footer>
        <span>© 2026 decli · 版权所有</span>
        <canvas id="m" aria-hidden="true"></canvas>
      </footer>
    </main>

    <script>
      /* 邮箱画在 canvas 上，理由同应用内：DOM 里没有文本节点、源码里没有
         可直接正则捞走的字面量。跟 /ftms/ 里那份是同一套做法。 */
      (function () {
        var L = [100, 101, 99, 108, 105],
          H = [113, 113, 46, 99, 111, 109];
        var mail = String.fromCharCode.apply(null, L) + "@" + String.fromCharCode.apply(null, H);
        var cv = document.getElementById("m");
        var probe = cv.getContext("2d");
        var cs = getComputedStyle(cv.parentElement);
        var font = "500 12px " + cs.fontFamily;
        probe.font = font;
        var w = Math.ceil(probe.measureText(mail).width) + 2,
          h = 17;
        var dpr = Math.min(window.devicePixelRatio || 1, 3);
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        cv.style.width = w + "px";
        cv.style.height = h + "px";
        var ctx = cv.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.font = font;
        ctx.textBaseline = "middle";
        ctx.fillStyle = cs.color;
        ctx.fillText(mail, 1, h / 2);
      })();
    </script>
  </body>
</html>
