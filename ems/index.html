<!-- Google tag (gtag.js) —— decli.github.io 下几个站共用同一个 property，
     这样「从门户点进来、退出去又开了别的站」是一次会话、一条路径。
     分站在报表里靠 site 参数和 page_path 前缀切开。 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Y7H2JMNX74"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // 浏览器明说了不要被追踪就不发
  var dnt = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
  if (dnt !== '1' && dnt !== 'yes') {
    gtag('config', 'G-Y7H2JMNX74', {
      anonymize_ip: true,
      allow_google_signals: false,
      allow_ad_personalization_signals: false,
      site: 'ems'
    });
  }
</script>
