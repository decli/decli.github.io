<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex,nofollow" />
    <title>方案 B · 索引页 — 首页交互草案</title>
    <style>
      /* ═══════════════════════════════════════════════════════════════
         方案 B 「索引页」 —— 内容即界面
         ─────────────────────────────────────────────────────────────
         范式：paco.me / rauno 一系的编辑部式极简 + brittanychiang 的
         「行式列表 + 悬停压暗其余行」。没有卡片、没有按钮堆砌，
         一页排得讲究的目录。装饰预算只花在三处：
           ① 正文里的数字就是筛选器（点「5 个浏览器扩展」= 筛选）
           ② 右侧一格固定预览窗，随悬停/聚焦切换内容
           ③ 主题切换用 View Transitions 做圆形扩散（antfu 式）
         ═══════════════════════════════════════════════════════════════ */
      :root {
        --bg: #fbfbf9;
        --text: #16181d;
        --text-2: #5a6172;
        --text-3: #9199a8;
        --line: rgba(22, 24, 29, 0.1);
        --line-2: rgba(22, 24, 29, 0.22);
        --brand: #2f54d1;
        --live: #0f9d58;
        --hl: rgba(47, 84, 209, 0.08);
        --card: #fff;
        --shadow: 0 1px 2px rgba(22, 24, 29, 0.04), 0 16px 40px -24px rgba(22, 24, 29, 0.18);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0d12;
          --text: #e9ecf2;
          --text-2: #9aa3b5;
          --text-3: #666f81;
          --line: rgba(233, 236, 242, 0.1);
          --line-2: rgba(233, 236, 242, 0.24);
          --brand: #8ea4ff;
          --live: #34d399;
          --hl: rgba(142, 164, 255, 0.1);
          --card: #12151d;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 20px 48px -26px rgba(0, 0, 0, 0.7);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0d12;
        --text: #e9ecf2;
        --text-2: #9aa3b5;
        --text-3: #666f81;
        --line: rgba(233, 236, 242, 0.1);
        --line-2: rgba(233, 236, 242, 0.24);
        --brand: #8ea4ff;
        --live: #34d399;
        --hl: rgba(142, 164, 255, 0.1);
        --card: #12151d;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 20px 48px -26px rgba(0, 0, 0, 0.7);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.8 "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei",
          system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      ::selection { background: color-mix(in srgb, var(--brand) 22%, transparent); }

      .page {
        display: grid;
        grid-template-columns: minmax(0, 620px) 300px;
        gap: 76px;
        width: min(1052px, 100%);
        margin: 0 auto;
        padding: clamp(30px, 7vh, 76px) clamp(20px, 4vw, 28px) 72px;
      }
      main { min-width: 0; }

      /* ── 页首：纯文字，无任何盒子 ── */
      .top { display: flex; align-items: baseline; gap: 18px; margin-bottom: clamp(40px, 8vh, 72px); font-size: 14px; }
      .top .name { font-weight: 700; letter-spacing: 0.02em; }
      .top .spacer { flex: 1; }
      .top a, .top button {
        border: 0; background: none; padding: 0;
        color: var(--text-3); font: inherit; cursor: pointer; text-decoration: none;
        transition: color 0.14s;
      }
      .top a:hover, .top button:hover { color: var(--text); }
      .top a:focus-visible, .top button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 2px; }

      /* ── 引子：衬线大字 + 会互动的正文 ── */
      .motto {
        margin: 0 0 18px;
        font-family: "Songti SC", "Noto Serif SC", "Noto Serif CJK SC", STSong, SimSun, Georgia, serif;
        font-size: clamp(30px, 5vw, 44px);
        font-weight: 700;
        line-height: 1.32;
        letter-spacing: 0.01em;
      }
      .intro { margin: 0 0 8px; max-width: 58ch; color: var(--text-2); font-size: 15.5px; }
      /* 正文数字即筛选器：点「5 个浏览器扩展」，下面的列表就只亮这 5 个 */
      .f {
        border: 0; background: none; padding: 0 1px;
        color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
        text-decoration: underline dotted var(--line-2);
        text-underline-offset: 4px;
        border-radius: 3px;
        transition: color 0.14s, background-color 0.14s;
      }
      .f:hover { color: var(--brand); }
      .f:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      .f[aria-pressed="true"] { color: var(--brand); background: var(--hl); text-decoration-color: var(--brand); }
      .hint { margin: 0; color: var(--text-3); font-size: 12.5px; }
      .hint button { border: 0; background: none; padding: 0; color: inherit; font: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
      .hint[hidden] { visibility: hidden; }

      /* ── 索引列表 ── */
      .index { margin-top: clamp(30px, 6vh, 52px); border-top: 1px solid var(--line); }
      .row {
        display: flex; align-items: baseline;
        border-bottom: 1px solid var(--line);
        transition: opacity 0.18s;
        animation: enter 0.5s cubic-bezier(0.22, 0.8, 0.3, 1) backwards;
      }
      .lnk {
        flex: 1; min-width: 0;
        display: flex; align-items: baseline; gap: 14px;
        padding: 15px 2px;
        color: inherit; text-decoration: none;
      }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
      .row .no {
        flex: none; width: 2ch;
        color: var(--text-3); font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        transition: color 0.14s;
      }
      .row .nm { flex: none; font-size: 16px; font-weight: 620; letter-spacing: -0.005em; transition: color 0.14s; }
      .row .li { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--live); align-self: center; }
      .row .ds {
        flex: 1; min-width: 0;
        color: var(--text-3); font-size: 13px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .row .ct { flex: none; color: var(--text-3); font-size: 12px; }
      .row .ar { flex: none; color: var(--text-3); font-size: 13px; transition: transform 0.16s, color 0.14s; }

      /* brittanychiang 手法：悬停一行，其余行整体退后 */
      .index:hover .row:not(:hover) { opacity: 0.38; }
      .row:hover .nm, .lnk:focus-visible .nm { color: var(--brand); }
      .row:hover .no { color: var(--brand); }
      .row:hover .ar { transform: translate(2px, -2px); color: var(--brand); }
      .lnk:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; border-radius: 6px; }
      /* 筛选态：不在选中分类里的行压暗——压暗不移除，页面不跳动 */
      .index[data-filtered] .row:not([data-on]) { opacity: 0.16; pointer-events: none; }

      /* 移动端行内展开（桌面上按钮和详情块都不出现） */
      .exp { display: none; }
      .det { display: none; }

      /* ── 右侧预览窗：sticky 一格，随悬停换内容 ── */
      aside { min-width: 0; }
      .peek {
        position: sticky; top: clamp(30px, 12vh, 110px);
        border: 1px solid var(--line); border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow);
        padding: 22px;
        display: flex; flex-direction: column; gap: 13px;
      }
      .peek .inner { display: flex; flex-direction: column; gap: 13px; animation: fade 0.16s ease-out; }
      @keyframes fade { from { opacity: 0; } }
      .mark {
        width: 46px; height: 46px; border-radius: 12px; flex: none;
        display: grid; place-content: center; overflow: hidden; color: #fff;
      }
      .mark img { width: 46px; height: 46px; display: block; }
      .peek h2 { margin: 0; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; font-size: 17px; font-weight: 700; }
      .badge {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 0 8px; border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--live) 42%, transparent);
        color: var(--live); font-size: 10.5px; font-weight: 650; line-height: 1.7;
      }
      .badge::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
      .peek .ds { margin: 0; color: var(--text-2); font-size: 13px; line-height: 1.75; }
      .peek .tg { display: flex; flex-wrap: wrap; gap: 5px; }
      .tg span { padding: 1px 8px; border-radius: 6px; background: var(--hl); color: var(--text-2); font-size: 11px; }
      .peek .go { display: flex; gap: 12px; padding-top: 2px; font-size: 13px; }
      .peek .go a { color: var(--brand); text-decoration: none; font-weight: 600; }
      .peek .go a:hover { text-decoration: underline; text-underline-offset: 3px; }
      .peek .kb { color: var(--text-3); font-size: 11.5px; border-top: 1px solid var(--line); padding-top: 11px; margin-top: 2px; }

      footer { margin-top: 60px; color: var(--text-3); font-size: 12.5px; }

      .sketchtag {
        position: fixed; right: 14px; bottom: 14px; z-index: 5;
        padding: 4px 11px; border-radius: 999px;
        border: 1px solid var(--line-2); background: var(--card);
        color: var(--text-3); font-size: 11px; font-weight: 650; letter-spacing: 0.06em;
      }

      /* ── 主题切换的圆形扩散（View Transitions，antfu 式）── */
      ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
      ::view-transition-new(root) { z-index: 1; }
      ::view-transition-old(root) { z-index: 9999; }
      :root[data-theme="dark"]::view-transition-new(root) { z-index: 9999; }
      :root[data-theme="dark"]::view-transition-old(root) { z-index: 1; }

      @media (max-width: 1000px) {
        .page { grid-template-columns: 1fr; gap: 0; }
        aside { display: none; }
        .lnk { flex-wrap: wrap; row-gap: 2px; }
        .lnk .ds { flex-basis: 100%; order: 9; white-space: normal; padding-left: calc(2ch + 14px); }
        .index:hover .row:not(:hover) { opacity: 1; }
        /* 触屏：整行仍是链接，行尾多一个展开钮看详情 */
        .exp {
          display: inline-flex; align-items: center; justify-content: center;
          width: 36px; height: 36px; margin-right: -6px; align-self: center;
          border: 0; background: none; color: var(--text-3); font-size: 16px; cursor: pointer;
          border-radius: 8px; transition: transform 0.18s;
        }
        .exp[aria-expanded="true"] { transform: rotate(45deg); }
        .det { display: none; padding: 2px 2px 14px calc(2ch + 14px); border-bottom: 1px solid var(--line); }
        .det[data-open] { display: block; animation: enter 0.25s ease-out; }
        .det p { margin: 0 0 8px; color: var(--text-2); font-size: 13px; }
        .det .go a { color: var(--brand); font-weight: 600; text-decoration: none; margin-right: 14px; font-size: 13px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .row, .peek .inner, .det[data-open] { animation: none; }
        .row, .f, .exp, .top a, .top button { transition: none; }
        .row:hover .ar { transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <header class="top">
          <span class="name">decli</span>
          <span class="spacer"></span>
          <a href="https://github.com/decli" target="_blank" rel="noopener noreferrer">GitHub</a>
          <button id="theme" aria-label="切换明暗">明暗</button>
        </header>

        <h1 class="motto">嫌它麻烦，<br />就自己写一个。</h1>

        <p class="intro">
          这里是十二个这样的东西：<button class="f" data-f="web" aria-pressed="false">3 个在线应用</button>、<button class="f" data-f="ext" aria-pressed="false">5 个浏览器扩展</button>、<button class="f" data-f="script" aria-pressed="false">2 个用户脚本</button>和<button class="f" data-f="app" aria-pressed="false">2 个移动应用</button>。有的替自己省事，有的给家里人做的。纯前端或本地运行，免注册，打开就能用。
        </p>
        <p class="hint" id="hint" hidden>正在只看这一类 —— <button id="clear">看全部</button></p>

        <nav class="index" id="index" aria-label="项目索引"></nav>

        <footer>© decli · 版权所有 2026 · Powered by GitHub Pages</footer>
      </main>

      <aside aria-hidden="true">
        <div class="peek" id="peek"></div>
      </aside>
    </div>

    <span class="sketchtag">草案 B · 索引页</span>

    <script>
      const CATS = { web: "在线应用", ext: "浏览器扩展", script: "用户脚本", app: "移动应用" };
      const P = [
        { slug: "ftms", cat: "web", name: "信风 Tradewind", desc: "外贸业务全流程管理系统。询盘、报价、PI、采购生产、出运跟单、收汇、退税，一个 PI 号串到底。", tags: ["外贸管理", "跟单", "出口退税", "33 个模块"], icon: "/ftms/favicon.svg", glyph: "wind", tint: ["#3b5bd6", "#06b6d4"], href: "/ftms/", repo: "ftms" },
        { slug: "ems", cat: "web", name: "EMS 外贸营销系统", desc: "AI Agent 驱动的外贸全链路增长系统 —— 从「找到买家」到「收到货款」跑在同一套数据上。", tags: ["获客", "AI Agent", "外贸营销"], icon: "/ems/favicon.svg", glyph: "spark", tint: ["#7c5cff", "#d946ef"], href: "/ems/", repo: "ems" },
        { slug: "wxformat3", cat: "web", name: "WxMark", desc: "微信公众号 Markdown 排版工具。左边写、右边预览，一键复制成带内联样式的 HTML 直接粘进后台。", tags: ["公众号", "Markdown", "排版", "6 套主题"], icon: "/wxformat3/favicon.svg", glyph: "format", tint: ["#07c160", "#059669"], href: "/wxformat3/", repo: "wxformat3" },
        { slug: "ip-geo", cat: "ext", name: "IP 归属地监控", desc: "工具栏徽标直接显示出口国家代码，IPv4 / IPv6 与归属地一眼可见 —— 代理有没有真的生效，不用再开个测试网站去看。", tags: ["Chrome 扩展", "IP", "代理排查"], glyph: "globe", tint: ["#0ea5e9", "#2563eb"], repo: "IP_Geolocation_Extension_Chrome" },
        { slug: "jobornot", cat: "ext", name: "职得投 JobOrNot", desc: "浏览 BOSS 直聘 / 猎聘时，把简历和岗位 JD 摆在一起比，诚实回答「值不值得投、怎么投得更好」。", tags: ["求职", "AI 匹配", "扩展"], glyph: "target", tint: ["#f59e0b", "#ef4444"], repo: "JobOrNot" },
        { slug: "wx-export", cat: "ext", name: "公众号数据导出", desc: "在已登录的公众号后台本地导出近期发表的文章与阅读、点赞、分享数据，拿来做内容复盘和选题分析。", tags: ["公众号", "数据导出", "扩展 + 脚本"], glyph: "chat", tint: ["#10b981", "#059669"], repo: "weixin_public_export" },
        { slug: "tabinfocopy", cat: "ext", name: "TabInfoCopy", desc: "一键复制当前标签页的标题和网址，省掉「点地址栏、全选、复制、再回去抄标题」这四步。", tags: ["Chrome 扩展", "效率"], glyph: "tab", tint: ["#8b5cf6", "#6366f1"], repo: "TabInfoCopy" },
        { slug: "ip-display", cat: "ext", name: "IP Display", desc: "显示当前 IP 与国内外归属地。IP 归属地监控的前身，留着做个记录。", tags: ["Chrome 扩展", "IP", "早期版本"], glyph: "globe", tint: ["#64748b", "#475569"], repo: "IPDisplayExtension" },
        { slug: "pagescroll", cat: "script", name: "PageScroll", desc: "任意网页上一个可拖动的悬浮胶囊，一点回顶或到底。用 Shadow DOM 隔离样式，SPA 重渲染后它会自己回来。", tags: ["油猴脚本", "效率", "Shadow DOM"], glyph: "scroll", tint: ["#06b6d4", "#0891b2"], repo: "pagescroll" },
        { slug: "bing-wallpaper", cat: "script", name: "Bing 壁纸批量下载", desc: "在壁纸列表页勾选多张，一次把 4K / UHD 原图批量下到指定目录，不用一张张点进去另存为。", tags: ["油猴脚本", "壁纸", "批量下载"], glyph: "download", tint: ["#ec4899", "#db2777"], repo: "BingWDByte4KBatchDownloader" },
        { slug: "codehelper", cat: "app", name: "取件码助手", desc: "给家里老人做的 Android 应用。自动从短信里挑出还没取的取件码，用取件小票的样子大字号摆出来，到驿站直接给人看。", tags: ["Android", "适老化", "短信解析"], glyph: "package", tint: ["#f97316", "#ea580c"], repo: "CodeHelper" },
        { slug: "chinesechess", cat: "app", name: "老爸下象棋", desc: "Android 平板上的中国象棋，按 14 寸横屏放大过布局，三档 AI，落子有音效和语音播报。", tags: ["Android", "象棋", "大屏"], glyph: "chess", tint: ["#a16207", "#854d0e"], repo: "chinesechess03" },
      ];
      const GLYPHS = {
        wind: '<path d="M9.6 4.6A2 2 0 1 1 11 8H3"/><path d="M12.6 19.4A2 2 0 1 0 14 16H3"/><path d="M17.7 7.7A2.5 2.5 0 1 1 19.5 12H3"/>',
        spark: '<path d="M3 17l6-6 4 4 7-8"/><path d="M14 7h6v6"/>',
        format: '<path d="M4 7V4h16v3"/><path d="M12 4v16"/><path d="M9 20h6"/>',
        globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>',
        target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
        chat: '<path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.5A8 8 0 0 1 13 4a8 8 0 0 1 8 8Z"/><path d="M9 11h.01M13 11h.01M17 11h.01"/>',
        tab: '<rect x="3" y="5" width="18" height="15" rx="2.5"/><path d="M3 9.5h7l1.6-2.4H21"/>',
        scroll: '<path d="M12 4v16"/><path d="m7 9 5-5 5 5"/><path d="m7 15 5 5 5-5"/>',
        download: '<path d="M12 3v12"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M4 20h16"/>',
        package: '<path d="m12 3 8 4.2v9.6L12 21l-8-4.2V7.2Z"/><path d="M4.3 7.3 12 11.4l7.7-4.1M12 11.4V21"/>',
        chess: '<path d="M9 4h6v2.6l2 2.4H7l2-2.4Z"/><path d="M8.4 9h7.2l-.9 6H9.3Z"/><path d="M6.5 20h11l-.8-2.6H7.3Z"/>',
      };
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const url = (p) => p.href || `https://github.com/decli/${p.repo}`;
      const mark = (p, size) =>
        `<span class="mark" style="background:linear-gradient(140deg,${p.tint[0]},${p.tint[1]})">` +
        (p.icon ? `<img src="${p.icon}" alt="" onerror="this.remove()" style="position:absolute">` : "") +
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPHS[p.glyph]}</svg></span>`;

      const idx = document.getElementById("index");
      const peek = document.getElementById("peek");
      const hint = document.getElementById("hint");
      let filter = null;

      idx.innerHTML = P.map((p, i) => `
        <div class="row" data-slug="${p.slug}" data-cat="${p.cat}" style="animation-delay:${i * 35}ms">
          <a class="lnk" href="${url(p)}" target="_blank" rel="noopener noreferrer">
            <span class="no">${String(i + 1).padStart(2, "0")}</span>
            <span class="nm">${esc(p.name)}</span>
            ${p.href ? '<span class="li" title="在线"></span>' : ""}
            <span class="ds">${esc(p.desc)}</span>
            <span class="ct">${CATS[p.cat]}</span>
            <span class="ar" aria-hidden="true">↗</span>
          </a>
          <button class="exp" aria-expanded="false" aria-controls="det-${p.slug}" aria-label="展开 ${esc(p.name)} 详情">＋</button>
        </div>
        <div class="det" id="det-${p.slug}">
          <p>${esc(p.desc)}</p>
          <div class="go">
            ${p.href ? `<a href="${p.href}" target="_blank" rel="noopener noreferrer">打开 ↗</a>` : ""}
            <a href="https://github.com/decli/${esc(p.repo)}" target="_blank" rel="noopener noreferrer">源码</a>
          </div>
        </div>`).join("");

      function renderPeek(p) {
        peek.innerHTML = `<div class="inner">
          ${mark(p, 24)}
          <h2>${esc(p.name)}${p.href ? '<span class="badge">在线</span>' : ""}</h2>
          <p class="ds">${esc(p.desc)}</p>
          <div class="tg">${p.tags.map((x) => `<span>${esc(x)}</span>`).join("")}</div>
          <div class="go">
            ${p.href ? `<a href="${p.href}" target="_blank" rel="noopener noreferrer">打开 ↗</a>` : ""}
            <a href="https://github.com/decli/${esc(p.repo)}" target="_blank" rel="noopener noreferrer">源码</a>
          </div>
          <div class="kb">悬停或用 Tab 走列表，这里跟着换</div>
        </div>`;
      }
      renderPeek(P[0]);

      let cur = "";
      function showFor(rowEl) {
        const slug = rowEl?.dataset?.slug;
        if (!slug || slug === cur) return;
        cur = slug;
        renderPeek(P.find((p) => p.slug === slug));
      }
      idx.addEventListener("pointerover", (e) => showFor(e.target.closest(".row")));
      idx.addEventListener("focusin", (e) => showFor(e.target.closest(".row")));

      /* 正文数字筛选：压暗不移除 */
      function applyFilter(f) {
        filter = filter === f ? null : f;
        document.querySelectorAll(".f").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
        if (filter) {
          idx.dataset.filtered = "";
          idx.querySelectorAll(".row").forEach((r) => r.dataset.cat === filter ? r.setAttribute("data-on", "") : r.removeAttribute("data-on"));
        } else {
          delete idx.dataset.filtered;
          idx.querySelectorAll(".row").forEach((r) => r.removeAttribute("data-on"));
        }
        hint.hidden = !filter;
      }
      document.querySelectorAll(".f").forEach((b) => b.addEventListener("click", () => applyFilter(b.dataset.f)));
      document.getElementById("clear").addEventListener("click", () => applyFilter(filter));

      /* 触屏行内展开 */
      idx.addEventListener("click", (e) => {
        const btn = e.target.closest(".exp");
        if (!btn) return;
        const row = btn.closest(".row");
        const det = document.getElementById("det-" + row.dataset.slug);
        const open = det.hasAttribute("data-open");
        document.querySelectorAll(".det[data-open]").forEach((d) => d.removeAttribute("data-open"));
        document.querySelectorAll(".exp[aria-expanded='true']").forEach((x) => x.setAttribute("aria-expanded", "false"));
        if (!open) { det.setAttribute("data-open", ""); btn.setAttribute("aria-expanded", "true"); }
      });

      /* 主题切换：View Transitions 圆形扩散，从点击处荡开（不支持就直接切） */
      const themeBtn = document.getElementById("theme");
      themeBtn.addEventListener("click", (e) => {
        const root = document.documentElement;
        const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const next = (root.dataset.theme || (sysDark ? "dark" : "light")) === "dark" ? "light" : "dark";
        const apply = () => { root.dataset.theme = next; };
        if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) return apply();
        const x = e.clientX || innerWidth - 40, y = e.clientY || 40;
        const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
        document.startViewTransition(apply).ready.then(() => {
          document.documentElement.animate(
            { clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
            { duration: 420, easing: "ease-in", pseudoElement: next === "dark" ? "::view-transition-new(root)" : "::view-transition-old(root)",
              direction: next === "dark" ? "normal" : "reverse" }
          );
        });
      });
    </script>
  </body>
</html>
