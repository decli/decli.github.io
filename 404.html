<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>页面不存在</title>
    <link rel="icon" href="/ftms/favicon.svg" type="image/svg+xml" />

    <!-- SPA 清单跟首页共用一份，见 sites.js 的 SPA_PREFIXES。
         同步加载：下面那段跳转要在页面画出来之前跑完，晚一步就会先闪一下 404。 -->
    <script src="/sites.js"></script>
    <script>
      /* ── 单页应用的深链接兜底 ──
         /ftms/ 这类子站是 SPA，刷新 /ftms/follow-ups 会走 404 流程。
         正常情况下 GitHub Pages 会回落到那个子目录自己的 404.html（构建时由
         index.html 拷来），路由读 pathname 就渲染对了，压根走不到这一页。

         但「Pages 会不会替子目录去找最近的那个 404.html」，官方文档说得并不硬，
         而它一旦不这么做，后果是**所有深链接刷新后全 404**。所以这里补一道：
         把原始路径记进 sessionStorage 再跳回子站首页，应用启动时取回来用
         replaceState 还原（ftms 那边见 src/main.tsx 的 RESCUE_KEY）——
         用户看到的地址和刷新前一模一样，历史记录里也不多一条。

         只对 SPA_PREFIXES 里列出的前缀做这件事：非 SPA 的站有自己的真 404，
         把它们也跳走反而是帮倒忙。 */
      (function () {
        var list = window.SPA_PREFIXES || [];
        var p = location.pathname;
        for (var i = 0; i < list.length; i++) {
          /* `p !== list[i]` 这半句是**防死循环**的，不是多余的边界判断。

             少了它：万一 /ftms/ 本身也 404（子站没部署上、或被误删），
             跳到 /ftms/ → 又 404 → 又回到这一页 → 再跳 /ftms/ …
             浏览器会一直转圈，比直接显示 404 难查得多，用户还看不出发生了什么。

             加上之后，「子站根路径都打不开」就落回下面那张 404 —— 那时候
             站是真没了，说实话才是对的。 */
          if (p.indexOf(list[i]) === 0 && p !== list[i]) {
            try {
              sessionStorage.setItem("ftms:deeplink", p + location.search + location.hash);
            } catch (e) {}
            location.replace(list[i]);
            return;
          }
        }
      })();
    </script>

    <style>
      :root { --bg:#f4f6fb; --text:#131c30; --dim:#7a86a0; --accent:#3b5bd6; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#070d1c; --text:#e9eefc; --dim:#7d8bab; --accent:#6f8dff; }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        padding: 40px 20px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.7 "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB",
          "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      b { font-size: 42px; letter-spacing: 0.04em; }
      p { margin: 0; color: var(--dim); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <b>404</b>
    <p>这个地址上没有东西。</p>
    <p><a href="/">回首页</a></p>
  </body>
</html>
